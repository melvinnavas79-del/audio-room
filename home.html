<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lluvia Live - Sala Pro</title>
    <style>
        /* Ajuste total para Android y iPhone */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, #1e267b 0%, #050510 100%); 
            font-family: 'Segoe UI', sans-serif; overflow: hidden; color: white;
        }
        
        .room-header { 
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* Rejilla de asientos ProMax */
        .seats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            padding: 40px 15px;
            justify-items: center;
        }

        .seat {
            width: 85px; height: 85px; /* Más grandes para Android */
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 2px dashed rgba(0, 242, 255, 0.3);
            color: #00f2ff; font-size: 11px; transition: 0.3s;
            cursor: pointer; position: relative;
        }

        .seat.active { 
            border: 3px solid #00f2ff; 
            background: rgba(0, 242, 255, 0.2); 
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
            color: white; 
        }

        .seat img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        /* Controles inferiores de lujo */
        .bottom-controls {
            position: fixed; bottom: 0; width: 100%; height: 80px;
            display: flex; justify-content: space-around; align-items: center;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .btn-round {
            width: 50px; height: 50px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer; transition: 0.2s;
        }

        .btn-mic { background: #4caf50; color: white; box-shadow: 0 4px 10px rgba(76, 175, 80, 0.4); }
        .btn-gift { background: #e91e63; color: white; box-shadow: 0 4px 10px rgba(233, 30, 99, 0.4); }
        .btn-exit { background: #333; color: white; }
    </style>
</head>
<body>

<div class="room-header">
    <div>☔ <b>LLUVIA LIVE</b></div>
    <div style="color: #ffeb3b; font-weight: bold;">💰 <span id="coins">1.5M</span></div>
</div>

<div class="seats-container" id="seats-box">
    </div>

<div class="bottom-controls">
    <button class="btn-round btn-exit" onclick="window.location.href='home.html'">🚪</button>
    <button class="btn-round btn-mic" id="mic-toggle">🎤</button>
    <button class="btn-round btn-gift" onclick="alert('¡Regalo enviado! 🎁')">🎁</button>
    <button class="btn-round" style="background:#2196f3">💬</button>
</div>

<script>
    const seatsBox = document.getElementById('seats-box');
    const savedName = localStorage.getItem("username") || "Melvin";
    let miAsiento = null;

    // Generar 9 asientos dinámicos
    for (let i = 1; i <= 9; i++) {
        const seat = document.createElement('div');
        seat.className = 'seat';
        seat.innerHTML = `<span>${i}</span>`;
        seat.onclick = () => ocuparAsiento(i, seat);
        seatsBox.appendChild(seat);
    }

    function ocuparAsiento(num, element) {
        if (miAsiento === num) {
            // Bajarse del asiento
            element.classList.remove('active');
            element.innerHTML = `<span>${num}</span>`;
            miAsiento = null;
        } else if (miAsiento === null) {
            // Subirse al asiento
            element.classList.add('active');
            element.innerHTML = `<img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${savedName}">`;
            miAsiento = num;
        } else {
            alert("Ya estás ocupando un lugar.");
        }
    }

    // Botón de Micrófono
    const micBtn = document.getElementById('mic-toggle');
    let micOn = false;
    micBtn.onclick = () => {
        micOn = !micOn;
        micBtn.style.background = micOn ? "#2196f3" : "#4caf50";
        micBtn.innerHTML = micOn ? "🔊" : "🎤";
    };
</script>

</body>
</html>
