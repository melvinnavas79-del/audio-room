<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lluvia Live</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif;
            background: radial-gradient(circle at center, #1a237e 0%, #000000 100%);
            display: flex; justify-content: center; align-items: center; color: white; }
        .login-container { text-align: center; width: 90%; max-width: 380px; padding: 30px; background: rgba(255,255,255,0.05); border-radius: 30px; backdrop-filter: blur(10px); }
        .logo { font-size: 80px; margin-bottom: 5px; }
        .btn-google { width: 100%; height: 55px; background: white; border: none; border-radius: 15px; color: #1a237e; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">☔</div>
        <h1>Lluvia Live</h1>
        <p>Premium Social Audio</p>
        <button class="btn-google" onclick="loginGoogle()">🚀 INGRESAR CON GOOGLE</button>
    </div>

    <script>
        // Estos datos son necesarios, pero GitHub se queja. 
        // En la versión final los pondremos en variables de entorno.
        const firebaseConfig = {
            apiKey: "AIzaSyA9sdOfg7f55DX7Ej_TK_BJHrNFTmtr5J4",
            authDomain: "lluvia-live-69a05.firebaseapp.com",
            projectId: "lluvia-live-69a05",
            storageBucket: "lluvia-live-69a05.firebasestorage.app",
            messagingSenderId: "909704512499",
            appId: "1:909704512499:web:95c5dd9ac567a452610886"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        async function loginGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await firebase.auth().signInWithPopup(provider);
                localStorage.setItem("username", result.user.displayName);
                // Salto directo al Home para evitar la pantalla azul
                window.location.href = "home.html";
            } catch (error) {
                alert("Servidor despertando... intenta en 10 segundos.");
            }
        }
    </script>
</body>
</html>
