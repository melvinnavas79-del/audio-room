<!DOCTYPE html>
<html>
<head>
    <title>Lluvia Live - Entrada</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>

<body style="background:black; color:white; text-align:center; padding-top:100px; font-family: Arial;">

    <h1 style="color: #00ff00;">☔ Lluvia Live</h1>
    
    <input type="text" id="name" placeholder="Tu nombre" style="padding:10px; border-radius:5px;"><br><br>

    <button onclick="crear()" style="padding:10px 20px; background:green; color:white; border:none; border-radius:5px;">Crear sala</button>
    <button onclick="entrar()" style="padding:10px 20px; background:blue; color:white; border:none; border-radius:5px;">Entrar</button>

    <script>
        // CONEXIÓN A TU RENDER (ESTO ES LO IMPORTANTE)
        const socket = io("https://audio-room-1.onrender.com");

        function crear() {
            const name = document.getElementById("name").value;
            if (!name) return alert("Escribe tu nombre");
            
            localStorage.setItem("username", name);
            const room = Math.random().toString(36).substring(7);
            window.location.href = "room.html?room=" + room;
        }

        function entrar() {
            const name = document.getElementById("name").value;
            const room = prompt("ID de sala");
            if (!name || !room) return;

            localStorage.setItem("username", name);
            window.location.href = "room.html?room=" + room;
        }
    </script>
</body>
</html>
