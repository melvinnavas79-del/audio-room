<div class="login-container">
    <div class="logo">☔</div>
    <h1>Lluvia Live</h1>
    <div class="slogan">Conecta, Chatea, Vive</div>
    
    <input type="text" id="userEmail" class="fake-input" placeholder="Correo electrónico" style="color:white; outline:none;">
    <input type="password" id="userPass" class="fake-input" placeholder="Contraseña" style="color:white; outline:none;">

    <button class="btn-login" onclick="loginGoogle()" style="margin-bottom:10px;">🚀 INGRESAR CON GOOGLE</button>
    
    <div style="display:flex; gap:10px;">
        <button onclick="loginManual()" style="flex:1; background:#444; color:white; border-radius:20px; padding:10px; border:none; font-size:12px;">ENTRAR</button>
        <button onclick="registroManual()" style="flex:1; background:#ff00ff; color:white; border-radius:20px; padding:10px; border:none; font-size:12px;">REGISTRARSE</button>
    </div>

    <p style="font-size:12px; margin-top:20px; color:rgba(255,255,255,0.6);">¿Olvidaste tu contraseña?</p>
</div>

<script>
// --- FUNCIONES DE ACCESO ---

function loginGoogle() {
    const p = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(p).then(r => {
        localStorage.setItem("username", r.user.displayName);
        window.location.href = "room.html";
    });
}

function registroManual() {
    const email = document.getElementById("userEmail").value;
    const pass = document.getElementById("userPass").value;
    if(!email || !pass) return alert("Llena los campos");
    
    firebase.auth().createUserWithEmailAndPassword(email, pass)
        .then(() => alert("¡Cuenta creada! Ahora puedes entrar."))
        .catch(e => alert("Error: " + e.message));
}

function loginManual() {
    const email = document.getElementById("userEmail").value;
    const pass = document.getElementById("userPass").value;
    
    firebase.auth().signInWithEmailAndPassword(email, pass)
        .then(r => {
            localStorage.setItem("username", email.split('@')[0]);
            window.location.href = "room.html";
        })
        .catch(e => alert("Error: " + e.message));
}
</script>
