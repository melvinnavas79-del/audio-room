<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lluvia Live - Bienvenida</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif;
            background: radial-gradient(circle at center, #3547b9 0%, #1e267b 100%);
            display: flex; justify-content: center; align-items: center; color: white; overflow: hidden; }
        .login-container { text-align: center; width: 90%; max-width: 350px; }
        .logo { font-size: 70px; margin-bottom: 10px; }
        h1 { font-size: 32px; margin: 0; font-weight: bold; }
        .slogan { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 40px; }
        .fake-input { width: 100%; height: 45px; background: rgba(255,255,255,0.1); border: 2px solid #ff00ff; border-radius: 25px; margin-bottom: 15px; display: flex; align-items: center; padding: 0 20px; box-sizing: border-box; color: rgba(255,255,255,0.5); font-size: 14px; }
        .btn-login { width: 100%; height: 48px; background: linear-gradient(to right, #ff4081, #f50057); border: none; border-radius: 25px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 4px 15px rgba(245, 0, 87, 0.4); }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">☔</div>
        <h1>Lluvia Live</h1>
        <div class="slogan">Conecta, Chatea, Vive</div>
        <div class="fake-input">Nombre de usuario</div>
        <div class="fake-input">Contraseña</div>
        <button class="btn-login" onclick="login()">🚀 INGRESAR CON GOOGLE</button>
    </div>
    <script>
        firebase.initializeApp({projectId:"lluvia-live-69a05"});
        function login() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider).then(result => {
                localStorage.setItem("username", result.user.displayName);
                window.location.href = "room.html"; 
            }).catch(e => alert("Error: " + e.message));
        }
    </script>
</body>
</html>
