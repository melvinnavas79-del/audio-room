<div id="modal-tienda" class="modal">
    <h2 style="color:#00d2ff">Tienda VIP</h2>
    <div style="background: #333; padding: 15px; border-radius: 10px; margin-bottom: 15px;">
        <p style="color: #ffd700; font-weight: bold;">Beneficios SVIP:</p>
        <ul style="text-align: left; font-size: 13px; color: #ccc;">
            <li>Etiqueta SVIP roja exclusiva</li>
            <li>Prioridad en entrada a salas</li>
            <li>Color de nombre especial</li>
        </ul>
    </div>
    <button class="modal-btn" style="background: linear-gradient(90deg, #ff0000, #b30000); color: white;" onclick="comprarVIP('SVIP', 2000)">
        👑 ACTIVAR SVIP (2000 Oro)
    </button>
    <button class="modal-btn" onclick="cerrarModal()">Cerrar</button>
</div>

<script>
    // --- FUNCIÓN PARA PROCESAR LA COMPRA VIP ---
    async function comprarVIP(tipo, costo) {
        if (!nombre) return alert("Inicia sesión primero");
        
        const userRef = db.collection("usuarios").doc(nombre);
        
        try {
            const doc = await userRef.get();
            if (!doc.exists) return alert("Usuario no encontrado");

            const oroActual = doc.data().oro || 0;

            if (oroActual >= costo) {
                // 1. Descontar el Oro
                // 2. Cambiar el estado de 'svip' a true
                await userRef.update({ 
                    oro: firebase.firestore.FieldValue.increment(-costo),
                    svip: true 
                });
                
                alert("¡Felicidades Melvin! Ya tienes el rango " + tipo);
                cerrarModal();
            } else {
                alert("No tienes suficiente oro para el VIP. Te faltan " + (costo - oroActual));
            }
        } catch (e) {
            console.error("Error en VIP:", e);
            alert("Error al procesar la compra");
        }
    }

    // --- ACTUALIZACIÓN DE PERFIL EN TIEMPO REAL ---
    // Esto hace que la etiqueta SVIP roja aparezca sola al comprarla
    function escucharDatosUsuario() {
        db.collection("usuarios").doc(nombre).onSnapshot(doc => {
            if (doc.exists) {
                const data = doc.data();
                document.getElementById('oro-txt').innerText = data.oro || 0;
                
                // Mostrar u ocultar la etiqueta roja según la base de datos
                const tag = document.getElementById('svip-tag');
                if (data.svip) {
                    tag.style.display = 'inline-block';
                } else {
                    tag.style.display = 'none';
                }
            }
        });
    }
</script>
