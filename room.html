<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lluvia Live - Sala Pro Events</title>
    <style>
        :root { 
            --safe-top: env(safe-area-inset-top, 20px); 
            --safe-bottom: env(safe-area-inset-bottom, 20px); 
            --accent: #00f2ff;
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at top, #1e1b4b 0%, #050510 100%); 
            font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; color: white;
        }

        .app-container { display: flex; flex-direction: column; height: 100vh; padding-top: var(--safe-top); }

        /* HEADER CON PREMIOS SEMANALES */
        .header { 
            padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* BANNER DE EVENTOS (Los que decías de 25M, 35M, 45M) */
        .event-bar {
            background: linear-gradient(90deg, #b45309, #78350f);
            margin: 10px; padding: 8px 15px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; font-weight: bold; border: 1px solid rgba(255,215,0,0.3);
        }

        .seats-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 15px; padding: 15px; flex: 1; align-content: start;
        }

        .seat {
            aspect-ratio: 1/1; background: rgba(255,255,255,0.05);
            border-radius: 20px; border: 1.5px dashed rgba(0, 242, 255, 0.2);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 14px; color: var(--accent); transition: 0.3s; position: relative;
        }

        .seat.active { border: 2px solid var(--accent); background: rgba(0, 242, 255, 0.1); }
        .seat img { width: 100%; height: 100%; border-radius: 18px; object-fit: cover; }

        /* PANEL DE EVENTOS RAPIDOS */
        .quick-events {
            display: flex; gap: 10px; padding: 0 15px; overflow-x: auto; margin-bottom: 10px;
        }
        .ev-card {
            min-width: 100px; padding: 8px; border-radius: 10px; text-align: center;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1);
        }
        .ev-king { background: rgba(234, 179, 8, 0.2); border-color: #eab308; color: #fde047; }

        /* FOOTER NAV */
        .footer-nav {
            background: rgba(0,0,0,0.9); padding: 15px 10px calc(15px + var(--safe-bottom));
            display: flex; justify-content: space-around; border-top: 1px solid rgba(255,255,255,0.1);
        }

        .btn-circle {
            width: 50px; height: 50px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center; font-size: 22px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div>☔ <b>LLUVIA LIVE</b></div>
        <div style="color: #fbbf24; font-weight: bold;">💰 <span id="balance">1.5M</span></div>
    </div>

    <div class="event-bar">
        <span>🏆 EVENTO SEMANAL</span>
        <span style="color: #fde047;">META: 45M / 100M</span>
    </div>

    <div class="quick-events">
        <div class="ev-card ev-king">👑 KING<br><small>45,000,000</small></div>
        <div class="ev-card" style="color: #60a5fa; border-color: #60a5fa;">🥈 PRO<br><small>35,000,000</small></div>
        <div class="ev-card" style="color: #f472b6; border-color: #f472b6;">💖 CP<br><small>25,000,000</small></div>
    </div>

    <div class="seats-grid" id="seats-box"></div>

    <div class="footer-nav">
        <button class="btn-circle" style="background: #374151;" onclick="window.location.href='home.html'">🚪</button>
        <button class="btn-circle" style="background: #eab308;" onclick="abrirTienda()">🛒</button>
        <button class="btn-circle" style="background: #10b981;" id="mic-btn">🎤</button>
        <button class="btn-circle" style="background: #ec4899;" onclick="solicitarPremio()">🎁</button>
        <button class="btn-circle" style="background: #8b5cf6;" onclick="abrirJuegos()">🎮</button>
    </div>
</div>

<script>
    const box = document.getElementById('seats-box');
    const myName = localStorage.getItem("username") || "Melvin";
    let currentSeat = null;

    // Crear asientos
    for (let i = 1; i <= 9; i++) {
        const s = document.createElement('div');
        s.className = 'seat';
        s.innerHTML = `<span>${i}</span>`;
        s.onclick = () => {
            if (currentSeat === i) {
                s.classList.remove('active'); s.innerHTML = `<span>${i}</span>`; currentSeat = null;
            } else if (currentSeat === null) {
                s.classList.add('active');
                s.innerHTML = `<img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${myName}">`;
                currentSeat = i;
            }
        };
        box.appendChild(s);
    }

    // Lógica de Premios y Eventos
    function solicitarPremio() {
        const monto = prompt("¿De cuánto es el evento? (25, 35 o 45)");
        if (monto == "45") {
            alert("🔥 ¡Evento KING activado! Meta: 45,000,000. ¡A por ello!");
        } else if (monto == "35") {
            alert("⚡ ¡Evento PRO activado! Meta: 35,000,000.");
        } else if (monto == "25") {
            alert("💖 ¡Evento CP activado! Meta: 25,000,000.");
        } else {
            alert("Panel de regalos abierto");
        }
    }

    function abrirJuegos() { alert("Cargando Tragamonedas y Ludo..."); }
    function abrirTienda() { alert("Tienda de Aristocracia: VIP, Rey, Dueño"); }

    const mic = document.getElementById('mic-btn');
    let isOn = false;
    mic.onclick = () => {
        if(!currentSeat) return alert("Súbete a un asiento");
        isOn = !isOn;
        mic.style.background = isOn ? "#ef4444" : "#10b981";
        mic.innerHTML = isOn ? "🔇" : "🎤";
    };
</script>

</body>
</html>
