<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lluvia Live - Identidad VIP</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: linear-gradient(180deg, #1a0033, #3d0066); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; height: 100vh; overflow: hidden; }
        
        /* Header con Identidad */
        .header-panel { background: rgba(0,0,0,0.8); width: 92%; margin: 10px auto; padding: 15px; border-radius: 25px; border: 2px solid #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.4); }
        .user-name { color: #ffd700; font-size: 1.2rem; font-weight: bold; display: block; margin-bottom: 5px; text-shadow: 0 0 10px #ffd700; }
        .stats { display: flex; justify-content: space-around; font-size: 0.9rem; border-top: 1px solid #444; pt: 8px; }
        
        .aristocracia { background: linear-gradient(90deg, #ffd700, #ff8c00); color: black; font-weight: bold; padding: 6px 25px; border-radius: 20px; display: inline-block; margin-top: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        /* Botones de Sala */
        .btn-pink { background: #ff0066; color: white; padding: 12px; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; width: 85%; margin-top: 10px; }
        .controls { display: flex; justify-content: center; gap: 35px; margin-top: 20px; }
        .circle-btn { width: 70px; height: 70px; border-radius: 50%; border: none; font-size: 28px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.6); }
        .btn-on { background: #00ff00; color: black; border: 3px solid white; }
        .btn-off { background: #ff3333; color: white; }

        /* MODAL DE BILLETERA DE LUJO */
        #wallet-modal { display: none; position: fixed; top: 15%; left: 5%; width: 90%; background: #222; border: 3px solid #ffd700; border-radius: 30px; padding: 20px; z-index: 1000; box-shadow: 0 0 100px black; box-sizing: border-box;}
        .wallet-title { color: #ffd700; font-size: 1.5rem; margin-bottom: 15px; }
        .price-opt { background: linear-gradient(90deg, #333, #444); margin: 12px 0; padding: 15px; border-radius: 15px; cursor: pointer; border: 1.5px solid #ffd700; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .price-opt:active { transform: scale(0.95); }
        .close-btn { background: #ff3333; color: white; border: none; padding: 12px 30px; border-radius: 10px; font-weight: bold; margin-top: 10px; width: 100%; }

        /* Footer */
        .footer-actions { position: fixed; bottom: 25px; width: 100%; display: flex; justify-content: space-evenly; align-items: center; }
        .action-btn { width: 60px; height: 60px; border-radius: 50%; border: 2px solid white; font-weight: bold; cursor: pointer; font-size: 11px; }
        .wallet-btn { background: #ffd700; color: black; box-shadow: 0 0 20px #ffd700; }
        .gift-btn { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(45deg, #ff0066, #ffcc00); border: none; font-size: 35px; cursor: pointer; box-shadow: 0 0 30px #ff0066; }
        .vip-btn { background: #00d2ff; color: white; box-shadow: 0 0 20px #00d2ff; }
    </style>
</head>
<body>

    <div class="header-panel">
        <span class="user-name" id="display-name">Cargando...</span>
        <div class="stats">
            <span>💰 Oro: <b id="user-oro">...</b></span>
            <span style="color: #00ffcc;">🛡️ Clan: Lluvia</span>
        </div>
        <div class="aristocracia">🏆 Noble (Aristocracia)</div>
    </div>

    <div id="room-display" style="color: #ffd700; margin-top: 10px; font-weight: bold;">📍 Sala: ...</div>
    <button class="btn-pink" onclick="unmuteAudio()">🔊 ESCUCHAR SALA</button>

    <div class="controls">
        <div><button id="mic-btn" class="circle-btn btn-off" onclick="toggleMic()">🎙️</button><p>Micro</p></div>
        <div><button id="spk-btn" class="circle-btn btn-on" onclick="toggleSpeaker()">🔊</button><p>Bocina</p></div>
    </div>

    <div id="wallet-modal">
        <h3 class="wallet-title">💳 RECARGA ORO</h3>
        <div class="price-opt" onclick="comprarOro(100)"><span>🪙 100 Oros</span> <span style="color: #00ff00;">$0.99</span></div>
        <div class="price-opt" onclick="comprarOro(1100)"><span>🪙 1100 Oros</span> <span style="color: #00ff00;">$9.99</span></div>
        <div class="price-opt" onclick="comprarOro(5000)"><span>🪙 5500 Oros</span> <span style="color: #00ff00;">$49.99</span></div>
        <button class="close-btn" onclick="cerrarWallet()">CANCELAR</button>
    </div>

    <div class="footer-actions">
        <button class="action-btn wallet-btn" onclick="abrirWallet()">💳<br>Billetera</button>
        <button class="gift-btn" onclick="enviarRegalo()">🎁</button>
        <button class="action-btn vip-btn" onclick="alert('Tienda VIP Próximamente')">👑<br>VIP</button>
    </div>

    <audio id="remote-audio" autoplay playsinline></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4",
            authDomain: "lluvia-live-69a05.firebaseapp.com",
            projectId: "lluvia-live-69a05",
            storageBucket: "lluvia-live-69a05.firebasestorage.app",
            messagingSenderId: "909704512499",
            appId: "1:909704512499:web:a8f0d658fb6dbd3f610886"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- SISTEMA DE IDENTIDAD ---
        let nombreUsuario = localStorage.getItem('nombre_lluvia');
        if (!nombreUsuario) {
            nombreUsuario = prompt("¡Bienvenido a Lluvia Live! ¿Cuál es tu nombre de usuario?") || "Usuario_" + Math.floor(Math.random()*1000);
            localStorage.setItem('nombre_lluvia', nombreUsuario);
        }
        document.getElementById('display-name').innerText = "👤 " + nombreUsuario;

        // Conectar a Firebase con el nombre del usuario
        db.collection("usuarios").doc(nombreUsuario).onSnapshot((doc) => {
            if (doc.exists) {
                document.getElementById('user-oro').innerText = doc.data().oro;
            } else {
                db.collection("usuarios").doc(nombreUsuario).set({ oro: 500, rango: "Noble", clan: "Lluvia" });
            }
        });

        // Funciones Wallet
        function abrirWallet() { document.getElementById('wallet-modal').style.display = 'block'; }
        function cerrarWallet() { document.getElementById('wallet-modal').style.display = 'none'; }
        function comprarOro(cant) {
            db.collection("usuarios").doc(nombreUsuario).update({ oro: firebase.firestore.FieldValue.increment(cant) })
              .then(() => { alert("¡Recarga exitosa!"); cerrarWallet(); });
        }

        function enviarRegalo() {
            db.collection("usuarios").doc(nombreUsuario).update({ oro: firebase.firestore.FieldValue.increment(-10) });
        }

        // --- AUDIO ---
        const roomID = "100"; 
        document.getElementById('room-display').innerText = "📍 Sala ID: " + roomID;
        const peer = new Peer('lluvia-' + roomID + '-' + nombreUsuario);
        let myStream, mic = false, spk = true;

        function unmuteAudio() { document.getElementById('remote-audio').play(); }

        async function toggleMic() {
            if (!myStream) {
                myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                peer.on('call', c => { c.answer(myStream); c.on('stream', s => document.getElementById('remote-audio').srcObject = s); });
            }
            mic = !mic;
            myStream.getAudioTracks()[0].enabled = mic;
            document.getElementById('mic-btn').className = mic ? "circle-btn btn-on" : "circle-btn btn-off";
        }

        function toggleSpeaker() {
            spk = !spk;
            document.getElementById('remote-audio').muted = !spk;
            document.getElementById('spk-btn').className = spk ? "circle-btn btn-on" : "circle-btn btn-off";
        }
    </script>
</body>
</html>
