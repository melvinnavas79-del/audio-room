<style>
    /* Nueva Sección de Fotos Estilo Instagram */
    #fotos-section { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:12000; overflow-y:auto; }
    .foto-card { width:90%; margin:15px auto; border-radius:15px; overflow:hidden; background:#1a1a1a; border:1px solid #333; }
    .foto-img { width:100%; display:block; }
    
    /* Brillo SVIP para Sillas */
    .svip-aura { box-shadow: 0 0 20px #ff00ff !important; border: 2px solid #ff00ff !important; }
    .vip-aura { box-shadow: 0 0 15px #ffd700 !important; border: 2px solid #ffd700 !important; }
</style>

<div style="position:fixed; top:120px; right:10px; display:flex; flex-direction:column; gap:10px; z-index:100;">
    <button onclick="abrirSeccion('fotos-section')" style="background:#8a2be2; border:none; border-radius:50%; width:50px; height:50px; font-size:20px;">📸</button>
</div>

<div id="fotos-section">
    <div style="padding:20px; display:flex; justify-content:space-between; align-items:center;">
        <h2 style="color:white; margin:0;">📸 Galería Lluvia</h2>
        <button onclick="cerrarSeccion('fotos-section')" style="color:white; background:none; border:none; font-size:25px;">✕</button>
    </div>
    <div id="contenedor-fotos">
        <div class="foto-card"><img src="https://via.placeholder.com/400x400" class="foto-img"></div>
    </div>
    <button onclick="document.getElementById('upload-foto').click()" style="position:fixed; bottom:30px; right:30px; background:#ffd700; color:black; width:60px; height:60px; border-radius:50%; font-size:30px; border:none; font-weight:bold;">+</button>
    <input type="file" id="upload-foto" accept="image/*" style="display:none" onchange="subirFotoLluvia(this)">
</div>

<script>
// ==========================================
// 🎙️ REPARACIÓN DE AUDIO (PEERJS)
// ==========================================
function conectarAudioFuerte() {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        localStream = stream;
        const call = peer.call('lluvia-' + room + '-B', stream);
        call.on('stream', remoteStream => {
            const audio = document.getElementById('remote-audio');
            audio.srcObject = remoteStream;
            audio.play(); // Forzar encendido
            alert("✅ Audio Conectado");
        });
    }).catch(err => alert("⚠️ Error Micrófono: " + err));
}

// ==========================================
// 🎁 REPARACIÓN DE REGALOS Y RECARGA
// ==========================================
async function enviarRegaloReal(costo, tipo) {
    const userRef = db.collection("usuarios").doc(nombre);
    try {
        await db.runTransaction(async (transaction) => {
            const doc = await transaction.get(userRef);
            const oro = doc.data().oro || 0;
            if (oro < costo) throw "❌ No tienes oro. ¡Recarga!";
            
            transaction.update(userRef, { oro: oro - costo });
            // Registrar regalo en la sala
            transaction.set(db.collection("salas").doc(room).collection("regalos").doc(), {
                de: nombre, regalo: tipo, timestamp: Date.now()
            });
        });
        alert("🎁 Enviado: " + tipo);
    } catch (e) { alert(e); abrirModal('modal-wallet'); }
}

// ==========================================
// 👑 SISTEMA SVIP Y VIP ACTIVO
// ==========================================
async function comprarRango(tipo, costo) {
    const userRef = db.collection("usuarios").doc(nombre);
    const doc = await userRef.get();
    const oro = doc.data().oro || 0;

    if(oro >= costo) {
        await userRef.update({ oro: oro - costo, nivel: tipo });
        alert("🔥 ¡Ahora eres " + tipo + "!");
        location.reload(); // Recargar para aplicar brillo
    } else {
        alert("💰 Oro insuficiente para ser " + tipo);
    }
}

function abrirSeccion(id) { document.getElementById(id).style.display = 'block'; }
function cerrarSeccion(id) { document.getElementById(id).style.display = 'none'; }
</script>
