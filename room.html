<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lluvia Live - Versión Final</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=AWOafs7E7hOuryPjXYaHIMvKeWhSgH65Fejg2eyY4b0BY_7xoClV0xhc45Zdr7Y5MhMGSCefLgl6X18&currency=USD"></script>

    <style>
        body { margin: 0; background: #1a0033; color: white; font-family: sans-serif; text-align: center; }
        .header-sala { background: rgba(0,0,0,0.85); padding: 15px; border: 2px solid #ffd700; border-radius: 20px; width: 90%; margin: 15px auto; }
        .info-row { display: flex; justify-content: space-around; font-size: 16px; margin: 10px 0; font-weight: bold; }
        
        /* BOTÓN DE AUDIO (LA BOCINA) */
        .btn-bocina { background: #222; border: 2px solid #00ff00; border-radius: 15px; padding: 15px 30px; display: inline-flex; align-items: center; gap: 15px; cursor: pointer; margin: 20px 0; }
        .bocina-on { border-color: #ffd700; box-shadow: 0 0 15px #ffd700; }

        /* MICRÓFONO */
        .mic-icon { width: 85px; height: 85px; border-radius: 50%; border: 3px solid #ffd700; background: #331a4d; font-size: 35px; display: inline-flex; align-items: center; justify-content: center; margin-top: 10px; }
        .mic-active { background: #ffd700; color: black; box-shadow: 0 0 20px #ffd700; }

        /* BILLETERA */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a0033; z-index: 5000; padding-top: 20px; overflow-y: auto; }
        .card { background: #222; border: 2px solid #ffd700; border-radius: 25px; width: 90%; margin: auto; padding: 25px; box-sizing: border-box; }
        .btn-pack { background: #333; border: 2px solid #ffd700; color: white; width: 100%; padding: 20px; margin-bottom: 15px; border-radius: 15px; display: flex; justify-content: space-between; font-size: 20px; font-weight: bold; cursor: pointer; }
        
        .btn-wallet { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #ffd700; color: black; padding: 20px 60px; border-radius: 50px; font-weight: bold; border: none; font-size: 20px; box-shadow: 0 0 20px #ffd700; }
    </style>
</head>
<body>

    <div class="header-sala">
        <div style="font-size: 24px; color: #ffd700;">👤 100</div>
        <div class="info-row">
            <span>💰 Oro: <span id="oro-txt" style="color:#ffd700;">...</span></span>
            <span>🛡️ Clan: <span style="color:#ff4444;">Lluvia</span></span>
        </div>
        <div style="color: #ffd700;">💎 Aristocracia <span style="color: #ff00ff; text-shadow: 0 0 10px #ff00ff;">SVIP</span></div>
    </div>

    <div id="mic-viz" class="mic-icon">🎙️</div>
    <br>

    <div id="bocina-master" class="btn-bocina" onclick="controlAudio()">
        <span style="font-size: 30px;">🔊</span>
        <span id="bocina-status" style="font-weight: bold; color: #00ff00;">AUDIO: APAGADO</span>
    </div>

    <button class="btn-wallet" onclick="abrirBilletera()">💳 IR A BILLETERA</button>

    <div id="modal-pago" class="modal">
        <div class="card">
            <h2 style="color: #ffd700; margin-bottom: 25px;">Comprar Oros</h2>
            
            <div class="btn-pack" onclick="pagar('0.99', 100)">
                <span>🪙 100 Oros</span> <span>$0.99</span>
            </div>
            <div class="btn-pack" onclick="pagar('9.99', 1100)">
                <span>🪙 1100 Oros</span> <span>$9.99</span>
            </div>
            <div class="btn-pack" onclick="pagar('49.99', 6000)">
                <span>🪙 6000 Oros</span> <span>$49.99</span>
            </div>

            <div id="paypal-container" style="margin-top: 20px;"></div>
            
            <button onclick="cerrarBilletera()" style="margin-top: 30px; background: #ff4444; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold;">VOLVER</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4",
            authDomain: "lluvia-live-69a05.firebaseapp.com",
            projectId: "lluvia-live-69a05",
            storageBucket: "lluvia-live-69a05.firebasestorage.app",
            messagingSenderId: "909704512499",
            appId: "1:909704512499:web:a8f0d658fb6dbd3f610886"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let userId = "Melvin_User";

        // Actualizar Oro en tiempo real
        db.collection("usuarios").doc(userId).onSnapshot(doc => {
            if(doc.exists) document.getElementById('oro-txt').innerText = doc.data().oro || 0;
        });

        // CONTROL DE AUDIO (APAGAR Y ENCENDER)
        let encendido = false;
        function controlAudio() {
            encendido = !encendido;
            const btn = document.getElementById('bocina-master');
            const txt = document.getElementById('bocina-status');
            const mic = document.getElementById('mic-viz');

            if(encendido) {
                btn.classList.add('bocina-on');
                txt.innerText = "AUDIO: ENCENDIDO";
                txt.style.color = "#ffd700";
                mic.classList.add('mic-active');
                // Desbloquea el audio del navegador
                const audio = new Audio();
                audio.play().catch(() => {});
            } else {
                btn.classList.remove('bocina-on');
                txt.innerText = "AUDIO: APAGADO";
                txt.style.color = "#00ff00";
                mic.classList.remove('mic-active');
            }
        }

        function abrirBilletera() { document.getElementById('modal-pago').style.display = 'block'; }
        function cerrarBilletera() { 
            document.getElementById('modal-pago').style.display = 'none';
            document.getElementById('paypal-container').innerHTML = ""; 
        }

        // LÓGICA DE PAYPAL QUE NO FALLA
        function pagar(monto, cantidad) {
            const container = document.getElementById('paypal-container');
            container.innerHTML = ""; // Limpia recargas anteriores

            paypal.Buttons({
                style: { layout: 'vertical', color: 'gold', shape: 'pill' },
                createOrder: (data, actions) => {
                    return actions.order.create({
                        purchase_units: [{ amount: { value: monto } }]
                    });
                },
                onApprove: (data, actions) => {
                    return actions.order.capture().then(details => {
                        db.collection("usuarios").doc(userId).update({
                            oro: firebase.firestore.FieldValue.increment(cantidad)
                        });
                        alert("¡Melvin, recarga de " + cantidad + " oros lista!");
                        cerrarBilletera();
                    });
                }
            }).render('#paypal-container');
        }
    </script>
</body>
</html>
