<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lluvia Live - Versión Pro</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=AWOafs7E7hOuryPjXYaHIMvKeWhSgH65Fejg2eyY4b0BY_7xoClV0xhc45Zdr7Y5MhMGSCefLgl6X18&currency=USD"></script>

    <style>
        body { margin: 0; background: #1a0033; color: white; font-family: sans-serif; text-align: center; }
        
        /* Cabecera con Oro y Clan */
        .header-sala { background: rgba(0,0,0,0.8); padding: 15px; border: 2px solid #ffd700; border-radius: 20px; width: 90%; margin: 15px auto; box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
        .info-row { display: flex; justify-content: space-around; font-size: 18px; margin: 10px 0; font-weight: bold; }
        
        /* Aristocracia SVIP */
        .aristocracia-box { border-top: 1px solid #444; margin-top: 10px; padding-top: 10px; }
        .txt-svip { color: #ff00ff; font-weight: bold; text-shadow: 0 0 10px #ff00ff; font-size: 20px; }

        /* Micrófono y Bocina */
        .audio-section { margin-top: 40px; }
        .mic-btn { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #ffd700; background: #331a4d; font-size: 45px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: 0.3s; }
        .mic-on { background: #ffd700; color: black; box-shadow: 0 0 30px #ffd700; }
        .bocina-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 20px; }

        /* Billetera y Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a0033; z-index: 1000; overflow-y: auto; padding-top: 20px; }
        .card { background: #222; border: 2px solid #ffd700; border-radius: 25px; width: 85%; margin: auto; padding: 20px; box-shadow: 0 0 20px black; }
        .btn-pack { background: #333; border: 1px solid #ffd700; color: white; width: 100%; padding: 18px; margin-bottom: 12px; border-radius: 15px; display: flex; justify-content: space-between; font-size: 18px; cursor: pointer; }
        
        .btn-abrir { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #ffd700; color: black; padding: 20px 60px; border-radius: 40px; font-weight: bold; border: none; font-size: 20px; box-shadow: 0 0 25px #ffd700; }
    </style>
</head>
<body>

    <div class="header-sala">
        <div style="font-size: 26px; color: #ffd700;">👤 100</div>
        <div class="info-row">
            <span>💰 Oro: <span id="oro-txt" style="color:#ffd700;">Cargando...</span></span>
            <span>🛡️ Clan: <span style="color:#ff4444;">Lluvia</span></span>
        </div>
        <div class="aristocracia-box">
            <span style="color: #ffd700; font-size: 18px;">💎 Aristocracia</span> <span class="txt-svip">SVIP</span>
            <div style="color: #00ff00; margin-top: 5px;">📍 Sala: 100</div>
        </div>
    </div>

    <div class="audio-section">
        <div id="btn-mic" class="mic-btn" onclick="toggleMic()">🎙️</div>
        <div class="bocina-row">
            <span style="font-size: 30px;">🔊</span>
            <span id="audio-txt" style="color: #00ff00; font-weight: bold; font-size: 18px;">Audio Conectado</span>
        </div>
    </div>

    <button class="btn-abrir" onclick="abrirBilletera()">💳 IR A BILLETERA</button>

    <div id="modal-pago" class="modal">
        <div class="card">
            <h2 style="color: #ffd700; margin-bottom: 20px;">Selecciona un Paquete</h2>
            
            <button class="btn-pack" onclick="renderPayPal('0.99', 100)">
                <span>🪙 100 Oros</span> <b>$0.99</b>
            </button>
            <button class="btn-pack" onclick="renderPayPal('9.99', 1100)">
                <span>🪙 1100 Oros</span> <b>$9.99</b>
            </button>
            <button class="btn-pack" onclick="renderPayPal('49.99', 6000)">
                <span>🪙 6000 Oros</span> <b>$49.99</b>
            </button>

            <div id="paypal-container" style="margin-top: 25px; min-height: 150px;"></div>
            
            <button onclick="cerrarBilletera()" style="margin-top: 20px; background: none; border: 1px solid #ff4444; color: #ff4444; padding: 15px; width: 100%; border-radius: 10px; font-size: 16px;">Volver</button>
        </div>
    </div>

    <script>
        // FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4",
            authDomain: "lluvia-live-69a05.firebaseapp.com",
            projectId: "lluvia-live-69a05",
            storageBucket: "lluvia-live-69a05.firebasestorage.app",
            messagingSenderId: "909704512499",
            appId: "1:909704512499:web:a8f0d658fb6dbd3f610886"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let userId = "Melvin_User";

        // Listener de Oro
        db.collection("usuarios").doc(userId).onSnapshot(doc => {
            if(doc.exists) document.getElementById('oro-txt').innerText = doc.data().oro || 0;
        });

        // Lógica Micrófono
        let micActivo = false;
        function toggleMic() {
            micActivo = !micActivo;
            const btn = document.getElementById('btn-mic');
            const txt = document.getElementById('audio-txt');
            if(micActivo) {
                btn.classList.add('mic-on');
                txt.innerText = "Transmitiendo...";
                txt.style.color = "#ffd700";
            } else {
                btn.classList.remove('mic-on');
                txt.innerText = "Audio Conectado";
                txt.style.color = "#00ff00";
            }
        }

        // Billetera
        function abrirBilletera() { document.getElementById('modal-pago').style.display = 'block'; }
        function cerrarBilletera() { 
            document.getElementById('modal-pago').style.display = 'none'; 
            document.getElementById('paypal-container').innerHTML = ""; 
        }

        // REPARACIÓN DE PAYPAL
        function renderPayPal(monto, cantidad) {
            const container = document.getElementById('paypal-container');
            container.innerHTML = "<p style='color: #ffd700;'>Cargando botones de pago...</p>"; 

            paypal.Buttons({
                style: { layout: 'vertical', color: 'gold', shape: 'rect', label: 'paypal' },
                createOrder: (data, actions) => {
                    return actions.order.create({
                        purchase_units: [{ description: "Compra Oro Lluvia Live", amount: { value: monto } }]
                    });
                },
                onApprove: (data, actions) => {
                    return actions.order.capture().then(details => {
                        db.collection("usuarios").doc(userId).update({
                            oro: firebase.firestore.FieldValue.increment(cantidad)
                        });
                        alert("¡Gracias Melvin! Se han añadido " + cantidad + " oros.");
                        cerrarBilletera();
                    });
                },
                onError: (err) => {
                    console.error(err);
                    alert("Error al cargar PayPal. Intenta de nuevo.");
                }
            }).render('#paypal-container').then(() => {
                // Quitamos el texto de "Cargando" una vez que el botón aparece
                if(container.firstChild.tagName === 'P') container.removeChild(container.firstChild);
            });
        }
    </script>
</body>
</html>
