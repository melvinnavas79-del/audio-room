<!DOCTYPE html>
<html>
<head>
    <title>Lluvia Live - Entrada</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body style="background:black; color:white; text-align:center; padding-top:100px; font-family: Arial;">
    <h1 style="color: #00ff00;">☔ Lluvia Live</h1>
    <p>Panel de Control</p>
    <input type="text" id="name" placeholder="Tu nombre" style="padding:15px; border-radius:10px; border:none; width:200px;"><br><br>
    <button onclick="crear()" style="padding:15px 30px; background:#00ff00; color:black; border:none; border-radius:50px; font-weight:bold; cursor:pointer;">CREAR SALA</button>
    <script>
        const socket = io("https://audio-room-1.onrender.com");
        function crear() {
            const name = document.getElementById("name").value;
            if (!name) return alert("Escribe tu nombre");
            localStorage.setItem("username", name);
            const room = Math.random().toString(36).substring(7);
            window.location.href = "room.html?room=" + room;
        }
    </script>
</body>
</html>
