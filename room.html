<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lluvia Live PRO Fix</title>
<style>
:root { --gold:#ffd700; --blue-pk:#0084ff; --red-pk:#ff004c; --dark-bg:#0b0015; }
body { margin:0; background:var(--dark-bg); color:white; font-family: sans-serif; height:100vh; overflow:hidden; position: fixed; width: 100%; }

/* PK HEADER */
.pk-container { display:flex; height:45px; border-bottom: 2px solid var(--gold); }
.pk-team { width:50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }
.pk-blue { background: var(--blue-pk); }
.pk-red { background: var(--red-pk); }

/* PERFIL */
.header-card { background: rgba(255,255,255,0.05); width:90%; margin:10px auto; padding:10px; border-radius:15px; border:1px solid var(--gold); display:flex; align-items: center; gap:10px; }

/* SILLAS */
.grid-sala { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; padding:15px; }
.silla { background: rgba(255,255,255,0.1); width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; border: 1px solid #444; position: relative; font-size: 20px; }
.silla-active { border-color: #00ff00; box-shadow: 0 0 15px #00ff00; color: #00ff00; }
.silla-num { position: absolute; bottom: -5px; background: var(--gold); color: black; font-size: 10px; padding: 1px 4px; border-radius: 4px; font-weight: bold; }

/* CONTROLES INFERIORES */
.footer-controls { position: absolute; bottom: 100px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; }

.mic-btn { background: #111; border: 2px solid var(--gold); padding: 12px 30px; border-radius: 30px; font-weight: bold; color: var(--gold); cursor: pointer; z-index: 100; }
.mic-on { background: #ff004c; color: white; box-shadow: 0 0 15px #ff004c; }

.btn-row { display: flex; gap: 20px; align-items: center; }
.btn-circle { width:60px; height:60px; border-radius:50%; border:2px solid var(--gold); background:#1a1a1a; display:flex; align-items:center; justify-content:center; font-size:25px; }
.btn-main { width:80px; height:80px; background: red; font-size: 35px; }

/* MODALES (RECARGA Y REGALOS) */
.panel-slide { position: fixed; bottom: -100%; left: 0; width: 100%; height: 50%; background: #150025; border-top: 3px solid var(--gold); border-radius: 20px 20px 0 0; transition: 0.3s; z-index: 1000; padding: 20px; box-sizing: border-box; }
.panel-slide.open { bottom: 0; }
.grid-items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
.item-card { background: #222; padding: 10px; border-radius: 10px; text-align: center; border: 1px solid #444; }
</style>
</head>
<body>

<div class="pk-container">
    <div class="pk-blue">CLAN NAVAS: 0</div>
    <div class="pk-red">CLAN RIVAL: 0</div>
</div>

<div class="header-card">
    <div style="width:45px; height:45px; background:#333; border-radius:50%; border:2px solid var(--gold); display:flex; align-items:center; justify-content:center;">👤</div>
    <div style="flex-grow:1"><b>Melvin</b><br><span style="color:var(--gold)">💰 <span id="oro-val">2000</span></span></div>
</div>

<div class="grid-sala">
    <div class="silla" id="s1">👤<div class="silla-num">1</div></div>
    <div class="silla">👤<div class="silla-num">2</div></div>
    <div class="silla">👤<div class="silla-num">3</div></div>
    <div class="silla">👤<div class="silla-num">4</div></div>
    <div class="silla">👤<div class="silla-num">5</div></div>
    <div class="silla">👤<div class="silla-num">6</div></div>
    <div class="silla">👤<div class="silla-num">7</div></div>
    <div class="silla">👤<div class="silla-num">8</div></div>
    <div class="silla">👤<div class="silla-num">9</div></div>
</div>

<div class="footer-controls">
    <div class="mic-btn" id="mic-btn" onclick="toggleMic()">🎤 ENCENDER MICRO</div>

    <div class="btn-row">
        <div class="btn-circle" style="border-color:#00ff00;" onclick="togglePanel('panel-recarga')">🏦</div>
        <div class="btn-circle btn-main" onclick="togglePanel('panel-regalos')">🎁</div>
        <div class="btn-circle" style="background:#1a237e;" onclick="alert('Tienda VIP')">👑</div>
    </div>
</div>

<div id="panel-recarga" class="panel-slide">
    <div style="display:flex; justify-content:space-between;"><b>RECARGAR ORO</b> <span onclick="togglePanel('panel-recarga')">✕</span></div>
    <div class="grid-items">
        <div class="item-card" onclick="recargar(1000)">📦 1k<br><small>$0.99</small></div>
        <div class="item-card" onclick="recargar(5000)">📦 5k<br><small>$4.99</small></div>
        <div class="item-card" onclick="recargar(10000)">📦 10k<br><small>$9.99</small></div>
    </div>
</div>

<div id="panel-regalos" class="panel-slide">
    <div style="display:flex; justify-content:space-between;"><b>ENVIAR REGALO</b> <span onclick="togglePanel('panel-regalos')">✕</span></div>
    <div class="grid-items">
        <div class="item-card" onclick="regalar('Rosa', 10)">🌹<br>10</div>
        <div class="item-card" onclick="regalar('Anillo', 500)">💍<br>500</div>
        <div class="item-card" onclick="regalar('León', 1000)">🦁<br>1k</div>
    </div>
</div>

<script>
let micOn = false;

function toggleMic() {
    micOn = !micOn;
    const btn = document.getElementById('mic-btn');
    const silla = document.getElementById('s1');
    if(micOn) {
        btn.innerText = "🔴 MICRO ENCENDIDO";
        btn.classList.add('mic-on');
        silla.innerHTML = '🎤<div class="silla-num">1</div>';
        silla.classList.add('silla-active');
    } else {
        btn.innerText = "🎤 ENCENDER MICRO";
        btn.classList.remove('mic-on');
        silla.innerHTML = '👤<div class="silla-num">1</div>';
        silla.classList.remove('silla-active');
    }
}

function togglePanel(id) {
    document.querySelectorAll('.panel-slide').forEach(p => {
        if(p.id !== id) p.classList.remove('open');
    });
    document.getElementById(id).classList.toggle('open');
}

function recargar(cant) {
    let oro = parseInt(document.getElementById('oro-val').innerText);
    document.getElementById('oro-val').innerText = oro + cant;
    alert("Recarga exitosa: +" + cant);
    togglePanel('panel-recarga');
}

function regalar(nom, costo) {
    let oro = parseInt(document.getElementById('oro-val').innerText);
    if(oro < costo) { alert("Oro insuficiente"); return; }
    document.getElementById('oro-val').innerText = oro - costo;
    alert("Enviaste " + nom);
    togglePanel('panel-regalos');
}
</script>
</body>
</html>
