<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lluvia Live - Edición Final Pro</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Arial', sans-serif; text-align: center; height: 100vh; overflow-x: hidden; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .logo-box { font-size: 45px; font-weight: bold; color: #00ffcc; text-shadow: 0 0 15px #00ffcc; margin-bottom: 30px; }
        
        #main-app { display: none; background: linear-gradient(180deg, #0f001e 0%, #000 100%); min-height: 100vh; padding-bottom: 120px; }
        
        /* BANNER ARISTOCRACIA Y CLANES */
        #premium-header { width: 94%; margin: 10px auto; background: rgba(20, 20, 30, 0.9); border-radius: 25px; border: 2px solid #ffd700; overflow: hidden; box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
        
        /* SILLAS PRO CON BRILLO VIP */
        .sala-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px; }
        .silla-container { position: relative; width: 70px; margin: 0 auto; }
        .silla-box { width: 65px; height: 65px; border-radius: 50%; border: 2px solid #444; background: #1a1a1a; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .silla-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .silla-on { border-color: #00ff00; box-shadow: 0 0 15px #00ff00; }
        .vip-border { border: 2px solid #ffd700; box-shadow: 0 0 15px #ffd700; }

        /* REELS SCREEN */
        #reels-screen { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:9999; }
        #videoPlayer { width:100%; height:100%; object-fit:cover; }

        /* ANIMACIÓN DE REGALOS */
        #gift-overlay { position: fixed; top: 20%; width: 100%; pointer-events: none; z-index: 11000; }
        .gift-anim { background: rgba(0,0,0,0.7); color: gold; padding: 15px; border-radius: 30px; border: 2px solid gold; animation: popIn 3s ease-out forwards; }

        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; border: 2px solid #ffd700; border-radius: 20px; padding: 25px; width: 80%; z-index: 10000; }
        .modal-btn { background: #fff; color: #000; border: none; padding: 15px; margin: 8px 0; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; }

        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 20% { transform: scale(1.2); opacity: 1; } 80% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.5); opacity: 0; } }
    </style>
</head>
<body>

    <div id="gift-overlay"></div>

    <div id="login-screen">
        <div class="logo-box">☔ Lluvia Live</div>
        <input type="text" id="user-name" style="width:80%; padding:15px; margin:10px; border-radius:12px;" placeholder="Tu Nombre" value="Melvin">
        <input type="text" id="room-id" style="width:80%; padding:15px; margin:10px; border-radius:12px;" placeholder="ID de Sala" value="1234">
        <button onclick="entrarSala('A')" style="width:85%; padding:18px; background:#008000; color:white; border-radius:12px; border:none; font-weight:bold;">INGRESAR A LLUVIA</button>
    </div>

    <div id="main-app">
        <div id="premium-header">
            <div style="display: flex; align-items: center; justify-content: space-around; padding: 12px;">
                <div style="text-align: center;">🛡️ <br> <span style="font-size:9px;">CLANES</span></div>
                <div onclick="abrirModal('modal-tienda')" style="text-align: center; cursor: pointer;">
                    <div style="color: #ffd700; font-size: 14px; font-weight: bold; text-shadow: 0 0 10px #ffd700;">👑 ARISTOCRACIA SVIP</div>
                    <div style="color:white; font-size:10px;">💰 Oro: <span id="oro-txt">0</span></div>
                </div>
                <div onclick="abrirModal('modal-wallet')" style="text-align: center; cursor: pointer;">💰 <br> <span style="font-size:9px;">RECARGA</span></div>
            </div>
        </div>

        <div class="sala-grid" id="grid-sillas"></div>

        <div style="display:flex; justify-content:center; gap:20px;">
            <button id="mic-btn" onclick="toggleMicro()" style="width:60px; height:60px; border-radius:50%; background:#ff3333; border:none; font-size:25px;">🎙️</button>
            <button id="spk-btn" onclick="toggleBocina()" style="width:60px; height:60px; border-radius:50%; background:#00ff00; border:none; font-size:25px;">🔊</button>
        </div>

        <div style="position:fixed; bottom:20px; width:100%; display:flex; justify-content:space-around; align-items:center;">
            <button onclick="abrirReels()" style="background:linear-gradient(45deg, #f09433, #e6683c, #dc2743); width:70px; height:70px; border-radius:50%; border:none; font-size:30px;">🎬</button>
            <button onclick="abrirModal('modal-regalos')" style="background:orange; width:80px; height:80px; border-radius:50%; border:none; font-size:35px;">🎁</button>
        </div>
    </div>

    <div id="reels-screen">
        <video id="videoPlayer" autoplay loop playsinline onclick="siguienteVideo()"></video>
        <button onclick="cerrarReels()" style="position:absolute; top:40px; left:20px; color:white; font-size:30px; background:none; border:none;">✕</button>
        <button onclick="document.getElementById('fileInput').click()" style="position:absolute; bottom:110px; right:20px; background:rgba(0,0,0,0.6); color:white; border-radius:50%; width:50px; height:50px; border:none;">📤</button>
        <input type="file" id="fileInput" accept="video/*" style="display:none" onchange="subirVideoReal(this)">
    </div>

    <div id="modal-regalos" class="modal">
        <h2 style="color:#ff85a2">Enviar Regalo Real</h2>
        <button class="modal-btn" onclick="enviarRegaloReal('Rosa', 10)">🌹 Rosa (10 Oro)</button>
        <button class="modal-btn" onclick="enviarRegaloReal('Carro', 500)">🚗 Carro (500 Oro)</button>
        <button class="modal-btn" style="background:#ff3333; color:white;" onclick="cerrarModal()">Cerrar</button>
    </div>

    <audio id="remote-audio" autoplay playsinline></audio>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4", projectId: "lluvia-live-69a05", storageBucket: "lluvia-live-69a05.appspot.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        let peer, localStream, role, room, nombre;
        let videoIdx = 0;
        let videosReels = ["https://www.w3schools.com/html/mov_bbb.mp4"];

        // GENERAR SILLAS
        const grid = document.getElementById('grid-sillas');
        for(let i=1; i<=9; i++) {
            grid.innerHTML += `<div class="silla-container"><div class="silla-box" id="silla-${i}">👤</div><div id="name-${i}" style="font-size:10px; margin-top:5px;">Libre</div></div>`;
        }

        async function entrarSala(tipo) {
            nombre = document.getElementById('user-name').value;
            room = document.getElementById('room-id').value;
            role = tipo;
            if(!nombre || !room) return;

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';

            peer = new Peer('lluvia-' + room + '-' + role);

            // Escuchar Datos Usuario y Wallet
            db.collection("usuarios").doc(nombre).onSnapshot(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    document.getElementById('oro-txt').innerText = data.oro || 0;
                    actualizarSillaFirebase(data);
                }
            });

            // Escuchar Sillas y Regalos en tiempo real
            db.collection("salas").doc(room).onSnapshot(doc => {
                const data = doc.data() || {};
                for(let i=1; i<=9; i++) {
                    const s = data["silla"+i];
                    if(s) {
                        document.getElementById("silla-"+i).innerHTML = `<img src="${s.gif || 'https://via.placeholder.com/60'}" class="silla-img">`;
                        document.getElementById("name-"+i).innerText = s.nombre + (s.verificado ? " ☑️" : "");
                    }
                }
            });

            // Escuchar Animación de Regalos
            db.collection("salas").doc(room).collection("regalos").onSnapshot(snap => {
                snap.docChanges().forEach(change => {
                    if (change.type === "added") {
                        const r = change.doc.data();
                        mostrarAnimacion(r.de, r.regalo);
                    }
                });
            });

            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', s => { document.getElementById('remote-audio').srcObject = s; });
            });
        }

        // ==========================================
        // 💰 WALLET Y REGALOS (TRANSACCIÓN REAL)
        // ==========================================
        async function enviarRegaloReal(regalo, costo) {
            const donanteRef = db.collection("usuarios").doc(nombre);
            const salaRef = db.collection("salas").doc(room).collection("regalos");

            try {
                await db.runTransaction(async (transaction) => {
                    const doc = await transaction.get(donanteRef);
                    const oro = doc.data().oro || 0;
                    if (oro < costo) throw "Oro insuficiente";
                    
                    transaction.update(donanteRef, { oro: oro - costo });
                    transaction.add(salaRef, { de: nombre, regalo: regalo, timestamp: Date.now() });
                });
                cerrarModal();
            } catch (e) { alert(e); }
        }

        function mostrarAnimacion(usuario, regalo) {
            const overlay = document.getElementById("gift-overlay");
            overlay.innerHTML = `<div class="gift-anim">🎁 ${usuario} envió ${regalo}!</div>`;
            setTimeout(() => overlay.innerHTML = "", 3000);
        }

        // --- REELS Y SUBIDA ---
        async function subirVideoReal(input) {
            const file = input.files[0];
            if(!file) return;
            alert("Subiendo a Lluvia Live...");
            const ref = storage.ref(`reels/${Date.now()}_${file.name}`);
            await ref.put(file);
            const url = await ref.getDownloadURL();
            videosReels.push(url);
            alert("¡Video listo!");
        }

        function abrirReels() { document.getElementById("reels-screen").style.display = "block"; siguienteVideo(); }
        function cerrarReels() { document.getElementById("reels-screen").style.display = "none"; }
        function siguienteVideo() { videoIdx = (videoIdx + 1) % videosReels.length; document.getElementById("videoPlayer").src = videosReels[videoIdx]; }

        // --- AUDIO ---
        async function toggleMicro() {
            if (!localStream) {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                peer.call('lluvia-' + room + '-' + (role === 'A' ? 'B' : 'A'), localStream);
            }
            const e = !localStream.getAudioTracks()[0].enabled;
            localStream.getAudioTracks()[0].enabled = e;
            document.getElementById('mic-btn').style.background = e ? "#00ff00" : "#ff3333";
        }
        function toggleBocina() { const a = document.getElementById('remote-audio'); a.muted = !a.muted; document.getElementById('spk-btn').style.background = a.muted ? "#ff3333" : "#00ff00"; }
        function abrirModal(id) { document.getElementById(id).style.display = 'block'; }
        function cerrarModal() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); }
        async function actualizarSillaFirebase(data) {
            const sId = (role === 'A') ? 1 : 2;
            await db.collection("salas").doc(room).set({ ["silla"+sId]: { nombre: nombre, gif: data.gif, verificado: data.verificado } }, { merge: true });
        }
    </script>
</body>
</html>
