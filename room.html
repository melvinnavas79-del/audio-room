<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lluvia Live PRO</title>

<!-- 🔥 PEERJS -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body { margin:0; background:#0b001a; color:white; font-family:sans-serif; }

/* LOGIN */
#login { 
    position:fixed; inset:0; background:#000; 
    display:flex; flex-direction:column; 
    justify-content:center; align-items:center;
}

input { padding:15px; margin:10px; border-radius:10px; border:none; width:80%; }

button { padding:15px; margin:5px; border:none; border-radius:10px; width:80%; }

/* APP */
#app { display:none; text-align:center; }

.sillas { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; padding:20px; }

.circle { width:60px; height:60px; border-radius:50%; background:#1a1a1a; display:flex; align-items:center; justify-content:center; margin:auto; }

.bar { position:fixed; bottom:40px; width:100%; display:flex; justify-content:space-evenly; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
    <h2>Entrar a Sala</h2>
    <input id="nombre" placeholder="Tu nombre">
    <input id="room" placeholder="ID sala">
    <button onclick="entrar('A')">Crear Sala</button>
    <button onclick="entrar('B')">Entrar</button>
</div>

<!-- APP -->
<div id="app">
    <h3>Sala: <span id="roomTxt"></span></h3>
    <div class="sillas" id="sillas"></div>

    <div class="bar">
        <button onclick="toggleMic()">🎤</button>
        <button onclick="toggleSpk()">🔊</button>
    </div>
</div>

<audio id="audio" autoplay playsinline></audio>

<script>

// =======================
// 🔥 FIREBASE CONFIG
// =======================
const firebaseConfig = {
    apiKey: "AIzaSyXXXX",
    authDomain: "lluvia-live.firebaseapp.com",
    projectId: "lluvia-live-69a05"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// =======================
// VARIABLES
// =======================
let peer, stream;
let role, room, nombre;

// =======================
// ENTRAR SALA
// =======================
async function entrar(tipo){

    nombre = document.getElementById("nombre").value;
    room = document.getElementById("room").value;
    role = tipo;

    if(!nombre || !room){
        alert("Faltan datos");
        return;
    }

    // 🎤 activar mic
    try{
        stream = await navigator.mediaDevices.getUserMedia({audio:true});
    }catch{
        alert("Permite micrófono");
        return;
    }

    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("roomTxt").innerText = room;

    // 🔥 PEERJS
    peer = new Peer("room-"+room+"-"+role, {
        host: "0.peerjs.com",
        port: 443,
        secure: true
    });

    // recibir audio
    peer.on("call", call=>{
        call.answer(stream);

        call.on("stream", s=>{
            document.getElementById("audio").srcObject = s;
        });
    });

    // llamar al otro
    peer.on("open", ()=>{
        setTimeout(()=>{
            let destino = role === "A" ? "B" : "A";

            let call = peer.call("room-"+room+"-"+destino, stream);

            if(call){
                call.on("stream", s=>{
                    document.getElementById("audio").srcObject = s;
                });
            }
        },2000);
    });

    crearSillas();
    escucharSillas();
}

// =======================
// 🎤 MICRO
// =======================
function toggleMic(){

    if(!stream) return;

    let estado = !stream.getAudioTracks()[0].enabled;
    stream.getAudioTracks()[0].enabled = estado;

    alert(estado ? "🎤 Mic ON" : "🎤 Mic OFF");
}

// =======================
// 🔊 BOCINA
// =======================
function toggleSpk(){
    let audio = document.getElementById("audio");
    audio.muted = !audio.muted;
}

// =======================
// 🪑 CREAR SILLAS
// =======================
function crearSillas(){

    let div = document.getElementById("sillas");
    div.innerHTML = "";

    for(let i=1;i<=9;i++){
        div.innerHTML += `
        <div onclick="sentarse(${i})">
            <div class="circle" id="silla-${i}">👤</div>
            <small>Silla ${i}</small>
        </div>`;
    }
}

// =======================
// 🪑 SENTARSE (FIREBASE)
// =======================
async function sentarse(num){

    await db.collection("salas").doc(room).set({
        ["silla"+num]: {
            nombre: nombre
        }
    }, { merge:true });

}

// =======================
// 👥 ESCUCHAR TIEMPO REAL
// =======================
function escucharSillas(){

    db.collection("salas").doc(room).onSnapshot(doc=>{

        const data = doc.data() || {};

        for(let i=1;i<=9;i++){

            const silla = data["silla"+i];

            if(silla){
                document.getElementById("silla-"+i).innerHTML = `
                    👤<br><small>${silla.nombre}</small>
                `;
            }else{
                document.getElementById("silla-"+i).innerHTML = "👤";
            }
        }

    });

}

</script>

</body>
</html>
