<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lluvia Live - Solución Definitiva</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=AWOafs7E7hOuryPjXYaHIMvKeWhSgH65Fejg2eyY4b0BY_7xoClV0xhc45Zdr7Y5MhMGSCefLgl6X18&currency=USD"></script>

    <style>
        body { margin: 0; background: #1a0033; color: white; font-family: sans-serif; text-align: center; overflow-x: hidden; }
        .header-sala { background: rgba(0,0,0,0.9); padding: 15px; border: 2px solid #ffd700; border-radius: 20px; width: 90%; margin: 15px auto; }
        
        /* BOTONES GRANDES PARA QUE EL IPHONE NO LOS BLOQUEE */
        .btn-accion { background: #222; border: 2px solid #ffd700; border-radius: 15px; padding: 20px; width: 85%; margin: 10px auto; color: white; font-weight: bold; font-size: 18px; cursor: pointer; display: block; }
        .encendido { border-color: #00ff00; color: #00ff00; box-shadow: 0 0 10px #00ff00; }
        
        /* BILLETERA */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a0033; z-index: 10000; padding-top: 20px; }
        .card-pago { background: #222; border: 2px solid #ffd700; border-radius: 20px; width: 90%; margin: auto; padding: 20px; box-sizing: border-box; }
        .opcion-oro { background: #333; border: 1px solid #ffd700; padding: 15px; margin-bottom: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        .btn-wallet-fijo { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #ffd700; color: black; padding: 15px 40px; border-radius: 30px; font-weight: bold; border: none; font-size: 18px; z-index: 999; }
    </style>
</head>
<body>

    <div class="header-sala">
        <div style="font-size: 22px; color: #ffd700;">👤 100</div>
        <div style="display: flex; justify-content: space-around; margin: 10px 0;">
            <span>💰 Oro: <span id="oro-cont" style="color:#ffd700;">0</span></span>
            <span>🛡️ Clan: <span style="color:#ff4444;">Lluvia</span></span>
        </div>
    </div>

    <div style="margin-top: 30px;">
        <button id="master-audio" class="btn-accion" onclick="activarAudio()">🔊 ACTIVAR SONIDO</button>
        
        <button id="master-mic" class="btn-accion" onclick="activarMicro()">🎙️ ENCENDER MICRO</button>
    </div>

    <button class="btn-wallet-fijo" onclick="abrirTienda()">💳 COMPRAR ORO</button>

    <div id="tienda" class="modal">
        <div class="card-pago">
            <h2 style="color: #ffd700;">Recarga de Oro</h2>
            
            <div class="opcion-oro" onclick="generarPaypal('0.99', 100)">
                <span>🪙 100 Oros</span> <b>$0.99</b>
            </div>
            <div class="opcion-oro" onclick="generarPaypal('9.99', 1100)">
                <span>🪙 1100 Oros</span> <b>$9.99</b>
            </div>
            <div class="opcion-oro" onclick="generarPaypal('49.99', 6000)">
                <span>🪙 6000 Oros</span> <b>$49.99</b>
            </div>

            <div id="paypal-render" style="margin-top: 20px; min-height: 150px;"></div>
            
            <button onclick="cerrarTienda()" style="margin-top: 20px; width: 100%; padding: 12px; background: #ff4444; color: white; border: none; border-radius: 10px;">Cerrar</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4",
            authDomain: "lluvia-live-69a05.firebaseapp.com",
            projectId: "lluvia-live-69a05",
            storageBucket: "lluvia-live-69a05.firebasestorage.app",
            messagingSenderId: "909704512499",
            appId: "1:909704512499:web:a8f0d658fb6dbd3f610886"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let userId = "Melvin_User";

        // Leer Oro Real (Sin "Cargando")
        db.collection("usuarios").doc(userId).onSnapshot(doc => {
            document.getElementById('oro-cont').innerText = doc.exists ? (doc.data().oro || 0) : 0;
        });

        // FUNCIONES DE AUDIO Y MICRO (POR SEPARADO)
        let audioPrendido = false;
        function activarAudio() {
            audioPrendido = !audioPrendido;
            const b = document.getElementById('master-audio');
            b.innerText = audioPrendido ? "🔊 SONIDO: ON" : "🔊 ACTIVAR SONIDO";
            b.classList.toggle('encendido', audioPrendido);
            
            // Esto "despierta" el audio en iPhone
            const aCtx = new (window.AudioContext || window.webkitAudioContext)();
            aCtx.resume();
        }

        let microPrendido = false;
        function activarMicro() {
            microPrendido = !microPrendido;
            const b = document.getElementById('master-mic');
            b.innerText = microPrendido ? "🎙️ MICRO: ON" : "🎙️ ENCENDER MICRO";
            b.classList.toggle('encendido', microPrendido);
        }

        // BILLETERA
        function abrirTienda() { document.getElementById('tienda').style.display = 'block'; }
        function cerrarTienda() { 
            document.getElementById('tienda').style.display = 'none'; 
            document.getElementById('paypal-render').innerHTML = "";
        }

        function generarPaypal(precio, cantidad) {
            const container = document.getElementById('paypal-render');
            container.innerHTML = "<p>Cargando botones de PayPal...</p>";
            
            paypal.Buttons({
                style: { layout: 'vertical', color: 'gold', shape: 'pill' },
                createOrder: (data, actions) => {
                    return actions.order.create({
                        purchase_units: [{ amount: { value: precio } }]
                    });
                },
                onApprove: (data, actions) => {
                    return actions.order.capture().then(details => {
                        db.collection("usuarios").doc(userId).update({
                            oro: firebase.firestore.FieldValue.increment(cantidad)
                        });
                        alert("¡Melvin, recarga exitosa!");
                        cerrarTienda();
                    });
                }
            }).render('#paypal-render');
        }
    </script>
</body>
</html>
