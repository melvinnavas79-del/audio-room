<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lluvia Live - SVIP Edition</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { 
            --gold: #ffd700; --silver: #c0c0c0; --bronze: #cd7f32;
            --svip10: linear-gradient(45deg, #ff0000, #ffd700); 
            --bg-dark: #0b0015;
        }
        body { margin: 0; background: var(--bg-dark); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; height: 100vh; overflow: hidden; }
        
        /* TARJETA DE PERFIL DINÁMICA */
        .header-card { 
            background: rgba(20, 0, 40, 0.95); width: 92%; margin: 10px auto; padding: 15px; 
            border-radius: 20px; border: 2px solid var(--gold); position: relative;
            transition: all 0.5s ease;
        }
        
        /* MEDALLAS SVIP */
        .svip-badge {
            display: inline-block; padding: 2px 10px; border-radius: 20px;
            font-weight: bold; font-size: 11px; margin-top: 5px;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        .svip-1-3 { background: var(--bronze); color: white; }
        .svip-4-7 { background: var(--silver); color: black; }
        .svip-8-10 { background: var(--gold); color: black; animation: shine 2s infinite; }

        @keyframes shine { 0% { opacity: 0.8; } 50% { opacity: 1; transform: scale(1.05); } 100% { opacity: 0.8; } }

        /* BARRA DE PROGRESO SVIP */
        .svip-bar-container { width: 80%; background: #333; height: 8px; border-radius: 10px; margin: 10px auto; overflow: hidden; border: 1px solid #555; }
        #svip-progress { width: 0%; height: 100%; background: var(--gold); transition: width 1s ease; }

        /* SILLAS */
        .grid-sala { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 10px; }
        .silla { background: rgba(255,255,255,0.05); width: 60px; height: 60px; border-radius: 50%; border: 1px solid #333; margin: 0 auto; display: flex; align-items: center; justify-content: center; }

        /* BOTONES ABAJO */
        .footer-nav { position: fixed; bottom: 20px; width: 100%; display: flex; justify-content: center; gap: 15px; }
        .btn-circle { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 20px; cursor: pointer; }

        #btn-admin { position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 24px; display: none; cursor: pointer; }
    </style>
</head>
<body>

    <div id="main-app">
        <div id="card-main" class="header-card">
            <button id="btn-admin" onclick="alert('Abriendo Panel...')">⚙️</button>
            <div style="width:75px; height:75px; border-radius:50%; border:3px solid var(--gold); margin: 0 auto; overflow:hidden;">
                <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" style="width:100%;">
            </div>
            
            <div style="margin-top:10px;">
                <b id="nick" style="font-size: 18px;">---</b>
            </div>

            <div id="svip-label" class="svip-badge">SVIP 0</div>
            
            <div class="svip-bar-container">
                <div id="svip-progress"></div>
            </div>
            <div style="font-size: 10px; color: #aaa;">Próximo nivel: <span id="next-svip">---</span></div>

            <div style="font-size:14px; color:var(--gold); margin-top:10px;">💰 Oro: <span id="oro-txt">0</span></div>
        </div>

        <div class="grid-sala" id="sillas-box"></div>

        <div class="footer-nav">
            <button class="btn-circle" style="background:#222; border:1px solid #00ff00;">🏦</button>
            <button class="btn-circle" style="background:red; width:75px; height:75px; border:2px solid gold;">🎁</button>
            <button class="btn-circle" style="background:#1a237e; border:1px solid gold;">👑</button>
        </div>
    </div>

    <script>
        const config = { apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4", projectId: "lluvia-live-69a05" };
        firebase.initializeApp(config);
        const db = firebase.firestore();

        let user = "Melvin"; // Asegúrate de que este nombre sea igual al de tu Firebase

        for(let i=1; i<=9; i++) document.getElementById('sillas-box').innerHTML += `<div class="silla">👤</div>`;

        db.collection("usuarios").doc(user).onSnapshot(doc => {
            if(doc.exists) {
                const d = doc.data();
                const svip = d.svip_level || 1;
                const oro = d.oro || 0;

                document.getElementById('nick').innerText = user;
                document.getElementById('oro-txt').innerText = oro.toLocaleString();
                
                // LÓGICA VISUAL SVIP 1-10
                const label = document.getElementById('svip-label');
                const bar = document.getElementById('svip-progress');
                const card = document.getElementById('card-main');

                label.innerText = `SVIP ${svip}`;
                bar.style.width = `${svip * 10}%`; // La barra llena según el nivel
                document.getElementById('next-svip').innerText = svip < 10 ? `SVIP ${svip + 1}` : "MÁXIMO";

                // Cambiar colores según rango
                if(svip >= 8) {
                    label.className = "svip-badge svip-8-10";
                    card.style.borderColor = "var(--gold)";
                    card.style.boxShadow = "0 0 20px rgba(255,215,0,0.5)";
                } else if(svip >= 4) {
                    label.className = "svip-badge svip-4-7";
                    card.style.borderColor = "var(--silver)";
                } else {
                    label.className = "svip-badge svip-1-3";
                    card.style.borderColor = "var(--bronze)";
                }

                if(d.nivel_permiso >= 2) document.getElementById('btn-admin').style.display = 'block';
            }
        });
    </script>
</body>
</html>
