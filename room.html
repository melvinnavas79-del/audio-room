<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lluvia Live PRO FINAL</title><style>
:root { 
    --gold:#ffd700; 
    --svip:#00ffff;
    --king:#ff4500; 
    --bg:#0b001a; 
}

body {
    margin:0;
    background:var(--bg);
    color:white;
    font-family:sans-serif;
}

/* ===== SALA ===== */
.sillas-grid {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    padding:20px;
}

/* ===== AVATAR ===== */
.avatar {
    width:90px;
    height:90px;
    border-radius:50%;
    background:#1e1e2e;
    border:3px solid #444;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    transition:0.3s;
}

/* VIP */
.vip-border {
    border-color:var(--gold);
    box-shadow:0 0 15px var(--gold);
}

/* SVIP */
.svip-border {
    border-color:var(--svip);
    box-shadow:0 0 20px var(--svip);
}

/* BRILLO */
.avatar::before {
    content:"";
    position:absolute;
    width:140%;
    height:140%;
    background:conic-gradient(transparent, rgba(255,255,255,0.6), transparent);
    animation:rotate 4s linear infinite;
}

/* PARTICULAS */
.avatar::after {
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:radial-gradient(circle, rgba(255,255,255,0.3) 2px, transparent 2px);
    background-size:20px 20px;
    animation:sparkle 3s infinite;
}

/* BADGE NIVEL */
.nivel-badge {
    position:absolute;
    bottom:-8px;
    background:black;
    color:gold;
    font-size:10px;
    padding:2px 6px;
    border-radius:10px;
    border:1px solid gold;
}

/* CLAN */
.clan-tag {
    position:absolute;
    top:-6px;
    background:red;
    font-size:9px;
    padding:2px 6px;
    border-radius:5px;
}

/* VERIFICADO */
.verificado-check {
    position:absolute;
    bottom:5px;
    right:5px;
    background:#1da1f2;
    width:18px;
    height:18px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* CP */
.cp-heart {
    position:absolute;
    bottom:5px;
    left:5px;
    background:#ff4d4d;
    width:18px;
    height:18px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* ANIMACIONES */
@keyframes rotate {
    0%{transform:rotate(0)}
    100%{transform:rotate(360deg)}
}

@keyframes sparkle {
    0%,100%{opacity:0.3}
    50%{opacity:1}
}

</style></head><body><div class="sillas-grid" id="sillas"></div><script>

let miNombre = "Melvin";
let miClan = "Navas";
let miGif = "";

/* CREAR SILLAS */
function crearSillas(){
    const grid = document.getElementById("sillas");
    for(let i=1;i<=9;i++){
        grid.innerHTML += `
        <div onclick="sentarse(${i})">
            <div class="avatar" id="silla-${i}">👤</div>
            <div id="label-${i}">VACÍO</div>
        </div>`;
    }
}

crearSillas();

/* SENTARSE */
function sentarse(id){
    const silla = document.getElementById(`silla-${id}`);
    const label = document.getElementById(`label-${id}`);

    if(silla.classList.contains("talking")){
        silla.className="avatar";
        silla.innerHTML="👤";
        label.innerText="VACÍO";
    } else {

        const tipo = ["vip","svip","aristo"][Math.random()*3|0];

        let nivel=1, icono="⭐", color="var(--gold)", clase="vip-border";

        if(tipo==="vip"){
            nivel=Math.floor(Math.random()*10)+1;
            icono="⭐";
            clase="vip-border";
        }

        if(tipo==="svip"){
            nivel=Math.floor(Math.random()*9)+1;
            icono="💎";
            color="var(--svip)";
            clase="svip-border";
        }

        if(tipo==="aristo"){
            nivel=Math.floor(Math.random()*9)+1;
            icono="👑";
            color="var(--king)";
            clase="vip-border";
        }

        silla.className=`avatar talking ${clase}`;

        silla.innerHTML=`
        <div class="clan-tag">${miClan}</div>
        <div class="nivel-badge">${icono}${nivel}</div>
        <div class="verificado-check">✔</div>
        <div class="cp-heart">❤️</div>
        `;

        if(miGif){
            silla.style.backgroundImage=`url('${miGif}')`;
        }

        label.innerText=`${miNombre} ${icono}${nivel}`;
        label.style.color=color;

        animacionEntrada(silla);
    }
}

/* ANIMACION ENTRADA */
function animacionEntrada(el){
    el.style.transform="scale(0)";
    el.style.opacity="0";

    setTimeout(()=>{
        el.style.transition="all .4s";
        el.style.transform="scale(1.2)";
        el.style.opacity="1";

        setTimeout(()=>{
            el.style.transform="scale(1)";
        },200);

    },50);
}

</script></body>
</html>
