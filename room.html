<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lluvia Live - Full Fix</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Arial', sans-serif; text-align: center; height: 100vh; overflow: hidden; }
        
        /* PANTALLA DE INICIO */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .logo-box { font-size: 45px; font-weight: bold; color: #00ff00; margin-bottom: 30px; }
        .input-field { width: 80%; padding: 15px; margin: 10px 0; border-radius: 12px; border: none; font-size: 20px; text-align: center; background: #fff; color: #000; }
        .btn-row { display: flex; gap: 10px; width: 85%; margin-top: 20px; }
        .btn-action { flex: 1; padding: 18px; border-radius: 12px; border: none; font-weight: bold; font-size: 18px; color: white; cursor: pointer; }

        /* SALA */
        #main-app { display: none; background: #0f001e; height: 100vh; padding-top: 10px; position: relative; }
        .header-card { background: rgba(0,0,0,0.6); width: 92%; margin: 0 auto; padding: 15px; border-radius: 25px; border: 2px solid #ffd700; }
        .badge-noble { background: linear-gradient(90deg, #b8860b, #ffd700); color: black; font-weight: bold; padding: 8px 25px; border-radius: 20px; display: inline-block; font-size: 18px; }
        .tag-svip { background: #ff0000; color: white; padding: 5px 12px; border-radius: 10px; border: 1px solid white; font-size: 14px; vertical-align: middle; font-weight: bold; margin-left: 5px; box-shadow: 0 0 10px red; }

        /* Sillas */
        .sala-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; margin-top: 10px; }
        .silla-box { width: 65px; height: 65px; border-radius: 50%; border: 2px solid #444; background: #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 25px; margin: 0 auto; }
        .silla-on { border-color: #00ff00; box-shadow: 0 0 20px #00ff00; background: #003300; }

        /* Controles de Audio Centrales */
        .audio-main-controls { display: flex; justify-content: center; gap: 30px; margin: 15px 0; }
        .btn-circle-audio { width: 75px; height: 75px; border-radius: 50%; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; transition: 0.3s; }
        .btn-off { background: #ff3333; }
        .btn-on { background: #00ff00; box-shadow: 0 0 20px #00ff00; }

        /* Navegación Inferior */
        .bottom-nav { position: fixed; bottom: 30px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 20px; }
        .nav-item { width: 65px; height: 65px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; border: none; color: black; cursor: pointer; }

        /* Modales */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #222; border: 2px solid #ffd700; border-radius: 20px; padding: 25px; width: 85%; z-index: 10000; box-shadow: 0 0 30px rgba(255,215,0,0.3); }
        .modal-btn { background: #fff; color: #000; border: none; padding: 15px; margin: 8px 0; width: 100%; border-radius: 12px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="logo-box">☔ Lluvia Live</div>
        <input type="text" id="user-name" class="input-field" placeholder="Tu Nombre" value="Josue">
        <input type="text" id="room-id" class="input-field" placeholder="ID de Sala" value="1234">
        <div class="btn-row">
            <button class="btn-action" style="background:#008000" onclick="entrarSala('A')">Crear sala</button>
            <button class="btn-action" style="background:#0000ff" onclick="entrarSala('B')">Entrar</button>
        </div>
    </div>

    <div id="main-app">
        <div class="header-card">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span onclick="abrirModal('modal-wallet')">💰 Oro: <b id="oro-txt">0</b></span>
                <span style="color:#00ffcc">🛡️ Clan: Lluvia</span>
            </div>
            <div class="badge-noble">Noble (Aristocracia) <span id="svip-tag" class="tag-svip" style="display:none;">SVIP</span></div>
            <p style="color:#ff85a2; font-size:13px; margin-top:10px;">💕 C.P: Buscando pareja...</p>
        </div>

        <div style="margin: 10px 0; color:#ffd700; font-weight:bold; font-size:14px;">📍 ID SALA: <span id="id-view">---</span></div>

        <div class="audio-main-controls">
            <div onclick="toggleMicro()">
                <div id="mic-btn" class="btn-circle-audio btn-off">🎙️</div>
                <p style="font-size:12px; margin-top:5px;">Micro</p>
            </div>
            <div onclick="toggleBocina()">
                <div id="spk-btn" class="btn-circle-audio btn-on">🔊</div>
                <p style="font-size:12px; margin-top:5px;">Bocina</p>
            </div>
        </div>

        <div class="sala-grid" id="sillas-grid"></div>

        <div class="bottom-nav">
            <button class="nav-item" style="background:#ffd700;" onclick="abrirModal('modal-wallet')">💳<br>Wallet</button>
            <button class="nav-item" style="background:radial-gradient(circle, #ff5f6d, #ffc371); width:85px; height:85px; font-size:40px;" onclick="abrirModal('modal-regalos')">🎁</button>
            <button class="nav-item" style="background:#00d2ff;" onclick="abrirModal('modal-tienda')">👑<br>VIP</button>
        </div>
    </div>

    <div id="modal-wallet" class="modal">
        <h2 style="color:#ffd700">Mi Billetera</h2>
        <button class="modal-btn" style="background:#4CAF50; color:white" onclick="recargar(1000)">Recargar +1000 Oro ($0.99)</button>
        <button class="modal-btn" onclick="cerrarModal()">Cerrar</button>
    </div>

    <div id="modal-regalos" class="modal">
        <h2 style="color:#ff85a2">Enviar Regalo</h2>
        <button class="modal-btn" onclick="alert('Rosa enviada')">🌹 Rosa (10)</button>
        <button class="modal-btn" onclick="alert('Carro enviado')">🚗 Carro (500)</button>
        <button class="modal-btn" onclick="cerrarModal()">Cerrar</button>
    </div>

    <div id="modal-tienda" class="modal">
        <h2 style="color:#00d2ff">Tienda VIP</h2>
        <button class="modal-btn" onclick="alert('Comprando SVIP...')">Ser SVIP (2000)</button>
        <button class="modal-btn" onclick="cerrarModal()">Cerrar</button>
    </div>

    <audio id="remote-audio" autoplay playsinline></audio>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4", projectId: "lluvia-live-69a05" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let peer, localStream, role, room, nombre;

        const grid = document.getElementById('sillas-grid');
        for(let i=1; i<=9; i++) {
            grid.innerHTML += `<div><div class="silla-box" id="silla-${i}">👤</div><div style="font-size:10px;margin-top:5px;color:#aaa">Silla ${i}</div></div>`;
        }

        async function entrarSala(tipo) {
            nombre = document.getElementById('user-name').value;
            room = document.getElementById('room-id').value;
            role = tipo;

            if(!nombre || !room) return alert("Faltan datos");

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('id-view').innerText = room;

            peer = new Peer('lluvia-' + room + '-' + role);

            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', s => {
                    const audio = document.getElementById('remote-audio');
                    audio.srcObject = s;
                    audio.play().catch(e => console.log("Auto-play bloqueado"));
                });
            });

            db.collection("usuarios").doc(nombre).onSnapshot(doc => {
                if(doc.exists) {
                    document.getElementById('oro-txt').innerText = doc.data().oro || 0;
                    document.getElementById('svip-tag').style.display = doc.data().svip ? 'inline-block' : 'none';
                }
            });
        }

        async function toggleMicro() {
            if (!localStream) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    conectarAudio();
                } catch (e) { alert("Activa el micro en ajustes"); return; }
            }
            
            const activo = !localStream.getAudioTracks()[0].enabled;
            localStream.getAudioTracks()[0].enabled = activo;

            document.getElementById('mic-btn').className = activo ? "btn-circle-audio btn-on" : "btn-circle-audio btn-off";
            
            const nSilla = (role === 'A') ? '1' : '2';
            document.getElementById('silla-'+nSilla).className = activo ? "silla-box silla-on" : "silla-box";
            document.getElementById('silla-'+nSilla).innerText = activo ? "🎙️" : "👤";
        }

        function toggleBocina() {
            const audio = document.getElementById('remote-audio');
            audio.muted = !audio.muted;
            document.getElementById('spk-btn').className = audio.muted ? "btn-circle-audio btn-off" : "btn-circle-audio btn-on";
            audio.play(); // Forzar reproducción al activar
        }

        function conectarAudio() {
            const destino = (role === 'A') ? 'B' : 'A';
            const call = peer.call('lluvia-' + room + '-' + destino, localStream);
            if (call) {
                call.on('stream', s => {
                    const audio = document.getElementById('remote-audio');
                    audio.srcObject = s;
                    audio.play();
                });
            }
        }

        function abrirModal(id) { document.getElementById(id).style.display = 'block'; }
        function cerrarModal() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); }

        function recargar(cant) {
            db.collection("usuarios").doc(nombre).set({
                oro: firebase.firestore.FieldValue.increment(cant)
            }, { merge: true });
            alert("¡Recarga de " + cant + " exitosa!");
            cerrarModal();
        }
    </script>
</body>
</html>
