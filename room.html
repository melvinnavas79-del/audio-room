<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Room Elite</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <style>
        body { background: #0f001e; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; }
        
        /* Panel Superior con Aristocracia y CP */
        .top-panel { background: rgba(0,0,0,0.4); margin: 10px; padding: 15px; border-radius: 20px; border: 1px solid #ffd700; box-shadow: 0 0 10px rgba(255,215,0,0.2); }
        .stats-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; padding: 0 10px; }
        .gold-txt { color: #ffd700; font-weight: bold; }
        .clan-txt { color: #00ffcc; font-weight: bold; }
        
        .rank-box { background: linear-gradient(90deg, #b8860b, #f0e68c, #b8860b); color: #000; padding: 6px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; display: inline-block; margin-bottom: 5px; }
        .cp-txt { font-size: 12px; color: #ff85a2; font-weight: bold; margin-top: 5px; }

        /* Iconos de Estatus */
        .v-badge { color: #1da1f2; font-size: 14px; margin-left: 4px; }
        .svip-badge { background: #ff0000; color: white; font-size: 10px; padding: 2px 5px; border-radius: 5px; font-weight: bold; margin-left: 5px; vertical-align: middle; }

        /* Sala y Micros */
        .sala-tag { color: #ffd700; margin: 10px 0; font-size: 14px; }
        .grid-mic { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 15px; }
        .mic-user { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #444; background: #1a1a1a; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 24px; position: relative; }
        .mic-user.talking { border-color: #00ff00; box-shadow: 0 0 12px #00ff00; }
        .mic-label { font-size: 10px; color: #ccc; margin-top: 5px; }

        /* Botones Circulares Inferiores */
        .nav-bottom { position: fixed; bottom: 25px; width: 100%; display: flex; justify-content: center; gap: 20px; align-items: center; }
        .circle-btn { width: 60px; height: 60px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); }
        .btn-w { background: #ffd700; color: #000; box-shadow: 0 0 10px #ffd700; }
        .btn-g { background: #ff4d4d; width: 75px; height: 75px; font-size: 25px; box-shadow: 0 0 15px #ff4d4d; }
        .btn-v { background: #00d2ff; color: #000; box-shadow: 0 0 10px #00d2ff; }

        /* Modales */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; width: 80%; padding: 20px; border-radius: 20px; border: 2px solid #ffd700; z-index: 1000; }
        .sh { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index: 999; }
    </style>
</head>
<body>

<div class="top-panel">
    <div class="stats-row">
        <span class="gold-txt">💰 Oro: <span id="gold-bal">0</span></span>
        <span class="clan-txt">🛡️ Clan: Lluvia</span>
    </div>
    <div class="rank-box">
        🏆 Noble (Aristocracia) 
        <span id="v-icon" class="v-badge" style="display:none;">✔</span>
        <span id="svip-tag" class="svip-badge" style="display:none;">SVIP</span>
    </div>
    <div class="cp-txt" id="cp-display">💞 C.P: Buscando pareja...</div>
</div>

<div class="sala-tag">📍 Sala: 1234</div>

<div class="grid-mic" id="mic-grid">
    </div>

<div class="nav-bottom">
    <div class="circle-btn btn-w" onclick="shM('m-w')">💳<br>Wallet</div>
    <div class="circle-btn btn-g" onclick="shM('m-g')">🎁</div>
    <div class="circle-btn btn-v" onclick="shM('m-v')">👑<br>VIP</div>
</div>

<div class="sh" id="sh" onclick="clM()"></div>

<div class="modal" id="m-w">
    <h3>Mi Billetera</h3>
    <button onclick="addG(1000)" style="background:#28a745; color:#fff; padding:10px;">Recargar +1000 Oro ($0.99)</button><br><br>
    <button onclick="clM()">Cerrar</button>
</div>

<div class="modal" id="m-g">
    <h3>Enviar Regalos</h3>
    <button onclick="gift(10)">🌹 Rosa (10)</button><br><br>
    <button onclick="gift(500)">🚗 Carro (500)</button><br><br>
    <button onclick="clM()">Cerrar</button>
</div>

<div class="modal" id="m-v">
    <h3>Tienda de Estatus</h3>
    <button onclick="buyV()">Obtener Verificación (500)</button><br><br>
    <button onclick="buySVIP()">Ser SVIP (2000)</button><br><br>
    <button onclick="setCP()">Vincular C.P. (Pareja)</button><br><br>
    <button onclick="clM()">Cerrar</button>
</div>

<script>
    // IMPORTANTE: Pon aquí tus datos de Firebase que sacaste de la imagen
    const firebaseConfig = {
        apiKey: "AIzaSyAs-TU-API-KEY",
        databaseURL: "https://audio-room-1-default-rtdb.firebaseio.com",
        projectId: "audio-room-1"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let uID = "Melvin_" + Math.floor(Math.random() * 99);
    let gold = 0;
    let isV = false;
    let isSVIP = false;

    // Dibujar micros
    const g = document.getElementById('mic-grid');
    for(let i=1; i<=9; i++) {
        g.innerHTML += `<div><div class="mic-user" id="u-${i}">🎙️</div><div class="mic-label">Silla ${i}</div></div>`;
    }

    function shM(id) { document.getElementById('sh').style.display='block'; document.getElementById(id).style.display='block'; }
    function clM() { document.getElementById('sh').style.display='none'; document.querySelectorAll('.modal').forEach(m=>m.style.display='none'); }

    function upUI() {
        document.getElementById('gold-bal').innerText = gold;
        document.getElementById('v-icon').style.display = isV ? 'inline' : 'none';
        document.getElementById('svip-tag').style.display = isSVIP ? 'inline' : 'none';
    }

    // Funciones de compra
    function addG(n) { gold += n; save(); alert("¡Recarga exitosa!"); }
    function gift(n) { if(gold >= n){ gold -= n; save(); alert("Regalo enviado"); } else { alert("Oro insuficiente"); } }
    function buyV() { if(gold >= 500){ gold -= 500; isV = true; save(); clM(); } }
    function buySVIP() { if(gold >= 2000){ gold -= 2000; isSVIP = true; save(); clM(); } }
    function setCP() { let p = prompt("Nombre de tu pareja:"); if(p) { document.getElementById('cp-display').innerText = "💞 C.P: " + p; } }

    function save() { db.ref('users/' + uID).update({ gold: gold, v: isV, svip: isSVIP }); upUI(); }

    // Firebase en vivo
    db.ref('users/' + uID).on('value', (s) => {
        const d = s.val() || {};
        gold = d.gold || 0;
        isV = d.v || false;
        isSVIP = d.svip || false;
        upUI();
    });

    const peer = new Peer(uID);
</script>

</body>
</html>
