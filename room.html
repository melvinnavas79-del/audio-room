<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lluvia Live - Billetera Real</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script src="https://www.paypal.com/sdk/js?client-id=AfHuBVaA8_T6bxvMRwYfG&currency=USD&intent=capture"></script>

    <style>
        body { margin: 0; background: #1a0033; color: white; font-family: sans-serif; text-align: center; }
        .header-panel { background: rgba(0,0,0,0.8); width: 92%; margin: 10px auto; padding: 15px; border-radius: 20px; border: 2px solid #ffd700; }
        .user-name { color: #ffd700; font-size: 1.2rem; font-weight: bold; }
        
        /* Contenedor de la Billetera */
        #wallet-modal { display: block; width: 90%; margin: 20px auto; background: #222; border: 3px solid #ffd700; border-radius: 25px; padding: 20px; box-sizing: border-box; }
        .wallet-title { color: #ffd700; font-size: 1.4rem; margin-bottom: 20px; }
        
        /* Aquí se dibujará el botón amarillo */
        #paypal-button-container { 
            margin-top: 20px; 
            min-height: 150px; 
            background: rgba(255,255,255,0.05); 
            border-radius: 10px;
            padding: 10px;
        }

        .pack-price { color: #00ff00; font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header-panel">
        <span class="user-name" id="display-name">Cargando...</span>
        <div>💰 Oro: <b id="user-oro">...</b></div>
    </div>

    <div id="wallet-modal">
        <h3 class="wallet-title">💳 RECARGA ORO</h3>
        <div class="pack-price">5500 Oros por $49.99</div>
        
        <div id="paypal-button-container"></div>
    </div>

    <script>
        // Configuración Firebase (la de tu foto)
        const firebaseConfig = {
            apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4",
            authDomain: "lluvia-live-69a05.firebaseapp.com",
            projectId: "lluvia-live-69a05",
            storageBucket: "lluvia-live-69a05.firebasestorage.app",
            messagingSenderId: "909704512499",
            appId: "1:909704512499:web:a8f0d658fb6dbd3f610886"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Identidad
        let user = localStorage.getItem('nombre_lluvia') || "Melvin_Tester";
        document.getElementById('display-name').innerText = "👤 " + user;

        // Saldo
        db.collection("usuarios").doc(user).onSnapshot(doc => {
            if(doc.exists) document.getElementById('user-oro').innerText = doc.data().oro;
        });

        // FUNCION PARA CARGAR EL BOTÓN INMEDIATAMENTE
        function initPayPal() {
            paypal.Buttons({
                createOrder: function(data, actions) {
                    return actions.order.create({
                        purchase_units: [{ amount: { value: '49.99' } }]
                    });
                },
                onApprove: function(data, actions) {
                    return actions.order.capture().then(function(details) {
                        db.collection("usuarios").doc(user).update({
                            oro: firebase.firestore.FieldValue.increment(5500)
                        }).then(() => alert("¡Pago con éxito!"));
                    });
                }
            }).render('#paypal-button-container');
        }

        // Ejecutar PayPal al cargar la página
        window.onload = initPayPal;
    </script>
</body>
</html>
