<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lluvia Live - Fix Total</title>
    
    <script src="https://resource.zegocloud.com/prebuilt/zegocloud-prebuilt.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=AWOafs7E7hOuryPjXYaHIMvKeWhSgH65Fejg2eyY4b0BY_7xoClV0xhc45Zdr7Y5MhMGSCefLgl6X18&currency=USD"></script>

    <style>
        body { margin: 0; background: #1a0033; color: white; font-family: sans-serif; text-align: center; }
        .header-sala { background: rgba(0,0,0,0.9); padding: 15px; border: 2px solid #ffd700; border-radius: 20px; width: 92%; margin: 15px auto; }
        
        /* Botones Melvin */
        .btn-melvin { background: #222; border: 2px solid #ffd700; border-radius: 15px; padding: 20px; width: 85%; color: white; font-weight: bold; font-size: 18px; margin-bottom: 15px; }
        .active { background: #ffd700 !important; color: black !important; box-shadow: 0 0 20px #ffd700; }

        /* Rangos */
        .rango-row { display: flex; justify-content: space-around; border-top: 1px solid #444; padding-top: 10px; margin-top: 10px; font-size: 12px; }
        .aristocracia { color: #ffd700; font-weight: bold; }
        .svip { color: #ff00ff; font-weight: bold; }
        .vip { color: #00ffff; font-weight: bold; }

        .btn-wallet { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #ffd700; color: black; padding: 15px 45px; border-radius: 40px; font-weight: bold; border: none; font-size: 18px; }
        
        .lobby { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a0033; z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .input-sala { padding: 15px; border-radius: 12px; border: 2px solid #ffd700; background: #222; color: white; width: 75%; text-align: center; font-size: 18px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="lobby" class="lobby">
        <h1 style="color: #ffd700;">LLUVIA LIVE</h1>
        <input type="number" id="sala-id" class="input-sala" placeholder="ID de Sala">
        <button onclick="iniciarApp()" style="background:#ffd700; color:black; padding:18px; width:80%; border-radius:12px; font-weight:bold; border:none;">ENTRAR AHORA</button>
    </div>

    <div id="app" style="display:none;">
        <div class="header-sala">
            <div style="font-size: 22px; color: #ffd700;">SALA: <span id="id-txt">---</span></div>
            <div style="margin: 10px 0;">💰 Oro: <span id="oro-txt">0</span> | 🛡️ Lluvia</div>
            <div class="rango-row">
                <span class="aristocracia">💎 Aristocracia</span>
                <span class="svip">✨ SVIP</span>
                <span class="vip">🔥 VIP</span>
            </div>
        </div>

        <div style="margin-top: 40px;">
            <button id="btn-bocina" class="btn-melvin" onclick="activarBocina()">🔊 ACTIVAR BOCINA</button>
            <button id="btn-micro" class="btn-melvin" onclick="activarMicro()">🎙️ ENCENDER MICRO</button>
        </div>

        <div id="zego-hidden" style="display:none;"></div>
        <button class="btn-wallet" onclick="abrirTienda()">💳 BILLETERA</button>
    </div>

    <div id="tienda" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:5000; padding-top:40px;">
        <div style="background:#222; border:2px solid #ffd700; border-radius:20px; width:85%; margin:auto; padding:20px;">
            <h3 style="color:#ffd700;">Recarga Oros</h3>
            <button onclick="compra('0.99', 100)" style="width:100%; padding:15px; margin-bottom:10px; background:#444; color:white; border:none; border-radius:10px;">🪙 100 Oros - $0.99</button>
            <button onclick="compra('9.99', 1100)" style="width:100%; padding:15px; margin-bottom:10px; background:#444; color:white; border:none; border-radius:10px;">🪙 1100 Oros - $9.99</button>
            <div id="paypal-area" style="margin-top:15px;"></div>
            <button onclick="cerrarTienda()" style="color:red; background:none; border:none; margin-top:15px;">CERRAR</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4",
            authDomain: "lluvia-live-69a05.firebaseapp.com",
            projectId: "lluvia-live-69a05",
            storageBucket: "lluvia-live-69a05.firebasestorage.app",
            messagingSenderId: "909704512499",
            appId: "1:909704512499:web:a8f0d658fb6dbd3f610886"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let zp = null, mic = false, box = false;

        async function iniciarApp() {
            const id = document.getElementById('sala-id').value || "100";
            document.getElementById('id-txt').innerText = id;
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('app').style.display = 'block';

            const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(1111976694, "25049a1d82f7cc4b219154a4f89d53f5", id, "U"+Date.now(), "Melvin");
            zp = ZegoUIKitPrebuilt.create(kitToken);
            
            await zp.joinRoom({
                container: document.querySelector("#zego-hidden"),
                scenario: { mode: ZegoUIKitPrebuilt.GroupCall },
                showPreJoinView: false,
                turnOnMicrophoneWhenJoining: false 
            });

            db.collection("usuarios").doc("Melvin_User").onSnapshot(doc => {
                document.getElementById('oro-txt').innerText = doc.exists ? (doc.data().oro || 0) : 0;
            });
        }

        function activarBocina() {
            box = !box;
            const b = document.getElementById('btn-bocina');
            b.innerText = box ? "🔊 BOCINA: ON" : "🔊 ACTIVAR BOCINA";
            b.className = box ? "btn-melvin active" : "btn-melvin";
            // Forzar desbloqueo de audio en iOS
            new (window.AudioContext || window.webkitAudioContext)().resume();
        }

        function activarMicro() {
            mic = !mic;
            zp.turnMicrophoneOn(mic);
            const b = document.getElementById('btn-micro');
            b.innerText = mic ? "🎙️ MICRO: ON" : "🎙️ ENCENDER MICRO";
            b.className = mic ? "btn-melvin active" : "btn-melvin";
        }

        function abrirTienda() { document.getElementById('tienda').style.display = 'block'; }
        function cerrarTienda() { document.getElementById('tienda').style.display = 'none'; document.getElementById('paypal-area').innerHTML = ""; }

        function compra(monto, cant) {
            document.getElementById('paypal-area').innerHTML = "";
            paypal.Buttons({
                createOrder: (data, actions) => actions.order.create({ purchase_units: [{ amount: { value: monto } }] }),
                onApprove: (data, actions) => actions.order.capture().then(() => {
                    db.collection("usuarios").doc("Melvin_User").update({ oro: firebase.firestore.FieldValue.increment(cant) });
                    alert("¡Oros cargados!");
                    cerrarTienda();
                })
            }).render('#paypal-area');
        }
    </script>
</body>
</html>
