<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioRoom PRO - Conexión por ID</title>
    <script src="https://unpkg.com/zegocloud-zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>
    <style>
        body { 
            margin: 0; 
            background: linear-gradient(180deg, #4b0082, #8a2be2); 
            color: white; 
            font-family: sans-serif; 
            text-align: center; 
            height: 100vh; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header { padding: 20px; margin-top: 20px; }
        .room-info { 
            background: rgba(0,0,0,0.4); 
            padding: 15px; 
            margin: 10px; 
            border-radius: 15px; 
            font-size: 1.3rem; 
            border: 2px solid #ffd700; 
            width: 80%;
        }
        .controls { position: fixed; bottom: 50px; width: 100%; display: flex; justify-content: center; gap: 20px; }
        .btn { 
            width: 75px; 
            height: 75px; 
            border-radius: 50%; 
            border: none; 
            font-size: 35px; 
            cursor: pointer; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.6); 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-mic { background: #555; color: white; }
        .btn-active { background: #6c5ce7; border: 4px solid #00ff00; }
        #status { margin-top: 20px; color: #00ff00; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎤 AudioRoom PRO</h1>
        <div class="room-info" id="room-display">Buscando sala...</div>
    </div>

    <div id="status">Esperando que actives el micro...</div>

    <div class="controls">
        <button class="btn btn-mic" id="main-btn" onclick="iniciarTodo()">🎤</button>
    </div>

    <script>
        // 1. Pedir el ID de la sala (Para que los dos teléfonos se encuentren)
        const roomID = prompt("Ingresa el ID de la sala (Ejemplo: 100):") || "8888";
        document.getElementById('room-display').innerText = "📍 Estás en la Sala: " + roomID;

        // 2. Datos de conexión
        const userID = "user_" + Math.floor(Math.random() * 1000);
        const userName = "Melvin_" + userID;
        
        // Aquí iría tu configuración de ZegoCloud si la tienes
        function iniciarTodo() {
            const btn = document.getElementById('main-btn');
            const status = document.getElementById('status');
            
            btn.classList.toggle('btn-active');
            
            if(btn.classList.contains('btn-active')) {
                status.innerText = "🎤 TRANSMITIENDO EN VIVO EN SALA: " + roomID;
                alert("¡Bocina y Micrófono ACTIVADOS! Ahora habla y escucha.");
            } else {
                status.innerText = "Audio en pausa";
            }
        }
    </script>
</body>
</html>
