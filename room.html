<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioRoom PRO - Sonido Forzado</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #1a0033; color: white; font-family: sans-serif; text-align: center; }
        .user-panel { background: rgba(0,0,0,0.6); width: 90%; margin: 20px auto; padding: 15px; border-radius: 20px; border: 1px solid #ffd700; }
        .aristocracia-tag { background: linear-gradient(90deg, #ffd700, #ff8c00); color: #000; font-weight: bold; padding: 5px 20px; border-radius: 15px; margin: 10px 0; display: inline-block; }
        .btn-mic { width: 80px; height: 80px; border-radius: 50%; border: none; font-size: 35px; cursor: pointer; background: #444; color: white; }
        .btn-active { background: #00ff00; border: 4px solid white; box-shadow: 0 0 20px #00ff00; }
        .btn-audio { background: #ff0066; color: white; padding: 15px; border-radius: 10px; border: none; margin: 10px; font-weight: bold; cursor: pointer; }
        .bocina-icon { font-size: 60px; margin: 10px; }
    </style>
</head>
<body>

    <div class="user-panel">
        <div>💰 Oro: 1000 | 👑 VIP: 0</div>
        <div class="aristocracia-tag">🏆 Noble (Aristocracia)</div>
    </div>

    <div id="room-display" style="font-size: 1.1rem;">📍 Sala ID: Cargando...</div>
    
    <button class="btn-audio" onclick="activarBocina()">🔊 CLIC AQUÍ PARA ESCUCHAR</button>

    <div class="bocina-icon">🔊</div>
    <p id="status">1. Pon el mismo ID<br>2. Toca el botón rosa<br>3. Toca el micro</p>

    <button class="btn-mic" id="main-btn" onclick="conectarAudio()">🎤</button>

    <audio id="remote-audio" autoplay playsinline></audio>

    <script>
        const roomID = prompt("Ingresa el ID de la sala:") || "100";
        document.getElementById('room-display').innerText = "📍 Sala ID: " + roomID;

        // Generamos IDs fijos para que el Teléfono A siempre llame al B
        const peer = new Peer('melvin-' + roomID + (Math.random() > 0.5 ? 'A' : 'B'));

        function activarBocina() {
            const audio = document.getElementById('remote-audio');
            audio.play(); // Esto desbloquea el permiso de sonido en el celular
            alert("¡Sonido desbloqueado! Ahora activa el micro.");
        }

        function conectarAudio() {
            const btn = document.getElementById('main-btn');
            btn.classList.add('btn-active');
            document.getElementById('status').innerText = "🎤 CONECTADO - HABLA";

            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                // Escuchar llamadas
                peer.on('call', call => {
                    call.answer(stream);
                    call.on('stream', remoteStream => {
                        const remoteAudio = document.getElementById('remote-audio');
                        remoteAudio.srcObject = remoteStream;
                        remoteAudio.play();
                    });
                });

                // Llamar al otro (intentamos llamar a las dos versiones A y B)
                const callA = peer.call('melvin-' + roomID + 'A', stream);
                const callB = peer.call('melvin-' + roomID + 'B', stream);
                
                [callA, callB].forEach(call => {
                    if(call) {
                        call.on('stream', remoteStream => {
                            const remoteAudio = document.getElementById('remote-audio');
                            remoteAudio.srcObject = remoteStream;
                            remoteAudio.play();
                        });
                    }
                });
            }).catch(err => alert("Error de micro: " + err));
        }
    </script>
</body>
</html>
