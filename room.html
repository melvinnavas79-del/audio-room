<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lluvia Live Official</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=AWOafs7E7hOuryPjXYaHIMvKeWhSgH65Fejg2eyY4b0BY_7xoClV0xhc45Zdr7Y5MhMGSCefLgl6X18&currency=USD&disable-funding=credit,card"></script>

    <style>
        body { margin: 0; background: #1a0033; color: white; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; }
        
        /* Cabecera corregida según tu imagen */
        .header-sala { background: rgba(0,0,0,0.85); padding: 15px; border: 2px solid #ffd700; border-radius: 20px; width: 90%; margin: 15px auto; }
        .info-row { display: flex; justify-content: space-around; font-size: 16px; margin: 10px 0; font-weight: bold; }
        .txt-svip { color: #ff00ff; font-weight: bold; text-shadow: 0 0 10px #ff00ff; }

        /* Controles de Audio */
        .audio-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .mic-btn { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #ffd700; background: #331a4d; font-size: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .mic-on { background: #ffd700; color: black; box-shadow: 0 0 25px #ffd700; }
        
        /* LA BOCINA (Botón de activación) */
        .bocina-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid #00ff00; border-radius: 15px; padding: 10px 20px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .bocina-icon { font-size: 25px; }

        /* Billetera */
        .modal-wallet { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a0033; z-index: 2000; padding-top: 20px; }
        .wallet-card { background: #222; border: 2px solid #ffd700; border-radius: 20px; width: 88%; margin: auto; padding: 20px; }
        .pack-item { background: #333; border: 1px solid #ffd700; color: white; width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 12px; display: flex; justify-content: space-between; font-size: 17px; cursor: pointer; }
        
        .btn-main-wallet { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #ffd700; color: black; padding: 18px 50px; border-radius: 35px; font-weight: bold; border: none; font-size: 18px; box-shadow: 0 0 20px #ffd700; }
    </style>
</head>
<body>

    <div class="header-sala">
        <div style="font-size: 24px; color: #ffd700; margin-bottom: 5px;">👤 100</div>
        <div class="info-row">
            <span>💰 Oro: <span id="oro-txt" style="color:#ffd700;">...</span></span>
            <span>🛡️ Clan: <span style="color:#ff4444;">Lluvia</span></span>
        </div>
        <div style="border-top: 1px solid #333; padding-top: 10px; margin-top: 5px;">
            <span style="color: #ffd700;">💎 Aristocracia</span> <span class="txt-svip">SVIP</span>
            <div style="color: #00ff00; font-size: 14px; margin-top: 5px;">📍 Sala: 100</div>
        </div>
    </div>

    <div class="audio-container">
        <div id="btn-mic" class="mic-btn" onclick="toggleMic()">🎙️</div>
        
        <div class="bocina-btn" onclick="activarBocina()">
            <span class="bocina-icon">🔊</span>
            <span id="bocina-status" style="color: #00ff00; font-weight: bold;">Audio Conectado</span>
        </div>
    </div>

    <button class="btn-main-wallet" onclick="abrirBilletera()">💳 IR A BILLETERA</button>

    <div id="modal-pago" class="modal-wallet">
        <div class="wallet-card">
            <h2 style="color: #ffd700;">Recargar Oro</h2>
            <div class="pack-item" onclick="cargarBotonPayPal('0.99', 100)">
                <span>🪙 100 Oros</span> <b>$0.99</b>
            </div>
            <div class="pack-item" onclick="cargarBotonPayPal('9.99', 1100)">
                <span>🪙 1100 Oros</span> <b>$9.99</b>
            </div>
            <div class="pack-item" onclick="cargarBotonPayPal('49.99', 6000)">
                <span>🪙 6000 Oros</span> <b>$49.99</b>
            </div>

            <div id="paypal-button-area" style="margin-top: 20px; min-height: 150px;"></div>
            
            <button onclick="cerrarBilletera()" style="margin-top: 20px; background: none; border: 1px solid #ff4444; color: #ff4444; padding: 12px; width: 100%; border-radius: 10px;">Cerrar</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4",
            authDomain: "lluvia-live-69a05.firebaseapp.com",
            projectId: "lluvia-live-69a05",
            storageBucket: "lluvia-live-69a05.firebasestorage.app",
            messagingSenderId: "909704512499",
            appId: "1:909704512499:web:a8f0d658fb6dbd3f610886"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let userId = "Melvin_User";

        // Carga de Oro instantánea
        db.collection("usuarios").doc(userId).onSnapshot(doc => {
            if(doc.exists) document.getElementById('oro-txt').innerText = doc.data().oro || 0;
        });

        // Micrófono
        let mOn = false;
        function toggleMic() {
            mOn = !mOn;
            document.getElementById('btn-mic').className = mOn ? 'mic-btn mic-on' : 'mic-btn';
        }

        // Función de la Bocina
        function activarBocina() {
            const status = document.getElementById('bocina-status');
            status.innerText = "Audio Sincronizado";
            status.style.color = "#ffd700";
            console.log("Salida de audio forzada");
        }

        // Lógica PayPal Mejorada
        function abrirBilletera() { document.getElementById('modal-pago').style.display = 'block'; }
        function cerrarBilletera() { 
            document.getElementById('modal-pago').style.display = 'none'; 
            document.getElementById('paypal-button-area').innerHTML = ""; 
        }

        function cargarBotonPayPal(monto, cantidad) {
            const area = document.getElementById('paypal-button-area');
            area.innerHTML = "<p style='color:#ffd700;'>Cargando PayPal...</p>";

            paypal.Buttons({
                style: { layout: 'vertical', color: 'gold', shape: 'pill' },
                createOrder: (data, actions) => {
                    return actions.order.create({
                        purchase_units: [{ amount: { value: monto }, description: "Oros Lluvia Live" }]
                    });
                },
                onApprove: (data, actions) => {
                    return actions.order.capture().then(details => {
                        db.collection("usuarios").doc(userId).update({
                            oro: firebase.firestore.FieldValue.increment(cantidad)
                        });
                        alert("¡Melvin, recarga exitosa!");
                        cerrarBilletera();
                    });
                }
            }).render('#paypal-button-area');
        }
    </script>
</body>
</html>
