<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lluvia Live - Edición Dueño Único</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Arial', sans-serif; text-align: center; height: 100vh; overflow-x: hidden; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .logo-box { font-size: 45px; font-weight: bold; color: #00ffcc; text-shadow: 0 0 15px #00ffcc; margin-bottom: 30px; }
        .input-field { width: 80%; padding: 15px; margin: 10px 0; border-radius: 12px; border: none; font-size: 20px; text-align: center; background: #222; color: white; }
        .btn-row { display: flex; gap: 10px; width: 85%; margin-top: 20px; }
        .btn-action { flex: 1; padding: 18px; border-radius: 12px; border: none; font-weight: bold; font-size: 18px; color: white; cursor: pointer; }

        #main-app { display: none; background: linear-gradient(180deg, #0f001e 0%, #000 100%); min-height: 100vh; padding-bottom: 120px; }
        .header-card { background: rgba(255,255,255,0.1); width: 92%; margin: 10px auto; padding: 15px; border-radius: 25px; border: 1px solid #ffd700; box-shadow: 0 0 10px rgba(255,215,0,0.3); }
        
        /* SILLAS PRO */
        .sala-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px; }
        .silla-container { position: relative; width: 70px; margin: 0 auto; }
        .silla-box { width: 65px; height: 65px; border-radius: 50%; border: 2px solid #444; background: #1a1a1a; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .silla-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .silla-on { border-color: #00ff00; box-shadow: 0 0 15px #00ff00; }
        .silla-badge { position: absolute; top: -5px; right: -5px; font-size: 18px; z-index: 10; }
        .silla-name { font-size: 10px; color: #00ffcc; margin-top: 5px; white-space: nowrap; overflow: hidden; }

        /* REELS UI */
        #reels-screen { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:9999; }
        #videoPlayer { width:100%; height:100%; object-fit:cover; }
        .reels-btn { position:absolute; right:20px; width:55px; height:55px; border-radius:50%; background:rgba(0,0,0,0.6); border:1px solid white; color:white; display:flex; align-items:center; justify-content:center; font-size:24px; }

        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; border: 2px solid #ffd700; border-radius: 20px; padding: 25px; width: 80%; z-index: 10000; box-shadow: 0 0 30px #000; }
        .modal-btn { background: #fff; color: #000; border: none; padding: 15px; margin: 8px 0; width: 100%; border-radius: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="logo-box">☔ Lluvia Live</div>
        <input type="text" id="user-name" class="input-field" placeholder="Tu Nombre" value="Melvin">
        <input type="text" id="room-id" class="input-field" placeholder="ID de Sala" value="1234">
        <div class="btn-row">
            <button class="btn-action" style="background:#008000" onclick="entrarSala('A')">Crear sala</button>
            <button class="btn-action" style="background:#0000ff" onclick="entrarSala('B')">Entrar</button>
        </div>
    </div>

    <div id="main-app">
        <div class="header-card">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span>💰 Oro: <b id="oro-txt">0</b></span>
                <span style="color:#ffd700">👑 <span id="rango-txt">Normal</span></span>
            </div>
            <div id="id-label" style="color:#00ffcc; font-size:16px; font-weight:bold;">📍 SALA: ---</div>
        </div>

        <div id="work-panel" style="margin: 15px auto; width: 90%; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 20px; border: 1px dashed #ffd700;">
            <button id="btn-ponchar" class="btn-action" style="background: linear-gradient(90deg, #ff9800, #f44336); width: 100%;" onclick="gestionarTurno()">
                🚀 Iniciar Turno (Ponchar)
            </button>
            <div id="timer-txt" style="margin-top: 10px; font-size: 14px; color: #00ff00; display: none;">
                ⏱️ <span id="minutos">0</span> min | Honor: +<span id="honor-preview">0</span>
            </div>
        </div>

        <div class="sala-grid" id="grid-sillas"></div>

        <div class="audio-controls" style="display:flex; justify-content:center; gap:20px; margin:10px 0;">
            <div onclick="toggleMicro()"><div id="mic-btn" style="width:60px; height:60px; border-radius:50%; background:#ff3333; display:flex; align-items:center; justify-content:center; font-size:25px;">🎙️</div></div>
            <div onclick="toggleBocina()"><div id="spk-btn" style="width:60px; height:60px; border-radius:50%; background:#00ff00; display:flex; align-items:center; justify-content:center; font-size:25px;">🔊</div></div>
        </div>

        <div style="position:fixed; bottom:20px; width:100%; display:flex; justify-content:space-around; align-items:center; padding:10px 0; background:rgba(0,0,0,0.8); border-top:1px solid #333;">
            <button onclick="abrirModal('modal-tienda')" style="background:none; border:none; color:white; font-size:25px;">👑<br><span style="font-size:10px;">VIP</span></button>
            <button onclick="abrirReels()" style="background:linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); width:70px; height:70px; border-radius:50%; border:none; color:white; font-size:30px; font-weight:bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">🎬</button>
            <button onclick="abrirModal('modal-regalos')" style="background:none; border:none; color:white; font-size:25px;">🎁<br><span style="font-size:10px;">Gifts</span></button>
        </div>
    </div>

    <div id="reels-screen">
        <video id="videoPlayer" autoplay loop playsinline onclick="siguienteVideo()"></video>
        <button onclick="cerrarReels()" style="position:absolute; top:40px; left:20px; background:rgba(0,0,0,0.5); border:none; color:white; font-size:30px; border-radius:50%; width:50px; height:50px;">✕</button>
        
        <div class="reels-btn" style="bottom:180px;" onclick="darLike()">❤️</div>
        <div class="reels-btn" style="bottom:110px;" onclick="document.getElementById('fileInput').click()">📤</div>
        <input type="file" id="fileInput" accept="video/*" style="display:none" onchange="subirVideoReal(this)">
        
        <p style="position:absolute; bottom:30px; left:20px; font-weight:bold; text-shadow: 2px 2px 5px black;">@LluviaLive_Oficial</p>
    </div>

    <div id="modal-tienda" class="modal">
        <h2 style="color:#ffd700">Aristocracia VIP</h2>
        <button class="modal-btn" onclick="comprarNivel('Rey', 5000)">🔥 Ser Rey (5000 Oro)</button>
        <button class="modal-btn" onclick="comprarNivel('VIP', 1000)">💎 Ser VIP (1000 Oro)</button>
        <button class="modal-btn" style="background:#ff3333; color:white;" onclick="cerrarModal()">Cerrar</button>
    </div>

    <audio id="remote-audio" autoplay playsinline></audio>

    <script>
        // CONFIGURACIÓN (Usa tus llaves aquí)
        const firebaseConfig = { apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4", projectId: "lluvia-live-69a05", storageBucket: "lluvia-live-69a05.appspot.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        let peer, localStream, role, room, nombre;
        let videosReels = ["https://www.w3schools.com/html/mov_bbb.mp4"];
        let videoIdx = 0;

        // CARGAR SILLAS AL INICIO
        const grid = document.getElementById('grid-sillas');
        for(let i=1; i<=9; i++) {
            grid.innerHTML += `
            <div class="silla-container">
                <div class="silla-badge" id="badge-${i}"></div>
                <div class="silla-box" id="silla-${i}">👤</div>
                <div class="silla-name" id="name-${i}">Libre</div>
            </div>`;
        }

        async function entrarSala(tipo) {
            nombre = document.getElementById('user-name').value;
            room = document.getElementById('room-id').value;
            role = tipo;
            if(!nombre || !room) return alert("Faltan datos");

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('id-label').innerText = "📍 SALA: " + room;

            peer = new Peer('lluvia-' + room + '-' + role);

            // Escuchar mis datos y actualizar SILLA
            db.collection("usuarios").doc(nombre).onSnapshot(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    document.getElementById('oro-txt').innerText = data.oro || 0;
                    document.getElementById('rango-txt').innerText = data.nivel || "Normal";
                    actualizarMiSilla(data);
                }
            });

            // Monitor de Sillas en Tiempo Real
            db.collection("salas").doc(room).onSnapshot(doc => {
                const data = doc.data() || {};
                for(let i=1; i<=9; i++) {
                    const s = data["silla"+i];
                    if(s) {
                        document.getElementById("silla-"+i).innerHTML = `<img src="${s.gif || 'https://via.placeholder.com/60'}" class="silla-img">`;
                        document.getElementById("name-"+i).innerText = s.nombre;
                        document.getElementById("badge-"+i).innerText = obtenerIcono(s.nivel);
                    }
                }
            });

            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', s => { document.getElementById('remote-audio').srcObject = s; });
            });
        }

        function obtenerIcono(nivel) {
            if(nivel === "Rey") return "🔥";
            if(nivel === "VIP") return "💎";
            return "";
        }

        async function actualizarMiSilla(userData) {
            const numSilla = (role === 'A') ? 1 : 2; 
            await db.collection("salas").doc(room).set({
                ["silla"+numSilla]: {
                    nombre: nombre,
                    gif: userData.gif || "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueXF4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/3o7TKMGpxx323D1p5m/giphy.gif",
                    nivel: userData.nivel || "Normal"
                }
            }, { merge: true });
        }

        // --- SISTEMA DE REELS ---
        function abrirReels() {
            document.getElementById("reels-screen").style.display = "block";
            document.getElementById("videoPlayer").src = videosReels[videoIdx];
        }
        function cerrarReels() { document.getElementById("reels-screen").style.display = "none"; }
        function siguienteVideo() {
            videoIdx = (videoIdx + 1) % videosReels.length;
            document.getElementById("videoPlayer").src = videosReels[videoIdx];
        }

        // --- SUBIR VIDEO REAL A STORAGE ---
        async function subirVideoReal(input) {
            const file = input.files[0];
            if(!file) return;
            alert("Subiendo video a Lluvia Live... espera un momento ☔");
            
            const storageRef = storage.ref(`reels/${Date.now()}_${file.name}`);
            await storageRef.put(file);
            const url = await storageRef.getDownloadURL();
            
            videosReels.push(url);
            alert("¡Video subido con éxito! 🚀");
            siguienteVideo();
        }

        async function comprarNivel(nivel, costo) {
            const userRef = db.collection("usuarios").doc(nombre);
            const doc = await userRef.get();
            const oro = doc.data()?.oro || 0;
            if(oro >= costo) {
                await userRef.update({ oro: firebase.firestore.FieldValue.increment(-costo), nivel: nivel });
                alert("¡Ahora eres " + nivel + "!");
                cerrarModal();
            } else { alert("Oro insuficiente 💰"); }
        }

        // --- AUDIO (Tu lógica original) ---
        async function toggleMicro() {
            if (!localStream) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const destino = (role === 'A') ? 'B' : 'A';
                    peer.call('lluvia-' + room + '-' + destino, localStream);
                } catch (e) { alert("Permite el micrófono"); return; }
            }
            const estado = !localStream.getAudioTracks()[0].enabled;
            localStream.getAudioTracks()[0].enabled = estado;
            document.getElementById('mic-btn').style.background = estado ? "#00ff00" : "#ff3333";
            const sId = (role === 'A') ? '1' : '2';
            document.getElementById('silla-'+sId).classList.toggle("silla-on", estado);
        }

        function toggleBocina() {
            const audio = document.getElementById('remote-audio');
            audio.muted = !audio.muted;
            document.getElementById('spk-btn').style.background = audio.muted ? "#ff3333" : "#00ff00";
        }

        function abrirModal(id) { document.getElementById(id).style.display = 'block'; }
        function cerrarModal() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); }
    </script>
</body>
</html>
