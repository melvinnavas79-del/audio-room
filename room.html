<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lluvia Live Fix</title>
    <script src="https://resource.zegocloud.com/prebuilt/ZegoExpressWebRTC.js"></script>
    <style>
        body { margin:0; background:#0b001a; color:white; font-family:sans-serif; overflow:hidden; display:flex; flex-direction:column; height:100vh; }
        
        /* Ajuste para que nada se corte en Android */
        #main-container { flex: 1; display: flex; flex-direction: column; padding-bottom: 100px; overflow-y: auto; }

        #premium-banner { width:90%; margin:10px auto; background:rgba(30,0,60,0.8); border-radius:20px; border:2px solid #ffd700; display:flex; justify-content:space-around; align-items:center; padding:10px; }

        #sillas-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; padding:15px; }
        .silla-wrapper { text-align:center; }
        .silla { width:65px; height:65px; border-radius:50%; background:#1e1e2e; border:2px solid #444; margin:0 auto; display:flex; align-items:center; justify-content:center; font-size:24px; }
        .silla.activa { border-color:#00ff00; box-shadow: 0 0 15px #00ff00; }

        /* BARRA SUBIDA PARA ANDROID */
        .action-bar { position: fixed; bottom: 20px; width: 100%; display: flex; justify-content: space-around; padding-bottom: 10px; z-index: 100; }
        .btn-round { width:55px; height:55px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; font-size:22px; cursor:pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        #login { position:fixed; inset:0; background:#0b001a; z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .input-box { padding:15px; width:80%; border-radius:15px; border:1px solid #444; background:#1a1a1a; color:white; margin-bottom:10px; text-align:center; }
    </style>
</head>
<body>

<div id="login">
    <h1 style="color:gold;">☔ LLUVIA LIVE</h1>
    <input type="text" id="user-name" class="input-box" placeholder="Tu Apodo">
    <input type="text" id="room-id" class="input-box" placeholder="ID Sala (ej: 100)">
    <button onclick="conectarZego()" style="background:#00ff00; padding:15px 50px; border-radius:30px; border:none; font-weight:bold;">ENTRAR Y ACTIVAR AUDIO</button>
</div>

<div id="main-container">
    <div id="premium-banner">
        <div>👑 <span style="color:gold;">SVIP</span></div>
        <div>💰 ORO: <span id="oro-val" style="color:gold;">3800</span></div>
    </div>
    <div id="sillas-grid"></div>
</div>

<div class="action-bar">
    <button class="btn-round" style="background:#8a2be2;">🎬</button>
    <button class="btn-round" style="background:#00aaff;">📸</button>
    <button id="mic-btn" class="btn-round" style="background:#ff3333;" onclick="toggleMic()">🎙️</button>
    <button class="btn-round" style="background:orange;">🎁</button>
    <button id="vol-btn" class="btn-round" style="background:#00ff00;" onclick="toggleVol()">🔊</button>
</div>

<script>
    // TUS DATOS REALES DE ZEGO
    const appID = 249373029;
    const server = "wss://webliveroom" + appID + "-api.zegocloud.com/ws";
    let zg, localStream;
    let micOn = false;

    async function conectarZego() {
        const user = document.getElementById('user-name').value || "User_" + Math.floor(Math.random()*100);
        const room = document.getElementById('room-id').value || "100";
        document.getElementById('login').style.display = 'none';

        // Inicializar motor de audio
        zg = new ZegoExpressEngine(appID, server);
        
        // Generar las sillas visuales
        const grid = document.getElementById('sillas-grid');
        for(let i=1; i<=9; i++) {
            grid.innerHTML += `<div class="silla-wrapper"><div class="silla" id="s-${i}" onclick="sentarse(${i})">👤</div><div style="font-size:10px;margin-top:5px;">Vacío</div></div>`;
        }
        
        alert("Audio listo. Siéntate en una silla y abre el micro.");
    }

    async function toggleMic() {
        if (!zg) return;
        micOn = !micOn;
        const btn = document.getElementById('mic-btn');
        
        if(micOn) {
            btn.style.background = "#00ff00";
            // Aquí se activa el micro real del celular
            localStream = await zg.createStream({camera: {audio: true, video: false}});
            zg.startPublishingStream("stream_" + Date.now(), localStream);
        } else {
            btn.style.background = "#ff3333";
            zg.stopPublishingStream("stream_" + Date.now());
            zg.destroyStream(localStream);
        }
    }

    function sentarse(id) {
        document.querySelectorAll('.silla').forEach(s => s.classList.remove('activa'));
        document.getElementById(`s-${id}`).classList.add('activa');
        document.getElementById(`s-${id}`).innerText = "🎤";
    }

    function toggleVol() {
        const v = document.getElementById('vol-btn');
        v.innerText = v.innerText === "🔊" ? "🔇" : "🔊";
        v.style.background = v.innerText === "🔊" ? "#00ff00" : "#666";
    }
</script>
</body>
</html>
