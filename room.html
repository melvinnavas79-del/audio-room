<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioRoom PRO - Control Total</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #1a0033; color: white; font-family: sans-serif; text-align: center; }
        .user-panel { background: rgba(0,0,0,0.6); width: 90%; margin: 20px auto; padding: 15px; border-radius: 20px; border: 2px solid #ffd700; }
        .aristocracia-tag { background: linear-gradient(90deg, #ffd700, #ff8c00); color: #000; font-weight: bold; padding: 5px 20px; border-radius: 15px; margin: 10px 0; display: inline-block; }
        
        /* Contenedor de Controles */
        .controls-row { display: flex; justify-content: center; gap: 30px; margin-top: 50px; }
        
        .btn-control { 
            width: 70px; height: 70px; border-radius: 50%; border: none; 
            font-size: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.3s;
        }

        /* Colores de estados */
        .on { background: #00ff00; color: black; } /* Encendido */
        .off { background: #ff3333; color: white; } /* Apagado/Silenciado */
        
        #status-bar { margin-top: 20px; font-weight: bold; color: #00ffcc; }
    </style>
</head>
<body>

    <div class="user-panel">
        <div>💰 Oro: 1000 | 👑 VIP: 0</div>
        <div class="aristocracia-tag">🏆 Noble (Aristocracia)</div>
    </div>

    <div id="room-display">📍 Sala: Cargando...</div>

    <div class="controls-row">
        <div>
            <button id="mic-btn" class="btn-control off" onclick="toggleMic()">🎙️</button>
            <p>Micro</p>
        </div>

        <div>
            <button id="speaker-btn" class="btn-control on" onclick="toggleSpeaker()">🔊</button>
            <p>Bocina</p>
        </div>
    </div>

    <div id="status-bar">Paso 1: Pon el ID | Paso 2: Activa el Micro</div>

    <audio id="remote-audio" autoplay playsinline></audio>

    <script>
        const roomID = prompt("Ingresa el ID de la sala:") || "100";
        document.getElementById('room-display').innerText = "📍 Sala ID: " + roomID;

        const peer = new Peer('melvin-' + roomID + (Math.random() > 0.5 ? 'A' : 'B'));
        let myStream;
        let micEnabled = false;
        let speakerEnabled = true;

        // Función para el MICRÓFONO
        async function toggleMic() {
            const btn = document.getElementById('mic-btn');
            
            if (!myStream) {
                try {
                    myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    iniciarPeer();
                } catch (e) { alert("Error al acceder al micro"); return; }
            }

            micEnabled = !micEnabled;
            myStream.getAudioTracks()[0].enabled = micEnabled;
            
            if (micEnabled) {
                btn.classList.replace('off', 'on');
                btn.innerText = "🎙️";
                document.getElementById('status-bar').innerText = "🎤 TRANSMITIENDO EN VIVO";
            } else {
                btn.classList.replace('on', 'off');
                btn.innerText = "🔇";
                document.getElementById('status-bar').innerText = "🔇 MICRÓFONO SILENCIADO";
            }
        }

        // Función para la BOCINA (Silenciar lo que recibes)
        function toggleSpeaker() {
            const btn = document.getElementById('speaker-btn');
            const audio = document.getElementById('remote-audio');
            speakerEnabled = !speakerEnabled;
            
            audio.muted = !speakerEnabled;
            
            if (speakerEnabled) {
                btn.classList.replace('off', 'on');
                btn.innerText = "🔊";
            } else {
                btn.classList.replace('on', 'off');
                btn.innerText = "🔈";
            }
        }

        function iniciarPeer() {
            peer.on('call', call => {
                call.answer(myStream);
                call.on('stream', remoteStream => {
                    document.getElementById('remote-audio').srcObject = remoteStream;
                });
            });

            // Intentar conectar con el otro
            const target = peer.id.endsWith('A') ? 'B' : 'A';
            const call = peer.call('melvin-' + roomID + target, myStream);
            if (call) {
                call.on('stream', remoteStream => {
                    document.getElementById('remote-audio').srcObject = remoteStream;
                });
            }
        }
    </script>
</body>
</html>
