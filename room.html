<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin:0; background:#0b001a; color:white; font-family:sans-serif; overflow:hidden; }
        
        /* Efecto de presión en botones */
        .btn-active:active { transform: scale(0.9); transition: 0.1s; }
        
        /* Banner SVIP con Brillo */
        #premium-banner { 
            width:94%; margin:10px auto; background:rgba(20,20,30,0.95); 
            border-radius:20px; border:2px solid #ffd700; display:flex; 
            justify-content:space-around; align-items:center; padding:12px 5px;
            box-shadow: 0 0 15px rgba(255,215,0,0.5);
        }

        .action-bar { position:fixed; bottom:40px; width:100%; display:flex; justify-content:space-evenly; align-items:center; }
        .btn-circle { width:65px; height:65px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; font-size:28px; cursor:pointer; }
        
        /* Aviso de quién entra */
        #toast { position:fixed; top:160px; right:-100%; background:gold; color:black; padding:10px; border-radius:10px 0 0 10px; transition:0.5s; font-weight:bold; }
    </style>
</head>
<body>

<div id="toast"></div>

<div id="premium-banner" class="btn-active">
    <div style="text-align:center; font-size:10px;">🛡️<br>CLANES</div>
    <div style="text-align:center;">
        <span style="color:#ffd700; font-weight:bold; font-size:14px;">👑 ARISTOCRACIA SVIP</span><br>
        <span style="font-size:12px;">💰 ORO: <span id="gold-count">1000</span></span>
    </div>
    <div style="text-align:center; font-size:10px;">💵<br>RECARGA</div>
</div>

<div id="sillas" style="display:grid; grid-template-columns:repeat(3,1fr); gap:20px; padding:20px; text-align:center;">
    </div>

<div class="action-bar">
    <button class="btn-circle btn-active" style="background:#8a2be2;" onclick="accion('📸 Galería')">📸</button>
    <button id="mic" class="btn-circle btn-active" style="background:#ff3333;" onclick="toggleMic()">🎙️</button>
    <button class="btn-circle btn-active" style="background:linear-gradient(45deg, #f09433, #dc2743);" onclick="accion('🎬 Reels')">🎬</button>
    <button id="spk" class="btn-circle btn-active" style="background:#00ff00;" onclick="toggleSpk()">🔊</button>
    <button class="btn-circle btn-active" style="background:orange;" onclick="enviarRegalo()">🎁</button>
</div>

<audio id="stream" autoplay playsinline></audio>

<script>
    // FUNCIONES DE CONTROL
    let micOn = false;
    let spkOn = true;

    function accion(tipo) {
        alert("Abriendo " + tipo + "...");
    }

    function toggleMic() {
        micOn = !micOn;
        const btn = document.getElementById('mic');
        btn.style.background = micOn ? "#00ff00" : "#ff3333";
        // Aquí conectas tu PeerJS/Zego para hablar
        mostrarToast(micOn ? "🎙️ Micrófono Abierto" : "🎙️ Micrófono Mutado");
    }

    function toggleSpk() {
        spkOn = !spkOn;
        const btn = document.getElementById('spk');
        const audio = document.getElementById('stream');
        btn.style.background = spkOn ? "#00ff00" : "#ff3333";
        audio.muted = !spkOn;
        mostrarToast(spkOn ? "🔊 Audio Activado" : "🔊 Audio Silenciado");
    }

    function mostrarToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.right = "0";
        setTimeout(() => t.style.right = "-100%", 3000);
    }

    // Quién entra (Simulación para que veas el movimiento)
    setTimeout(() => mostrarToast("👋 Socio Melvin entró a sala"), 2000);

    // Cargar sillas
    const sillas = document.getElementById('sillas');
    for(let i=1; i<=9; i++) {
        sillas.innerHTML += `<div><div style="width:60px; height:60px; border-radius:50%; background:#1a1a1a; border:2px solid #333; margin:0 auto; display:flex; align-items:center; justify-content:center;">👤</div><div style="font-size:10px; color:#00ffcc; margin-top:5px;">Libre</div></div>`;
    }
</script>
</body>
</html>
