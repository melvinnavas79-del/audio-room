<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lluvia Live - Audio Recovery</title>
    
    <script src="https://resource.zegocloud.com/prebuilt/zegocloud-prebuilt.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body { margin: 0; background: #0d001a; color: white; font-family: sans-serif; text-align: center; }
        .header-sala { background: rgba(20,20,20,0.9); padding: 15px; border: 2px solid #ffd700; border-radius: 20px; width: 90%; margin: 15px auto; }
        .btn-control { background: #222; border: 2px solid #ffd700; border-radius: 15px; padding: 20px; width: 85%; color: white; font-weight: bold; font-size: 18px; margin-bottom: 12px; }
        .active { background: #ffd700 !important; color: black !important; box-shadow: 0 0 15px #ffd700; }
        
        /* Pantalla de Inicio Única para evitar bloqueos */
        .lobby { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .input-style { padding: 15px; border-radius: 10px; border: 2px solid #ffd700; background: #111; color: white; width: 75%; font-size: 18px; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>

    <div id="lobby" class="lobby">
        <h1 style="color: #00ff00; font-size: 35px;">☔ LLUVIA LIVE</h1>
        <input type="text" id="u-name" class="input-style" placeholder="Tu Nombre">
        <input type="number" id="s-id" class="input-style" placeholder="ID de Sala (Ej: 100)">
        <button onclick="iniciarApp()" style="background:#0000ff; color:white; padding:20px; width:80%; border-radius:12px; font-weight:bold; border:none; font-size:18px;">ENTRAR</button>
    </div>

    <div id="main-app" style="display:none;">
        <div class="header-sala">
            <div style="font-size: 20px; color: #ffd700;">SALA ID: <span id="id-display">---</span></div>
            <div style="margin: 8px 0;">💰 Oros: <span id="oro-txt">0</span> | 🛡️ Clan: <span style="color:red;">Lluvia</span></div>
        </div>

        <div style="margin-top: 50px;">
            <button id="btn-mic" class="btn-control" onclick="toggleMic()">🎙️ ENCENDER MICRO</button>
            <button id="btn-box" class="btn-control" onclick="toggleAudio()">🔊 ACTIVAR BOCINA</button>
        </div>

        <div id="zego-root" style="display:none;"></div>
    </div>

    <script>
        // Configuración Firebase (Melvin)
        const firebaseConfig = {
            apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4",
            authDomain: "lluvia-live-69a05.firebaseapp.com",
            projectId: "lluvia-live-69a05",
            storageBucket: "lluvia-live-69a05.firebasestorage.app",
            messagingSenderId: "909704512499",
            appId: "1:909704512499:web:a8f0d658fb6dbd3f610886"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let zp = null;
        let micEnabled = false;

        async function iniciarApp() {
            const name = document.getElementById('u-name').value || "User";
            const room = document.getElementById('s-id').value || "100";
            
            document.getElementById('id-display').innerText = room;
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';

            // Generar Token de Zego
            const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(1111976694, "25049a1d82f7cc4b219154a4f89d53f5", room, "U"+Date.now(), name);
            zp = ZegoUIKitPrebuilt.create(kitToken);
            
            await zp.joinRoom({
                container: document.querySelector("#zego-root"),
                scenario: { mode: ZegoUIKitPrebuilt.GroupCall },
                showPreJoinView: false,
                turnOnMicrophoneWhenJoining: false // Importante: Empezar apagado para que el usuario lo active
            });

            // Escuchar Oros
            db.collection("usuarios").doc("Melvin_User").onSnapshot(doc => {
                if(doc.exists) document.getElementById('oro-txt').innerText = doc.data().oro || 0;
            });
        }

        function toggleMic() {
            micEnabled = !micEnabled;
            zp.turnMicrophoneOn(micEnabled);
            const btn = document.getElementById('btn-mic');
            btn.innerText = micEnabled ? "🎙️ MICRO: ON" : "🎙️ ENCENDER MICRO";
            btn.className = micEnabled ? "btn-control active" : "btn-control";
        }

        function toggleAudio() {
            // Esta función "despierta" el audio en iPhones
            const context = new (window.AudioContext || window.webkitAudioContext)();
            if (context.state === 'suspended') {
                context.resume();
            }
            const btn = document.getElementById('btn-box');
            btn.innerText = "🔊 AUDIO SINCRONIZADO";
            btn.className = "btn-control active";
        }
    </script>
</body>
</html>
