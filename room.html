<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lluvia Live - Versión Recuperada</title>
    
    <script src="https://resource.zegocloud.com/prebuilt/zegocloud-prebuilt.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body { 
            margin: 0; 
            background: #0d001a; 
            color: white; 
            font-family: sans-serif; 
            text-align: center; 
            overflow: hidden; 
        }
        
        /* Diseño de Cabecera de tus capturas */
        .header-sala { 
            background: rgba(20,20,20,0.95); 
            padding: 15px; 
            border: 2px solid #ffd700; 
            border-radius: 20px; 
            width: 90%; 
            margin: 15px auto; 
        }
        
        /* Botones de Control Estilo Melvin */
        .btn-control { 
            background: #222; 
            border: 2px solid #ffd700; 
            border-radius: 15px; 
            padding: 20px; 
            width: 85%; 
            color: white; 
            font-weight: bold; 
            font-size: 18px; 
            margin-bottom: 15px; 
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }
        
        .active { 
            background: #ffd700 !important; 
            color: black !important; 
            box-shadow: 0 0 20px #ffd700; 
        }

        .btn-billetera { 
            background: #ffd700; 
            color: black; 
            padding: 20px; 
            border-radius: 50px; 
            width: 80%; 
            font-weight: bold; 
            border: none; 
            font-size: 18px; 
            position: fixed;
            bottom: 40px;
            left: 10%;
        }
        
        /* Pantalla de Acceso */
        .lobby { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 9999; display: flex; 
            flex-direction: column; justify-content: center; align-items: center; 
        }
        .input-melvin { 
            padding: 15px; border-radius: 10px; border: 2px solid #ffd700; 
            background: #111; color: white; width: 75%; font-size: 18px; 
            margin-bottom: 15px; text-align: center; 
        }
    </style>
</head>
<body>

    <div id="pantalla-inicio" class="lobby">
        <h1 style="color: #ffd700; font-size: 35px;">☔ LLUVIA LIVE</h1>
        <input type="text" id="user-nick" class="input-melvin" placeholder="Tu Nombre">
        <input type="number" id="room-id" class="input-melvin" placeholder="ID de Sala">
        <button onclick="activarVersionEstable()" style="background:#0000ff; color:white; padding:20px; width:80%; border-radius:12px; font-weight:bold; border:none; font-size:20px;">ENTRAR AHORA</button>
    </div>

    <div id="sala-principal" style="display:none;">
        <div class="header-sala">
            <div style="font-size: 22px; color: #ffd700;">SALA ID: <span id="id-txt">---</span></div>
            <div style="margin: 10px 0;">💰 Oro: <span id="oro-txt" style="color:#00ff00; font-weight:bold;">0</span> | 🛡️ Clan: <span style="color:red;">Lluvia</span></div>
            <div style="display:flex; justify-content:space-around; font-size:12px; border-top:1px solid #333; padding-top:10px;">
                <span>💎 Aristocracia</span>
                <span>✨ SVIP</span>
                <span>🔥 VIP</span>
            </div>
        </div>

        <div style="margin-top: 50px;">
            <button id="btn-mic" class="btn-control" onclick="switchMicrofono()">🎙️ ENCENDER MICRO</button>
            <button id="btn-audio" class="btn-control" onclick="activarBocina()">🔊 ACTIVAR BOCINA</button>
        </div>

        <div id="zego-container" style="display:none;"></div>

        <button class="btn-billetera" onclick="alert('Abriendo Billetera...')">💳 BILLETERA</button>
    </div>

    <script>
        // Configuración Firebase Melvin
        const firebaseConfig = {
            apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4",
            authDomain: "lluvia-live-69a05.firebaseapp.com",
            projectId: "lluvia-live-69a05",
            storageBucket: "lluvia-live-69a05.firebasestorage.app",
            messagingSenderId: "909704512499",
            appId: "1:909704512499:web:a8f0d658fb6dbd3f610886"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let zp = null;
        let micStatus = false;

        async function activarVersionEstable() {
            const nombre = document.getElementById('user-nick').value || "Melvin";
            const sala = document.getElementById('room-id').value || "100";
            
            document.getElementById('id-txt').innerText = sala;
            document.getElementById('pantalla-inicio').style.display = 'none';
            document.getElementById('sala-principal').style.display = 'block';

            // Conexión Real de Audio (ZegoCloud)
            const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(1111976694, "25049a1d82f7cc4b219154a4f89d53f5", sala, "U"+Date.now(), nombre);
            zp = ZegoUIKitPrebuilt.create(kitToken);
            
            await zp.joinRoom({
                container: document.querySelector("#zego-container"),
                scenario: { mode: ZegoUIKitPrebuilt.GroupCall },
                showPreJoinView: false,
                turnOnMicrophoneWhenJoining: false 
            });

            // Sincronización de Oros en Vivo
            db.collection("usuarios").doc("Melvin_User").onSnapshot(doc => {
                if(doc.exists) {
                    document.getElementById('oro-txt').innerText = doc.data().oro || 0;
                }
            });
        }

        function switchMicrofono() {
            micStatus = !micStatus;
            zp.turnMicrophoneOn(micStatus);
            const btn = document.getElementById('btn-mic');
            btn.innerText = micStatus ? "🎙️ MICRO: ENCENDIDO" : "🎙️ ENCENDER MICRO";
            btn.className = micStatus ? "btn-control active" : "btn-control";
        }

        function activarBocina() {
            // Esto fuerza al navegador a permitir el audio de los demás
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById('btn-audio').className = "btn-control active";
            document.getElementById('btn-audio').innerText = "🔊 BOCINA: ACTIVA";
        }
    </script>
</body>
</html>
