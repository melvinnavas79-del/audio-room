<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lluvia Live Premium</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root { --gold: #ffd700; --neon-green: #00ffcc; --dark-bg: #0a0a12; }
        body { margin: 0; background: var(--dark-bg); color: white; font-family: 'Segoe UI', Roboto, sans-serif; overflow-x: hidden; }
        
        /* Pantalla de Carga/Login */
        #login-screen { position: fixed; inset: 0; background: radial-gradient(circle, #1a1a2e 0%, #000 100%); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .logo-premium { font-size: 50px; font-weight: 800; background: linear-gradient(to bottom, #fff, #ffd700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 40px; }

        /* Estilo de Inputs */
        .input-glass { width: 80%; padding: 16px; margin: 12px 0; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white; font-size: 18px; text-align: center; backdrop-filter: blur(10px); }

        /* App Principal */
        #main-app { display: none; padding-bottom: 120px; }
        .top-bar { background: rgba(0,0,0,0.8); padding: 20px; border-bottom: 1px solid var(--gold); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        
        /* El Panel de las Sillas */
        .room-container { background: linear-gradient(180deg, rgba(26,26,46,1) 0%, rgba(10,10,18,1) 100%); padding: 20px; border-radius: 0 0 40px 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .sillas-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .silla-wrapper { display: flex; flex-direction: column; align-items: center; }
        .silla-main { width: 75px; height: 75px; border-radius: 50%; border: 2px solid #333; background: #151525; display: flex; align-items: center; justify-content: center; font-size: 28px; position: relative; transition: 0.3s; }
        .active-mic { border-color: var(--neon-green); box-shadow: 0 0 20px var(--neon-green); transform: scale(1.05); }

        /* Anuncio de Regalos (La Magia) */
        #gift-announcement { position: fixed; top: 120px; left: 50%; transform: translateX(-50%); width: 90%; background: linear-gradient(90deg, transparent, rgba(255,215,0,0.8), transparent); padding: 10px; text-align: center; font-weight: bold; font-size: 18px; color: black; z-index: 2000; display: none; border-radius: 50px; animation: slideIn 0.5s ease-out; }

        /* Barra de Navegación Estilo iPhone */
        .dock-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; background: rgba(20,20,30,0.9); backdrop-filter: blur(20px); border-radius: 30px; display: flex; justify-content: space-around; align-items: center; padding: 15px 0; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
        .nav-btn { background: none; border: none; color: white; display: flex; flex-direction: column; align-items: center; font-size: 11px; gap: 5px; }
        .gift-main-btn { background: linear-gradient(135deg, #ff9800, #f44336); width: 70px; height: 70px; border-radius: 50%; margin-top: -40px; box-shadow: 0 10px 20px rgba(244,67,54,0.4); border: 4px solid var(--dark-bg); font-size: 30px; }

        @keyframes slideIn { from { transform: translateX(-50%) translateY(-50px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="logo-premium">LLUVIA</div>
        <p style="color: #aaa; margin-bottom: 20px;">Social Audio & Luxury</p>
        <input type="text" id="user-name" class="input-glass" placeholder="Tu Nombre de Usuario">
        <input type="text" id="room-id" class="input-glass" placeholder="ID de la Sala">
        <div style="display: flex; gap: 10px; width: 85%;">
            <button class="btn-action" style="background:var(--gold); color:black; padding:18px; border-radius:15px; border:none; width:100%; font-weight:bold;" onclick="entrarSala()">ENTRAR A LA SALA</button>
        </div>
    </div>

    <div id="main-app">
        <div id="gift-announcement">🎁 ¡MELVIN ENVIÓ UN REGALO!</div>
        
        <div class="top-bar">
            <div><span style="color:var(--gold)">💰</span> <b id="oro-txt">0</b></div>
            <div id="room-name-txt" style="font-weight:bold; letter-spacing:1px;">SALA: ---</div>
            <button onclick="gestionarTurno()" id="btn-ponchar" style="background:#ff9800; border:none; color:white; padding:5px 12px; border-radius:10px; font-size:12px;">🚀 PONCHAR</button>
        </div>

        <div class="room-container">
            <div class="sillas-grid" id="grid-sillas">
                </div>
        </div>

        <div id="lista-conectados" style="padding: 20px;">
            <p style="color:#666; font-size:12px; text-transform:uppercase;">Gente en el público</p>
            <div id="usuarios-lista" style="display:flex; flex-wrap:wrap; gap:10px;"></div>
        </div>

        <div class="dock-nav">
            <button class="nav-btn" onclick="toggleMicro()"> <div id="mic-btn" style="font-size:24px;">🎙️</div> <span>Hablar</span></button>
            <button class="nav-btn gift-main-btn" onclick="abrirModal('modal-regalos')">🎁</button>
            <button class="nav-btn" onclick="abrirModal('modal-wallet')"> <div style="font-size:24px;">💳</div> <span>Wallet</span></button>
        </div>
    </div>

    <div id="modal-regalos" style="display:none; position:fixed; bottom:0; width:100%; background:#1a1a2e; border-top:3px solid var(--gold); border-radius:30px 30px 0 0; padding:20px; z-index:10000; animation: slideUp 0.3s ease;">
        <h3 style="text-align:center; margin-bottom:20px;">Enviar Regalo</h3>
        <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:15px;">
            <div onclick="enviarRegalo('Rosa', 10)" style="text-align:center; background:#252545; padding:10px; border-radius:15px;">🌹<br>10</div>
            <div onclick="enviarRegalo('Corona', 500)" style="text-align:center; background:#252545; padding:10px; border-radius:15px;">👑<br>500</div>
            <div onclick="enviarRegalo('Carro', 2000)" style="text-align:center; background:#252545; padding:10px; border-radius:15px;">🚗<br>2K</div>
        </div>
        <button onclick="cerrarModal()" style="width:100%; margin-top:20px; background:none; border:none; color:#666;">Cerrar</button>
    </div>

    <audio id="remote-audio" autoplay playsinline webkit-playsinline></audio>

    <script>
        // ... (Aquí va toda la lógica de Firebase y PeerJS que ya teníamos)
        // Pero ajustada para que solo muestre 6 SILLAS y use el diseño nuevo.
        const firebaseConfig = { apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4", projectId: "lluvia-live-69a05" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let peer, localStream, room, nombre;

        // Generar solo 6 sillas para máxima estabilidad
        const grid = document.getElementById('grid-sillas');
        for(let i=1; i<=6; i++) {
            grid.innerHTML += `
                <div class="silla-wrapper">
                    <div class="silla-main" id="silla-${i}">👤</div>
                    <span style="font-size:10px; color:#666; margin-top:5px;">Silla ${i}</span>
                </div>`;
        }

        async function entrarSala() {
            nombre = document.getElementById('user-name').value;
            room = document.getElementById('room-id').value;
            if(!nombre || !room) return alert("Escribe tu nombre y sala");

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('room-name-txt').innerText = "SALA: " + room.toUpperCase();

            // Configuración estable de Google
            peer = new Peer('lluvia-' + room + '-' + nombre, {
                config: {'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }]}
            });

            // Registro en Firebase
            db.collection("usuarios").doc(nombre).set({ oro: 1000, nombre: nombre }, {merge: true});
            db.collection("salas").doc(room).collection("usuarios").doc(nombre).set({ nombre: nombre });

            // Escuchar Usuarios
            db.collection("salas").doc(room).collection("usuarios").onSnapshot(snap => {
                const lista = document.getElementById('usuarios-lista');
                lista.innerHTML = "";
                snap.forEach(doc => {
                    lista.innerHTML += `<div style="background:#222; padding:5px 12px; border-radius:15px; font-size:12px; border:1px solid #333;">${doc.id}</div>`;
                });
            });

            // Escuchar Regalos para el anuncio brillante
            db.collection("salas").doc(room).onSnapshot(doc => {
                const data = doc.data();
                if(data && data.ultimo_regalo) {
                    mostrarAnuncio(data.ultimo_regalo);
                }
            });
        }

        function mostrarAnuncio(msg) {
            const el = document.getElementById('gift-announcement');
            el.innerText = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        async function enviarRegalo(item, costo) {
            // Lógica para descontar oro y actualizar el anuncio en la sala
            const ref = db.collection("salas").doc(room);
            await ref.set({ ultimo_regalo: `🎁 ¡${nombre} envió ${item.toUpperCase()}!` }, {merge: true});
            cerrarModal();
        }

        function abrirModal(id) { document.getElementById(id).style.display = 'block'; }
        function cerrarModal() { document.getElementById('modal-regalos').style.display = 'none'; }
        
        // ... (Mantén tus funciones de toggleMicro y toggleBocina aquí)
    </script>
</body>
</html>
