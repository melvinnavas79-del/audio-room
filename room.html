<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://resource.zegocloud.com/prebuilt/ZegoExpressWebRTC.js"></script>
    <style>
        body { margin:0; background:#0b001a; color:white; font-family:sans-serif; overflow:hidden; }
        #premium-banner { width:92%; margin:10px auto; background:rgba(20,20,30,0.95); border-radius:20px; border:2px solid #ffd700; display:flex; justify-content:space-around; align-items:center; padding:12px 5px; box-shadow: 0 0 15px rgba(255,215,0,0.5); }
        #sillas-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; padding:20px; }
        .silla-circle { width:65px; height:65px; border-radius:50%; background:#1a1a1a; border:2px solid #333; margin:0 auto; display:flex; align-items:center; justify-content:center; position: relative; }
        .action-bar { position:fixed; bottom:40px; width:100%; display:flex; justify-content:space-evenly; }
        .btn-round { width:60px; height:60px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; font-size:24px; }
        #gift-shop { position:fixed; bottom:-100%; left:0; width:100%; background:black; transition:0.4s; display:grid; grid-template-columns:repeat(3,1fr); padding:20px 0; }
    </style>
</head>
<body>

<div id="login-screen" style="padding:50px 20px; text-align:center;">
    <h1 style="color:gold;">☔ LLUVIA LIVE</h1>
    <input type="text" id="user-name" placeholder="Tu Apodo" style="padding:15px; width:80%; border-radius:10px; margin-bottom:10px;">
    <input type="number" id="room-id" placeholder="ID Sala" style="padding:15px; width:80%; border-radius:10px; margin-bottom:20px;">
    <button onclick="unirseASala()" style="background:#00ff00; padding:15px 50px; border-radius:30px; font-weight:bold; border:none;">ENTRAR</button>
</div>

<div id="main-app" style="display:none;">
    <div id="premium-banner">
        <div>👑 SVIP</div>
        <div>💰 ORO: <span id="oro-cont">1000</span></div>
        <div onclick="recargar()">💵 RECARGA</div>
    </div>
    <div id="sillas-grid"></div>
    <div class="action-bar">
        <button class="btn-round" style="background:#8a2be2;">📸</button>
        <button id="mic-btn" class="btn-round" style="background:#ff3333;" onclick="toggleMic()">🎙️</button>
        <button class="btn-round" style="background:#444;" onclick="abrirTienda()">🎁</button>
        <button class="btn-round" style="background:#00ff00;">🔊</button>
    </div>
</div>

<div id="gift-shop">
    <div onclick="enviarRegalo(10, '🌹')">🌹 10</div>
    <div onclick="enviarRegalo(500, '🚗')">🚗 500</div>
    <div onclick="document.getElementById('gift-shop').style.bottom='-100%'">❌</div>
</div>

<script>
    const appID = 249373029; // Tu AppID real
    let miOro = 1000;
    let micOn = false;
    let zg;

    async function unirseASala() {
        const user = document.getElementById('user-name').value;
        const room = document.getElementById('room-id').value;
        if(!user || !room) return;

        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';

        // Inicializar ZegoCloud
        zg = new ZegoExpressEngine(appID, 'wss://webliveroom-api.zegocloud.com/ws');
        
        // Crear sillas
        const grid = document.getElementById('sillas-grid');
        for(let i=1; i<=9; i++) grid.innerHTML += `<div class="silla-circle" onclick="sentarse(${i})">👤</div>`;
    }

    function enviarRegalo(costo, emoji) {
        if(miOro >= costo) {
            miOro -= costo;
            document.getElementById('oro-cont').innerText = miOro;
            alert("Regalo enviado: " + emoji);
        } else {
            alert("Oro insuficiente");
        }
    }

    function abrirTienda() { document.getElementById('gift-shop').style.bottom = "0"; }
    function recargar() { miOro += 1000; document.getElementById('oro-cont').innerText = miOro; }
    function toggleMic() { micOn = !micOn; document.getElementById('mic-btn').style.background = micOn ? "#00ff00" : "#ff3333"; }
</script>
</body>
</html>
