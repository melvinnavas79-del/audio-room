<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lluvia Live</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=AfHuBVaA8_T6bxvMRwYfG&currency=USD" async></script>

    <style>
        body { margin: 0; background: #1a0033; color: white; font-family: sans-serif; text-align: center; height: 100vh; }
        .header-panel { background: rgba(0,0,0,0.8); width: 92%; margin: 10px auto; padding: 15px; border-radius: 20px; border: 2px solid #ffd700; box-sizing: border-box; }
        .user-info { font-weight: bold; color: #ffd700; margin-bottom: 5px; }
        .stats { display: flex; justify-content: space-around; font-size: 0.9rem; border-top: 1px solid #444; padding-top: 8px; }
        
        /* Contenedor Sala */
        .room-tag { margin-top: 20px; font-weight: bold; color: #ffd700; }

        /* Billetera */
        #wallet-modal { display: none; position: fixed; top: 15%; left: 5%; width: 90%; background: #222; border: 3px solid #ffd700; border-radius: 25px; padding: 20px; z-index: 1000; box-sizing: border-box; }
        .pack-box { background: #333; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #555; }
        #paypal-button-container { margin-top: 15px; min-height: 150px; }
        
        .footer { position: fixed; bottom: 30px; width: 100%; display: flex; justify-content: center; }
        .btn-wallet { width: 80px; height: 80px; border-radius: 50%; background: #ffd700; color: black; font-weight: bold; border: 4px solid white; cursor: pointer; box-shadow: 0 0 15px #ffd700; }
    </style>
</head>
<body>

    <div class="header-panel">
        <div class="user-info" id="user-tag">👤 Cargando...</div>
        <div class="stats">
            <span>💰 Oro: <b id="oro-val">...</b></span>
            <span>🛡️ Clan: Lluvia</span>
        </div>
    </div>

    <div class="room-tag">📍 Sala: 100</div>

    <div id="wallet-modal">
        <h2 style="color:#ffd700; margin-top:0;">RECARGA ORO</h2>
        <div class="pack-box">
            <div style="font-size: 1.2rem;">💎 5500 Oros</div>
            <div style="color:#00ff00; font-weight:bold;">$49.99 USD</div>
        </div>
        
        <div id="paypal-button-container"></div>
        
        <button onclick="document.getElementById('wallet-modal').style.display='none'" 
                style="background:#ff3333; color:white; border:none; padding:10px; width:100%; border-radius:10px; font-weight:bold; margin-top:10px;">
            CERRAR
        </button>
    </div>

    <div class="footer">
        <button class="btn-wallet" onclick="abrirWallet()">💳<br>Billetera</button>
    </div>

    <script>
        // Configuración Firebase (de tu foto)
        const firebaseConfig = {
            apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4",
            authDomain: "lluvia-live-69a05.firebaseapp.com",
            projectId: "lluvia-live-69a05",
            storageBucket: "lluvia-live-69a05.firebasestorage.app",
            messagingSenderId: "909704512499",
            appId: "1:909704512499:web:a8f0d658fb6dbd3f610886"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Nombre de usuario
        let miNombre = localStorage.getItem('nombre_lluvia') || "Usuario_" + Math.floor(Math.random()*999);
        document.getElementById('user-tag').innerText = "👤 " + miNombre;

        // Escuchar Oro en tiempo real
        db.collection("usuarios").doc(miNombre).onSnapshot(doc => {
            if(doc.exists) document.getElementById('oro-val').innerText = doc.data().oro;
            else db.collection("usuarios").doc(miNombre).set({ oro: 1000 });
        });

        function abrirWallet() {
            document.getElementById('wallet-modal').style.display = 'block';
            // Cargamos el botón solo cuando se abre la billetera
            if (window.paypal) {
                renderPaypal();
            } else {
                alert("PayPal está cargando, espera un segundo...");
            }
        }

        function renderPaypal() {
            document.getElementById('paypal-button-container').innerHTML = "";
            paypal.Buttons({
                createOrder: (data, actions) => {
                    return actions.order.create({
                        purchase_units: [{ amount: { value: '49.99' }, description: "5500 Oros Lluvia Live" }]
                    });
                },
                onApprove: (data, actions) => {
                    return actions.order.capture().then(details => {
                        db.collection("usuarios").doc(miNombre).update({
                            oro: firebase.firestore.FieldValue.increment(5500)
                        }).then(() => {
                            alert("¡Recarga exitosa! Gracias " + details.payer.name.given_name);
                            document.getElementById('wallet-modal').style.display='none';
                        });
                    });
                }
            }).render('#paypal-button-container');
        }
    </script>
</body>
</html>
