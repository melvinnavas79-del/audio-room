<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lluvia Live MEGA PRO GOD MODE</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
    body{margin:0;background:#0b001a;color:white;font-family:sans-serif;overflow-x:hidden;}
    .header{display:flex;justify-content:space-between;padding:15px;background:#000;border-bottom:2px solid #333;}
    .sillas{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding:20px;margin-bottom:100px;}
    .avatar{width:85px;height:85px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;position:relative;border:2px solid #444;}
    .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:1px solid #00ffff;}
    .clan{position:absolute;top:-6px;background:red;font-size:9px;padding:2px 5px;border-radius:5px;z-index:10;}
    .aristo{position:absolute;bottom:-12px;background:#ff4500;font-size:9px;padding:2px 5px;border-radius:5px;}
    .badge-top{position:absolute;top:-35px;background:linear-gradient(gold, orange);color:black;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:bold;box-shadow:0 0 10px gold;}
    .bar{position:fixed;bottom:0;width:100%;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;background:rgba(0,0,0,0.9);padding:15px;z-index:100;}
    button{border:none;border-radius:10px;padding:8px 12px;background:#333;color:white;font-size:12px;font-weight:bold;cursor:pointer;}
    #gift{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;pointer-events:none;z-index:999;}
    .gift-anim{font-size:100px;animation:zoom 2.5s forwards;}
    @keyframes zoom{0%{transform:scale(0);opacity:0}20%{transform:scale(1.2);opacity:1}100%{transform:scale(0);opacity:0}}
    #chatBox::-webkit-scrollbar {width: 5px;}
    #chatBox::-webkit-scrollbar-thumb {background: #444; border-radius: 5px;}
</style>
</head>
<body>

<div class="header">
    <div>💰 <span id="oro">0</span> | Lv.<span id="lvl">1</span></div>
    <div style="font-weight:bold;color:#ff00ff;">LLUVIA LIVE MEGA PRO</div>
    <button onclick="loginGoogle()" style="background:#00ffff;color:black;border-radius:10px;padding:5px 10px;">🔐 LOGIN</button>
</div>

<div id="gift"></div>
<div class="sillas" id="grid"></div>

<div class="bar">
    <button onclick="sentarse(1)">🪑</button>
    <button onclick="enviarRegalo('rosa')">🌹</button>
    <button onclick="enviarRegalo('leon')">🦁</button>
    <button onclick="rankingPro()">🏆 TOP</button>
</div>

<script>
// --- CONFIGURACIÓN CORE ---
let nombre = localStorage.getItem("username") || "User_" + Math.floor(Math.random()*999);
let uid_safe = localStorage.getItem("uid") || nombre;
let foto_safe = localStorage.getItem("userfoto") || null;
let clan = localStorage.getItem("userclan") || "Clan";

firebase.initializeApp({projectId:"lluvia-live-69a05"});
const db = firebase.firestore();

let oro=5000, xp=0, lvl=1, aristo=7, campeon=false;

window.onload = () => { 
    crearSillas(); 
    cargarUsuario();
    crearChatUI();
    escucharChat();
    agregarBotonesExtra();
};

// --- SISTEMAS DE PREMIOS (USUARIOS Y CLANES) ---
async function cargarUsuario(){
    let d = await db.collection("usuarios").doc(nombre).get();
    if(d.exists){
        oro = d.data().oro || 0;
        xp = d.data().xp || 0;
        campeon = d.data().campeon || false;
        foto_safe = d.data().foto || null;
    }
    lvl = Math.floor(Math.sqrt(xp/100)) + 1;
    updateUI();
    escucharSalas();
}

async function verificarTopAutomatico(){
    let snap = await db.collection("eventos").doc("global").get();
    let data = snap.data() || {};
    let lista = Object.entries(data).sort((a,b)=>b[1]-a[1]);
    if(lista.length >= 3){
        let premios = [45000000, 35000000, 25000000];
        for(let i=0; i<3; i++){
            if(lista[i]) await db.collection("usuarios").doc(lista[i][0]).set({oro: firebase.firestore.FieldValue.increment(premios[i]), campeon: true}, {merge:true});
        }
    }
}

async function verificarClanesSemanales() {
    let snap = await db.collection("evento_clanes").doc("semana").get();
    let data = snap.data() || {};
    let lista = Object.entries(data).sort((a, b) => b[1] - a[1]);
    if (lista.length > 0) {
        let premiosClan = [50000000, 30000000, 20000000];
        for (let i = 0; i < Math.min(lista.length, 3); i++) {
            console.log(`Clan ${lista[i][0]} gana ${premiosClan[i]}`);
        }
    }
}

function gestionSemanalAutomatica() {
    let hoy = new Date();
    if (hoy.getDay() === 1) {
        verificarClanesSemanales();
        db.collection("evento_clanes").doc("semana").set({});
    }
}

// --- CHAT, CP Y CASINO ---
function crearChatUI(){
    let div = document.createElement("div");
    div.style.cssText = "position:fixed;right:10px;bottom:140px;z-index:90;";
    div.innerHTML = `<div id="chatBox" style="width:200px;height:180px;background:rgba(0,0,0,0.8);border:1px solid #444;border-radius:10px;overflow-y:auto;font-size:11px;padding:5px;margin-bottom:5px;"></div>
        <div style="display:flex;gap:2px;"><input id="chatInput" style="width:130px;background:#222;color:white;border:1px solid #444;border-radius:5px;padding:3px;">
        <button onclick="enviarMensaje(document.getElementById('chatInput').value)" style="padding:3px 8px;background:#00ffff;color:black;font-size:10px;">Send</button></div>`;
    document.body.appendChild(div);
}

async function enviarMensaje(txt){
    if(!txt) return;
    await db.collection("chat").add({ nombre, txt, time: Date.now() });
    document.getElementById("chatInput").value = "";
}

function escucharChat(){
    db.collection("chat").orderBy("time","desc").limit(20).onSnapshot(snap => {
        let chat = document.getElementById("chatBox");
        if(!chat) return;
        chat.innerHTML = snap.docs.reverse().map(d => `<div><b style="color:#00ffff">${d.data().nombre}:</b> ${d.data().txt}</div>`).join("");
        chat.scrollTop = chat.scrollHeight;
    });
}

function agregarBotonesExtra(){
    const bar = document.querySelector(".bar");
    const btns = [{t: "🏷️ CLAN", f: rankingClanes}, {t: "💞 CP", f: crearCP}, {t: "🎡", f: ruleta}, {t: "🎰", f: slots}];
    btns.forEach(b => {
        let btn = document.createElement("button");
        btn.innerText = b.t; btn.onclick = b.f; bar.appendChild(btn);
    });
}

async function crearCP(){
    let p = prompt("Pareja:");
    if(p) await db.collection("cp").doc(nombre).set({ pareja:p, nivel:1, puntos:0 }, {merge:true});
}

function ruleta(){
    let p = Math.random();
    if(p < 0.5) alert("😢"); else { oro += p < 0.8 ? 500 : 2000; updateUI(); }
}

function slots(){
    let r = Math.floor(Math.random()*3);
    if(r > 0) { oro += r === 1 ? 300 : 1500; updateUI(); }
}

// --- CORE UI ---
function updateUI(){
    document.getElementById("oro").innerText = oro;
    db.collection("usuarios").doc(nombre).set({oro, xp, nombre, foto: foto_safe, uid: uid_safe}, {merge:true});
}

async function sentarse(id){
    await db.collection("salas").doc("global").set({ ["s"+id]: {nombre, clan, aristo, foto: foto_safe, campeon} }, {merge:true});
}

function escucharSalas(){
    db.collection("salas").doc("global").onSnapshot(doc => {
        let data = doc.data() || {};
        for(let i=1; i<=9; i++){
            let s = data["s"+i], el = document.getElementById("s"+i);
            if(s && el){
                el.innerHTML = `<div class="clan">${s.clan}</div>${s.campeon ? '<div class="badge-top">👑</div>' : ''}<div class="aristo">A.${s.aristo}</div>${s.foto ? `<img src="${s.foto}">` : '👤'}<div style="font-size:9px;margin-top:45px;">${s.nombre}</div>`;
                el.style.border = "2px solid #00ffff";
            }
        }
    });
}

function loginGoogle(){
    const provider = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(provider).then(result => {
        nombre = result.user.displayName; foto_safe = result.user.photoURL; uid_safe = result.user.uid;
        localStorage.setItem("username", nombre); localStorage.setItem("userfoto", foto_safe); localStorage.setItem("uid", uid_safe);
        location.reload();
    });
}

setInterval(() => { 
    verificarTopAutomatico(); 
    gestionSemanalAutomatica(); 
    bonusDomingo();
}, 30000);

// =============================
// 🎯 BONUS DOMINGO AUTO RESET

// =============================
// 🎯 BONUS DOMINGO PRO (SEGURO)
// =============================

async function bonusDomingo(){

    let hoy = new Date();

    // solo domingo
    if(hoy.getDay() !== 0) return;

    let fechaHoy = hoy.toDateString();

    // 🔒 control global en Firebase (anti duplicados)
    let controlRef = db.collection("sistema").doc("bonus_domingo");
    let controlSnap = await controlRef.get();

    if(controlSnap.exists && controlSnap.data().fecha === fechaHoy){
        return;
    }

    // guardar que ya se pagó
    await controlRef.set({fecha: fechaHoy});

    let ref = db.collection("eventos").doc("global");
    let snap = await ref.get();
    let data = snap.data() || {};

    for(let user in data){

        let gasto = data[user];
        let bonus = 0;

        if(gasto >= 1000000000) bonus = 15000000;
        else if(gasto >= 500000000) bonus = 10000000;
        else if(gasto >= 200000000) bonus = 7000000;
        else if(gasto >= 100000000) bonus = 5000000;

        if(bonus > 0){
            await db.collection("usuarios").doc(user).set({
                oro: firebase.firestore.FieldValue.increment(bonus)
            }, {merge:true});

            console.log("💰 BONUS:", user, bonus);
        }
    }

    // animación
    let anim = document.createElement("div");
    anim.className = "gift-anim";
    anim.innerText = "🎁";
    document.getElementById("gift").appendChild(anim);
    setTimeout(() => anim.remove(), 2500);

    alert("🔥 BONUS DOMINGO PAGADO");
}
// =============================
// 🎯 BONUS DOMINGO PRO FULL
// =============================

 
</script>
</body>
</html>
