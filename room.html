<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lluvia Live - Store</title>
    <style>
        :root { --gold: #ffd700; --bg: #0b0015; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; height: 100vh; }

        /* ... (Mantenemos tu diseño de PK y Sillas igual) ... */
        .pk-container { width: 100%; height: 40px; display: flex; border-bottom: 2px solid var(--gold); background: #222; }
        .grid-sala { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; }
        .silla { background: rgba(255,255,255,0.1); width: 60px; height: 60px; border-radius: 50%; margin: 0 auto; border: 1px solid #444; }

        /* NAVEGACIÓN INFERIOR */
        .footer-nav { position: fixed; bottom: 60px; width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 100; }
        .btn-action { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--gold); background: #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 25px; cursor: pointer; }
        .btn-main { width: 80px; height: 80px; background: red; font-size: 35px; }

        /* --- MENÚ DE REGALOS ESTILO VOLA --- */
        #gift-menu {
            position: fixed; bottom: -100%; left: 0; width: 100%; height: 40%;
            background: rgba(15, 0, 30, 0.95); border-top: 3px solid var(--gold);
            border-radius: 20px 20px 0 0; transition: 0.4s ease; z-index: 1000;
            padding: 20px; box-sizing: border-box;
        }
        #gift-menu.open { bottom: 0; }

        .gift-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 10px; }
        .gift-item { text-align: center; font-size: 10px; color: var(--gold); }
        .gift-icon { font-size: 30px; display: block; margin-bottom: 5px; }
        
        .close-btn { position: absolute; top: 10px; right: 20px; font-size: 20px; color: white; }
    </style>
</head>
<body>

    <div class="pk-container">
        <div style="background:blue; width:50%; display:flex; align-items:center; justify-content:center;">CLAN A</div>
        <div style="background:red; width:50%; display:flex; align-items:center; justify-content:center;">CLAN B</div>
    </div>

    <div class="grid-sala">
        <div class="silla"></div><div class="silla"></div><div class="silla"></div>
        <div class="silla"></div><div class="silla"></div><div class="silla"></div>
    </div>

    <div class="footer-nav">
        <div class="btn-action" onclick="alert('Abriendo Banco')">🏦</div>
        <div class="btn-action btn-main" onclick="toggleGifts()">🎁</div>
        <div class="btn-action" onclick="alert('Abriendo VIP')">👑</div>
    </div>

    <div id="gift-menu">
        <div class="close-btn" onclick="toggleGifts()">✕</div>
        <h3 style="margin: 0; font-size: 16px;">Enviar Regalos</h3>
        <div class="gift-grid">
            <div class="gift-item" onclick="enviarRegalo('Rosa', 10)"><span class="gift-icon">🌹</span>10</div>
            <div class="gift-item" onclick="enviarRegalo('Anillo', 500)"><span class="gift-icon">💍</span>500</div>
            <div class="gift-item" onclick="enviarRegalo('Castillo', 5000)"><span class="gift-icon">🏰</span>5k</div>
            <div class="gift-item" onclick="enviarRegalo('Cohete', 10000)"><span class="gift-icon">🚀</span>10k</div>
            <div class="gift-item" onclick="enviarRegalo('Corona', 2000)"><span class="gift-icon">👑</span>2k</div>
            <div class="gift-item" onclick="enviarRegalo('Carro', 8000)"><span class="gift-icon">🏎️</span>8k</div>
            <div class="gift-item" onclick="enviarRegalo('Yate', 15000)"><span class="gift-icon">🛥️</span>15k</div>
            <div class="gift-item" onclick="enviarRegalo('León', 30000)"><span class="gift-icon">🦁</span>30k</div>
        </div>
    </div>

    <script>
        function toggleGifts() {
            document.getElementById('gift-menu').classList.toggle('open');
        }

        function enviarRegalo(nombre, costo) {
            alert("Has enviado un " + nombre + " por " + costo + " de oro.");
            toggleGifts();
            // Aquí es donde el contacto de Pakistán conectará la animación SVGA
        }
    </script>
</body>
</html>
