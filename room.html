<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lluvia Live - Recuperado</title>
    
    <script src="https://resource.zegocloud.com/prebuilt/zegocloud-prebuilt.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=AWOafs7E7hOuryPjXYaHIMvKeWhSgH65Fejg2eyY4b0BY_7xoClV0xhc45Zdr7Y5MhMGSCefLgl6X18&currency=USD"></script>

    <style>
        body { margin: 0; background: #1a0033; color: white; font-family: sans-serif; text-align: center; }
        
        /* Encabezado con Rangos */
        .header-sala { background: rgba(0,0,0,0.9); padding: 15px; border: 2px solid #ffd700; border-radius: 20px; width: 92%; margin: 15px auto; }
        .rango-row { display: flex; justify-content: space-around; border-top: 1px solid #444; padding-top: 10px; margin-top: 10px; font-size: 13px; }
        
        /* Botón de Activación (Paso obligado para iPhone) */
        .btn-activar { background: #ffd700; color: black; padding: 25px; border-radius: 20px; width: 85%; font-weight: bold; font-size: 20px; border: none; margin-top: 40px; box-shadow: 0 0 30px #ffd700; }
        
        /* Tus botones de control */
        .btn-control { background: #222; border: 2px solid #ffd700; border-radius: 15px; padding: 20px; width: 85%; color: white; font-weight: bold; margin-bottom: 15px; display: none; }
        .btn-control.on { background: #ffd700; color: black; box-shadow: 0 0 15px #ffd700; }

        .btn-wallet { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); background: #ffd700; color: black; padding: 18px 50px; border-radius: 40px; font-weight: bold; border: none; font-size: 18px; }
        
        .pantalla-inicio { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a0033; z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .input-sala { padding: 15px; border-radius: 12px; border: 2px solid #ffd700; background: #222; color: white; width: 80%; font-size: 18px; margin-bottom: 15px; text-align: center; }
        #zego-hidden { width: 1px; height: 1px; opacity: 0; }
    </style>
</head>
<body>

    <div id="lobby" class="pantalla-inicio">
        <h1 style="color: #ffd700;">LLUVIA LIVE</h1>
        <input type="number" id="room-input" class="input-sala" placeholder="ID de Sala">
        <button onclick="entrarApp()" style="background:#ffd700; color:black; padding:18px; width:85%; border-radius:12px; font-weight:bold; border:none;">ENTRAR</button>
    </div>

    <div id="app" style="display:none;">
        <div class="header-sala">
            <div style="font-size: 22px; color: #ffd700;">SALA: <span id="id-txt">---</span></div>
            <div style="margin-top:10px;">💰 Oro: <span id="oro-txt">0</span> | 🛡️ Clan: <span style="color:#ff4444;">Lluvia</span></div>
            <div class="rango-row">
                <span style="color:#ffd700;">💎 Aristocracia</span>
                <span style="color:#ff00ff;">✨ SVIP</span>
                <span style="color:#00ffff;">🔥 VIP</span>
            </div>
        </div>

        <button id="btn-conectar" class="btn-activar" onclick="conectarAudio()">🎙️ TOCAR PARA HABLAR</button>

        <div id="panel-controles" style="margin-top: 30px;">
            <button id="btn-m" class="btn-control" onclick="toggleMicro()">🎙️ MICRO: OFF</button>
            <button id="btn-b" class="btn-control" onclick="toggleBocina()">🔊 BOCINA: OFF</button>
        </div>

        <div id="zego-hidden"></div>
        <button class="btn-wallet" onclick="document.getElementById('tienda').style.display='block'">💳 BILLETERA</button>
    </div>

    <div id="tienda" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:5000; padding-top:40px;">
        <div style="background:#222; border:2px solid #ffd700; border-radius:20px; width:85%; margin:auto; padding:20px;">
            <h3 style="color:#ffd700;">Tienda de Oros</h3>
            <button onclick="pago('0.99', 100)" style="width:100%; padding:15px; margin-bottom:10px; background:#444; color:white; border:none; border-radius:10px;">100 Oros - $0.99</button>
            <div id="paypal-area"></div>
            <button onclick="document.getElementById('tienda').style.display='none'" style="color:red; background:none; border:none; margin-top:10px;">CERRAR</button>
        </div>
    </div>

    <script>
        // Configuración Firebase (Melvin, asegúrate que tus IDs sean estos)
        const firebaseConfig = {
            apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4",
            authDomain: "lluvia-live-69a05.firebaseapp.com",
            projectId: "lluvia-live-69a05",
            storageBucket: "lluvia-live-69a05.firebasestorage.app",
            messagingSenderId: "909704512499",
            appId: "1:909704512499:web:a8f0d658fb6dbd3f610886"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let zp = null;
        let microActivo = false;
        let bocinaActiva = false;

        function entrarApp() {
            const salaID = document.getElementById('room-input').value || "100";
            document.getElementById('id-txt').innerText = salaID;
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            
            db.collection("usuarios").doc("Melvin_User").onSnapshot(doc => {
                document.getElementById('oro-txt').innerText = doc.exists ? (doc.data().oro || 0) : 0;
            });
        }

        async function conectarAudio() {
            const salaID = document.getElementById('id-txt').innerText;
            const appID = 1111976694; 
            const serverSecret = "25049a1d82f7cc4b219154a4f89d53f5";
            const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(appID, serverSecret, salaID, "User_" + Date.now(), "Melvin");
            
            zp = ZegoUIKitPrebuilt.create(kitToken);
            await zp.joinRoom({
                container: document.querySelector("#zego-hidden"),
                scenario: { mode: ZegoUIKitPrebuilt.GroupCall },
                showPreJoinView: false,
                turnOnMicrophoneWhenJoining: true, // Esto pide el permiso al iPhone
            });

            document.getElementById('btn-conectar').style.display = 'none';
            document.getElementById('btn-m').style.display = 'block';
            document.getElementById('btn-b').style.display = 'block';
        }

        function toggleMicro() {
            microActivo = !microActivo;
            zp.turnMicrophoneOn(microActivo);
            const b = document.getElementById('btn-m');
            b.innerText = microActivo ? "🎙️ MICRO: ON" : "🎙️ MICRO: OFF";
            b.className = microActivo ? "btn-control on" : "btn-control";
        }

        function toggleBocina() {
            bocinaActiva = !bocinaActiva;
            const b = document.getElementById('btn-b');
            b.innerText = bocinaActiva ? "🔊 BOCINA: ON" : "🔊 BOCINA: OFF";
            b.className = bocinaActiva ? "btn-control on" : "btn-control";
        }

        function pago(val, cant) {
            document.getElementById('paypal-area').innerHTML = "";
            paypal.Buttons({
                createOrder: (d, a) => a.order.create({ purchase_units: [{ amount: { value: val } }] }),
                onApprove: (d, a) => a.order.capture().then(() => {
                    db.collection("usuarios").doc("Melvin_User").update({ oro: firebase.firestore.FieldValue.increment(cant) });
                    alert("¡Oros Recargados!");
                })
            }).render('#paypal-area');
        }
    </script>
</body>
</html>
