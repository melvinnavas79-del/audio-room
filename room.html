<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lluvia Live - Final Fix</title>
    
    <script src="https://resource.zegocloud.com/prebuilt/zegocloud-prebuilt.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=AWOafs7E7hOuryPjXYaHIMvKeWhSgH65Fejg2eyY4b0BY_7xoClV0xhc45Zdr7Y5MhMGSCefLgl6X18&currency=USD"></script>

    <style>
        body { margin: 0; background: #1a0033; color: white; font-family: sans-serif; text-align: center; }
        .header-sala { background: rgba(0,0,0,0.9); padding: 15px; border: 2px solid #ffd700; border-radius: 20px; width: 92%; margin: 15px auto; }
        
        .btn-melvin { background: #222; border: 2px solid #ffd700; border-radius: 15px; padding: 20px; width: 85%; color: white; font-weight: bold; font-size: 18px; margin-bottom: 15px; }
        .active { background: #ffd700 !important; color: black !important; box-shadow: 0 0 20px #ffd700; }

        .btn-wallet { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); background: #ffd700; color: black; padding: 18px 50px; border-radius: 40px; font-weight: bold; border: none; font-size: 18px; }
        
        /* Pantalla de inicio única */
        .lobby { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .input-sala { padding: 15px; border-radius: 12px; border: 2px solid #ffd700; background: #222; color: white; width: 80%; font-size: 18px; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>

    <div id="lobby" class="lobby">
        <h1 style="color: #00ff00; font-size: 40px;">☔ Lluvia Live</h1>
        <input type="text" id="user-name" class="input-sala" placeholder="Tu Nombre (Ej: Josue)">
        <input type="number" id="sala-id" class="input-sala" placeholder="ID de Sala (Ej: 100)">
        <button onclick="entrarDirecto()" style="background:#0000ff; color:white; padding:20px; width:85%; border-radius:12px; font-weight:bold; border:none; font-size:18px;">ENTRAR AHORA</button>
    </div>

    <div id="app" style="display:none;">
        <div class="header-sala">
            <div style="font-size: 22px; color: #ffd700;">ID SALA: <span id="id-txt">---</span></div>
            <div style="margin: 10px 0;">💰 Oro: <span id="oro-txt">0</span> | 🛡️ Clan: <span style="color:#ff4444;">Lluvia</span></div>
            <div style="display:flex; justify-content:space-around; font-size:12px; border-top:1px solid #333; padding-top:10px;">
                <span style="color:#ffd700;">💎 Aristocracia</span>
                <span style="color:#ff00ff;">✨ SVIP</span>
                <span style="color:#00ffff;">🔥 VIP</span>
            </div>
        </div>

        <div style="margin-top: 50px;">
            <button id="btn-bocina" class="btn-melvin" onclick="toggleBocina()">🔊 ACTIVAR BOCINA</button>
            <button id="btn-micro" class="btn-melvin" onclick="toggleMicro()">🎙️ ENCENDER MICRO</button>
        </div>

        <div id="zego-hidden" style="display:none;"></div>
        <button class="btn-wallet" onclick="abrirTienda()">💳 BILLETERA</button>
    </div>

    <div id="tienda" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:5000; padding-top:50px;">
        <div style="background:#222; border:2px solid #ffd700; border-radius:20px; width:85%; margin:auto; padding:20px;">
            <h3 style="color:#ffd700;">Comprar Oros</h3>
            <button onclick="comprar('0.99', 100)" style="width:100%; padding:15px; margin-bottom:10px; background:#444; color:white; border:none; border-radius:10px;">100 Oros - $0.99</button>
            <div id="paypal-button-container"></div>
            <button onclick="cerrarTienda()" style="color:red; background:none; border:none; margin-top:20px;">CERRAR</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4",
            authDomain: "lluvia-live-69a05.firebaseapp.com",
            projectId: "lluvia-live-69a05",
            storageBucket: "lluvia-live-69a05.firebasestorage.app",
            messagingSenderId: "909704512499",
            appId: "1:909704512499:web:a8f0d658fb6dbd3f610886"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let zp = null, micOn = false, boxOn = false;

        async function entrarDirecto() {
            const nombre = document.getElementById('user-name').value || "Usuario";
            const sala = document.getElementById('sala-id').value || "100";
            
            document.getElementById('id-txt').innerText = sala;
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('app').style.display = 'block';

            // Iniciar Zego de una vez
            const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(1111976694, "25049a1d82f7cc4b219154a4f89d53f5", sala, "U"+Date.now(), nombre);
            zp = ZegoUIKitPrebuilt.create(kitToken);
            
            await zp.joinRoom({
                container: document.querySelector("#zego-hidden"),
                scenario: { mode: ZegoUIKitPrebuilt.GroupCall },
                showPreJoinView: false,
                turnOnMicrophoneWhenJoining: false 
            });

            db.collection("usuarios").doc("Melvin_User").onSnapshot(doc => {
                document.getElementById('oro-txt').innerText = doc.exists ? (doc.data().oro || 0) : 0;
            });
        }

        function toggleBocina() {
            boxOn = !boxOn;
            document.getElementById('btn-bocina').className = boxOn ? "btn-melvin active" : "btn-melvin";
            document.getElementById('btn-bocina').innerText = boxOn ? "🔊 BOCINA: ON" : "🔊 ACTIVAR BOCINA";
            // Desbloquea el audio en iPhone
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function toggleMicro() {
            micOn = !micOn;
            zp.turnMicrophoneOn(micOn);
            document.getElementById('btn-micro').className = micOn ? "btn-melvin active" : "btn-melvin";
            document.getElementById('btn-micro').innerText = micOn ? "🎙️ MICRO: ON" : "🎙️ ENCENDER MICRO";
        }

        function abrirTienda() { document.getElementById('tienda').style.display = 'block'; }
        function cerrarTienda() { document.getElementById('tienda').style.display = 'none'; }

        function comprar(monto, cantidad) {
            document.getElementById('paypal-button-container').innerHTML = "";
            paypal.Buttons({
                createOrder: (data, actions) => actions.order.create({ purchase_units: [{ amount: { value: monto } }] }),
                onApprove: (data, actions) => actions.order.capture().then(() => {
                    db.collection("usuarios").doc("Melvin_User").update({ oro: firebase.firestore.FieldValue.increment(cantidad) });
                    alert("¡Compra exitosa!");
                    cerrarTienda();
                })
            }).render('#paypal-button-container');
        }
    </script>
</body>
</html>
