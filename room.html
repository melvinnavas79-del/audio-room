<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lluvia Live PRO</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
body { margin:0; background:#0f001e; color:white; font-family:sans-serif; text-align:center; }

.sala-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; padding:20px; }
.silla-box { width:60px; height:60px; border-radius:50%; background:#1a1a1a; border:2px solid #444; display:flex; align-items:center; justify-content:center; margin:auto; }
.silla-on { border-color:#00ff00; box-shadow:0 0 15px #00ff00; }

.btn-circle { width:70px; height:70px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:30px; }
.btn-on { background:#00ff00; }
.btn-off { background:#ff3333; }

.bottom-nav { position:fixed; bottom:30px; width:100%; display:flex; justify-content:center; gap:20px; }
</style>
</head>

<body>

<div id="login">
<h2>Entrar</h2>
<input id="name" placeholder="Nombre"><br><br>
<input id="room" placeholder="Sala"><br><br>
<button onclick="entrar('A')">Crear</button>
<button onclick="entrar('B')">Entrar</button>
</div>

<div id="app" style="display:none;">
<h3>Sala: <span id="roomTxt"></span> | 💰 <span id="oro">1000</span></h3>

<div>
<div onclick="toggleMicro()">
<div id="mic-btn" class="btn-circle btn-off">🎤</div>
<p>Micro</p>
</div>
</div>

<div id="grid" class="sala-grid"></div>

<div class="bottom-nav">
<button onclick="alert('Wallet')">💳</button>
<button onclick="alert('Regalos')">🎁</button>
<button onclick="alert('VIP')">👑</button>
</div>

</div>

<audio id="remote-audio" autoplay></audio>

<script>

// 🔥 CONFIG
firebase.initializeApp({ apiKey:"test", projectId:"test" });

let peer, localStream, role, room, nombre;
let miSilla = null;

// 🔥 CREAR SILLAS
const grid = document.getElementById("grid");
for(let i=1;i<=9;i++){
grid.innerHTML += `
<div onclick="tomarSilla(${i})">
<div class="silla-box" id="silla-${i}">👤</div>
<p>Silla ${i}</p>
</div>`;
}

// 🔥 ENTRAR
function entrar(tipo){
nombre = document.getElementById("name").value;
room = document.getElementById("room").value;
role = tipo;

document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
document.getElementById("roomTxt").innerText = room;

peer = new Peer('lluvia-'+room+'-'+role);

peer.on('call', call=>{
call.answer(localStream);
call.on('stream', s=>{
document.getElementById("remote-audio").srcObject = s;
});
});
}

// 🪑 TOMAR SILLA
function tomarSilla(num){
miSilla = num;

document.querySelectorAll(".silla-box").forEach(s=>{
s.classList.remove("silla-on");
});

document.getElementById("silla-"+num).classList.add("silla-on");

alert("Silla "+num);
}

// 🎤 MICRO
async function toggleMicro(){

if(miSilla===null){
alert("Primero elige silla");
return;
}

if(!localStream){
try{
localStream = await navigator.mediaDevices.getUserMedia({audio:true});
const destino = (role==='A')?'B':'A';
peer.call('lluvia-'+room+'-'+destino, localStream);
}catch(e){
alert("Permite mic");
return;
}
}

const estado = !localStream.getAudioTracks()[0].enabled;
localStream.getAudioTracks()[0].enabled = estado;

document.getElementById("mic-btn").className =
estado ? "btn-circle btn-on" : "btn-circle btn-off";

if(miSilla){
document.getElementById("silla-"+miSilla).className =
estado ? "silla-box silla-on" : "silla-box";
}

}

</script>

</body>
</html>
