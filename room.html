<script>
// --- CONFIG CORE ---
let nombre = localStorage.getItem("username") || "User_" + Math.floor(Math.random()*999);
let uid_safe = localStorage.getItem("uid") || nombre;
let foto_safe = localStorage.getItem("userfoto") || null;

const db = firebase.firestore();

let oro=5000, xp=0, lvl=1, aristo=7, campeon=false, nivelKing=0;

window.onload = () => { 
    crearSillas(); 
    cargarUsuario();

// --- CARGA Y NIVEL KING ---
async function cargarUsuario(){
    let d = await db.collection("usuarios").doc(nombre).get();
    if(d.exists){
        let data = d.data();
        oro = data.oro || 0;
        xp = data.xp || 0;
        campeon = data.campeon || false;
        foto_safe = data.foto || null;
        nivelKing = data.nivelKing || 0;
    }
    lvl = Math.floor(Math.sqrt(xp/100)) + 1;
    document.getElementById("tagKing").innerText = nivelKing > 0 ? `King ${nivelKing}` : "";
    updateUI();
    escucharSalas();
}

async function verificarNivelKing() {
    let nuevoNivelKing = Math.floor(xp / 500000000);
    if (nuevoNivelKing > nivelKing) {
        let premio = 3000000000; // 3 Billones
        oro += premio;
        nivelKing = nuevoNivelKing;
        await db.collection("usuarios").doc(nombre).set({
            oro: firebase.firestore.FieldValue.increment(premio),
            nivelKing: nuevoNivelKing
        }, { merge: true });
        alert(`👑 ¡KING ${nuevoNivelKing}! +3 Billones Pagados`);
        updateUI();
    }
}

// --- REGALOS Y CP ---
async function enviarRegalo(tipo){
    let precio = tipo === "leon" ? 1000 : 100;
    if(oro < precio) return alert("Sin oro");
    oro -= precio; xp += precio;
    updateUI();
    verificarNivelKing();
    
    await db.collection("eventos").doc("global").set({ [nombre]: firebase.firestore.FieldValue.increment(precio) }, {merge:true});
    subirCP(precio / 10); 

    let anim = document.createElement("div");
    anim.className = "gift-anim";
    anim.innerText = tipo === "leon" ? "🦁" : "🌹";
    document.getElementById("gift").appendChild(anim);
    setTimeout(() => anim.remove(), 2500);
}

async function subirCP(pts){
    let ref = db.collection("cp").doc(nombre);
    let d = await ref.get();
    if(d.exists){
        let data = d.data();
        let nuevoTotal = (data.puntos || 0) + pts;
        let nuevoNivel = Math.floor(nuevoTotal / 1000) + 1;
        if(nuevoNivel >= 6 && (data.nivel || 1) < 6){
            oro += 5000000;
            alert("💞 CP Nivel 6! +5M Recompensa");
            updateUI();
        }
        await ref.set({puntos: nuevoTotal, nivel: nuevoNivel}, {merge:true});
    }
}

// --- CHAT Y NOTIFICACIONES ---
function crearChatUI(){
    let div = document.createElement("div");
    div.style.cssText = "position:fixed;right:10px;bottom:140px;z-index:90;";

        <div style="display:flex;gap:2px;"><input id="chatInput" style="width:130px;background:#222;color:white;border:1px solid #444;border-radius:5px;padding:3px;">
        <button onclick="enviarMensaje(document.getElementById('chatInput').value)" style="padding:3px 8px;background:#00ffff;color:black;font-size:10px;">Send</button></div>`;
    document.body.appendChild(div);
}

// Escuchar notificaciones del servidor (Entrada/Salida)
socket.on("notificacion-sala", (data) => {
    const chatBox = document.getElementById("chatBox");
    if(chatBox) {
        let aviso = document.createElement("div");
        aviso.style.cssText = `color: ${data.color}; font-weight: bold; font-size: 10px; margin: 5px 0; text-align: center;`;
        aviso.innerText = data.msg;
        chatBox.appendChild(aviso);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
});

// --- CORE UI ---
function updateUI(){
    document.getElementById("oro").innerText = oro.toLocaleString();
    db.collection("usuarios").doc(nombre).set({oro, xp, nombre, foto: foto_safe, nivelKing}, {merge:true});
}

function agregarBotonesExtra(){
    const bar = document.getElementById("bottomBar");
    const btns = [{t: "🏷️ CLAN", f: rankingClanes}, {t: "💞 CP", f: crearCP}, {t: "🎡", f: ruleta}, {t: "🎰", f: slots}];
    btns.forEach(b => {
        let btn = document.createElement("button");
        btn.innerText = b.t; btn.onclick = b.f; bar.appendChild(btn);
    });
}

async function bonusDomingo(){
    let hoy = new Date();
    if(hoy.getDay() !== 0) return;
    let controlRef = db.collection("sistema").doc("bonus_domingo");
    let snap = await controlRef.get();
    if(snap.exists && snap.data().fecha === hoy.toDateString()) return;
    await controlRef.set({fecha: hoy.toDateString()});
    // Lógica de pago bonus...
    alert("🔥 BONUS DOMINGO PAGADO");
}

setInterval(() => { bonusDomingo(); }, 30000);
</script>

<div style="position:fixed;bottom:90px;right:10px;z-index:200;">
    <button onclick="iniciarAudio()" style="background:green;">🎤</button>
    <button onclick="toggleAudio()" style="background:blue;">🔊</button>
</div>

<script>
let localStream, peer, audioActivo = true, audiosRemotos = [];
async function iniciarAudio(){
    try{
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        alert("🎤 Mic activado");
        conectarAudio();
    }catch(e){ alert("Error mic"); }
}
function toggleAudio(){
    audioActivo = !audioActivo;
    audiosRemotos.forEach(a => a.muted = !audioActivo);
    alert(audioActivo ? "🔊 ON" : "🔇 OFF");
}
function conectarAudio(){
    peer = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
    localStream.getTracks().forEach(track => peer.addTrack(track, localStream));
    peer.ontrack = (e) => {
        let audio = document.createElement("audio");
        audio.srcObject = e.streams[0]; audio.autoplay = true; audio.muted = !audioActivo;
        audiosRemotos.push(audio);
    };
    crearOferta();
}
async function crearOferta(){
    let offer = await peer.createOffer();
    await peer.setLocalDescription(offer);
    await db.collection("audio").doc("room").set({ offer: JSON.stringify(offer) });
    db.collection("audio").doc("room").onSnapshot(async doc => {
        let d = doc.data();
        if(d?.answer && !peer.currentRemoteDescription) await peer.setRemoteDescription(JSON.parse(d.answer));
    });
}
</script>
