<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lluvia Live PRO - Audio Fix</title>
<style>
:root { --gold:#ffd700; --blue:#0084ff; --red:#ff004c; }
body { margin:0; background:#0b0015; color:white; font-family: sans-serif; height:100vh; overflow:hidden; position: fixed; width: 100%; }

/* ACCESO PARA ACTIVAR AUDIO GRATIS */
#pantalla-acceso {
    position: fixed; top:0; left:0; width:100%; height:100%; 
    background:#0b0015; z-index: 5000; display: flex; flex-direction: column; 
    align-items: center; justify-content: center;
}
.btn-entrar { 
    background: var(--gold); color: black; padding: 18px 50px; 
    border-radius: 40px; font-weight: bold; font-size: 20px; border: none;
}

/* INTERFAZ */
#app-principal { display: none; }
.pk-bar { display:flex; height:45px; border-bottom: 2px solid var(--gold); }
.pk-team { width: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }

.sala { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; padding:20px; }
.silla { background: rgba(255,255,255,0.1); width:65px; height:65px; border-radius:50%; margin:0 auto; display:flex; align-items:center; justify-content:center; border: 1px solid #444; position: relative; font-size: 24px; }
.silla-on { border-color: #00ff00; box-shadow: 0 0 15px #00ff00; color: #00ff00; }

/* CONTROLES FLOTANTES */
.controles-footer {
    position: absolute; bottom: 120px; width: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 15px;
}
.row-audio { display: flex; gap: 15px; width: 90%; justify-content: center; }
.btn-audio { 
    flex: 1; background: #111; border: 2px solid var(--gold); 
    padding: 12px; border-radius: 25px; color: var(--gold); 
    font-weight: bold; text-align: center; font-size: 14px;
}
.activo { background: var(--red); color: white; border-color: white; }

.botones-lujo { display: flex; gap: 20px; align-items: center; margin-top: 10px; }
.circulo { width: 65px; height: 65px; border-radius: 50%; border: 2px solid var(--gold); background: #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 30px; }

/* REGALOS */
#capa-animada { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index: 1000; display:flex; align-items:center; justify-content:center; }
.panel { position: fixed; bottom: -100%; left: 0; width: 100%; height: 50%; background: #150028; border-top: 3px solid var(--gold); border-radius: 25px 25px 0 0; transition: 0.4s; z-index: 3000; padding: 20px; box-sizing: border-box; }
.panel.open { bottom: 0; }
</style>
</head>
<body>

<div id="pantalla-acceso">
    <h1 style="color:var(--gold)">LLUVIA LIVE</h1>
    <p>Toca para activar Audio y Micro</p>
    <button class="btn-entrar" onclick="iniciarTodo()">ENTRAR A SALA</button>
</div>

<div id="app-principal">
    <div class="pk-bar">
        <div class="pk-team" style="background:var(--blue)">CLAN NAVAS</div>
        <div class="pk-team" style="background:var(--red)">CLAN RIVAL</div>
    </div>

    <div id="capa-animada"></div>

    <div class="sala">
        <div class="silla" id="s1">👤</div>
        <div class="silla">👤</div>
        <div class="silla">👤</div>
        <div class="silla">👤</div>
        <div class="silla">👤</div>
        <div class="silla">👤</div>
    </div>

    <div class="controles-footer">
        <div class="row-audio">
            <div class="btn-audio" id="btn-mic" onclick="toggleMicro()">🎤 MICRO: OFF</div>
            <div class="btn-audio" id="btn-bocina" onclick="toggleBocina()">🔊 BOCINA: ON</div>
        </div>

        <div class="botones-lujo">
            <div class="circulo" style="border-color:#00ff00" onclick="ver('p-banco')">🏦</div>
            <div class="circulo" style="background:red; width:80px; height:80px;" onclick="ver('p-regalo')">🎁</div>
            <div class="circulo" style="background:#1a237e" onclick="alert('VIP')">👑</div>
        </div>
    </div>
</div>

<div id="p-banco" class="panel">
    <div style="display:flex; justify-content:space-between;"><b>BANCO</b> <span onclick="ver('p-banco')">✕</span></div>
    <div onclick="recarga()" style="background:#222; padding:15px; border-radius:10px; margin-top:15px;">📦 RECARGAR 5,000 ORO</div>
</div>

<div id="p-regalo" class="panel">
    <div style="display:flex; justify-content:space-between;"><b>REGALOS</b> <span onclick="ver('p-regalo')">✕</span></div>
    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-top:15px;">
        <div style="background:#222; padding:15px; border-radius:10px; text-align:center;" onclick="animar('🌹')">🌹</div>
        <div style="background:#222; padding:15px; border-radius:10px; text-align:center;" onclick="animar('💎')">💎</div>
        <div style="background:#222; padding:15px; border-radius:10px; text-align:center;" onclick="animar('🦁')">🦁</div>
    </div>
</div>

<script>
let audioActivado = false;
let microStatus = false;
let bocinaStatus = true;

function iniciarTodo() {
    // EL "ACUERDO" GRATIS: Activamos el motor de audio al entrar
    window.audioContext = new (window.AudioContext || window.webkitAudioContext)();
    document.getElementById('pantalla-acceso').style.display = 'none';
    document.getElementById('app-principal').style.display = 'block';
    console.log("Audio activado por el usuario");
}

function toggleMicro() {
    microStatus = !microStatus;
    const btn = document.getElementById('btn-mic');
    const s1 = document.getElementById('s1');
    if(microStatus) {
        btn.innerText = "🔴 MICRO: ON";
        btn.classList.add('activo');
        s1.classList.add('silla-on');
        s1.innerHTML = "🎤";
        navigator.mediaDevices.getUserMedia({audio:true}).catch(()=>alert("Revisa permisos de Micro"));
    } else {
        btn.innerText = "🎤 MICRO: OFF";
        btn.classList.remove('activo');
        s1.classList.remove('silla-on');
        s1.innerHTML = "👤";
    }
}

function toggleBocina() {
    bocinaStatus = !bocinaStatus;
    const btn = document.getElementById('btn-bocina');
    if(bocinaStatus) {
        btn.innerText = "🔊 BOCINA: ON";
        btn.style.background = "#111";
        btn.style.color = "var(--gold)";
    } else {
        btn.innerText = "🔇 BOCINA: MUTE";
        btn.style.background = "#444";
        btn.style.color = "white";
    }
}

function ver(id) { document.getElementById(id).classList.toggle('open'); }

function recarga() { alert("Oro sumado"); ver('p-banco'); }

function animar(emoji) {
    const capa = document.getElementById('capa-animada');
    const div = document.createElement('div');
    div.innerHTML = `<span style="font-size:100px">${emoji}</span>`;
    capa.appendChild(div);
    ver('p-regalo');
    setTimeout(() => div.remove(), 2000);
}
</script>
</body>
</html>
