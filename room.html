<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AudioRoom PRO - Oficial</title>
    
    <script src="https://resource.zegocloud.com/prebuilt/zegocloud-prebuilt.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body {
            margin: 0;
            background: linear-gradient(180deg, #4b0082, #8a2be2);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .header { margin-top: 30px; text-align: center; }
        .stats {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 20px;
            width: 80%;
            margin-top: 20px;
        }
        .stat-item {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            margin: 10px 0;
            font-weight: bold;
        }
        .noble-badge {
            background: #442255;
            padding: 10px 50px;
            border-radius: 25px;
            border: 1px solid #9966ff;
            margin-top: 20px;
            font-weight: bold;
        }
        .controls {
            position: fixed;
            bottom: 40px;
            display: flex;
            gap: 25px;
            width: 100%;
            justify-content: center;
        }
        .btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
        }
        .btn-mic { background-color: #555; color: white; border: 2px solid white; }
        .btn-mic.on { background-color: #00ff00; color: black; }
        .btn-music { background-color: #00b894; color: white; }
        .btn-gift { background-color: #fdcb6e; color: white; }
        
        #status-msg { margin-top: 15px; font-weight: bold; color: #ffff00; font-size: 1.1rem; }

        /* Pantalla de Acceso para activar Audio en iOS */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a0033; z-index: 9999; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .input-pro {
            padding: 15px; border-radius: 12px; border: 1px solid #9966ff;
            background: #331a4d; color: white; width: 75%; margin-bottom: 15px; text-align: center; font-size: 18px;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 style="color: #00ff00; margin-bottom: 30px;">🎤 AudioRoom PRO</h1>
        <input type="text" id="user-name" class="input-pro" placeholder="Tu Nombre">
        <input type="number" id="room-id" class="input-pro" placeholder="ID de Sala (Ej: 2026)">
        <button onclick="iniciarAppPRO()" style="background:#8a2be2; color:white; padding:20px 60px; border-radius:15px; font-weight:bold; border:none; font-size:20px; box-shadow: 0 0 20px #8a2be2;">ENTRAR</button>
    </div>

    <div id="app-pro" style="display:none; width: 100%; text-align: center;">
        <div class="header">
            <h1>🎤 AudioRoom PRO</h1>
        </div>

        <div class="stats">
            <div class="stat-item">💰 Oro: <span id="oro-count">0</span></div>
            <div style="display: flex; justify-content: space-around; font-size: 1rem; color: #ccc;">
                <span>👑 VIP: 0</span>
                <span>💎 SVIP: 0</span>
            </div>
        </div>

        <div class="noble-badge">🏆 Noble</div>

        <div id="status-msg">Conectando...</div>

        <div id="audio-engine-container" style="display:none;"></div>

        <div class="controls">
            <button class="btn btn-mic" id="mic-btn" onclick="toggleMic()">🎤</button>
            <button class="btn btn-music" onclick="alert('Billetera próximamente')">🎶</button>
            <button class="btn btn-gift" onclick="alert('Regalos próximamente')">🎁</button>
        </div>
    </div>

    <script>
        // Configuración Firebase (Para tus monedas reales)
        const firebaseConfig = {
            apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4",
            authDomain: "lluvia-live-69a05.firebaseapp.com",
            projectId: "lluvia-live-69a05",
            storageBucket: "lluvia-live-69a05.firebasestorage.app",
            messagingSenderId: "909704512499",
            appId: "1:909704512499:web:a8f0d658fb6dbd3f610886"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let zegoInstance = null;
        let micActive = false;

        async function iniciarAppPRO() {
            const nombre = document.getElementById('user-name').value || "Melvin";
            const sala = document.getElementById('room-id').value || "2026";
            
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-pro').style.display = 'block';

            // Conexión Real de Audio (ZegoCloud)
            const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(1111976694, "25049a1d82f7cc4b219154a4f89d53f5", sala, "U"+Date.now(), nombre);
            zegoInstance = ZegoUIKitPrebuilt.create(kitToken);
            
            await zegoInstance.joinRoom({
                container: document.querySelector("#audio-engine-container"),
                scenario: { mode: ZegoUIKitPrebuilt.GroupCall },
                showPreJoinView: false,
                turnOnMicrophoneWhenJoining: false 
            });

            document.getElementById('status-msg').innerText = "✅ CONECTADO EN VIVO";

            // Sincronizar Monedas Reales desde Firebase
            db.collection("usuarios").doc("Melvin_User").onSnapshot(doc => {
                if(doc.exists) document.getElementById('oro-count').innerText = doc.data().oro || 0;
            });
        }

        function toggleMic() {
            micActive = !micActive;
            zegoInstance.turnMicrophoneOn(micActive);
            const btn = document.getElementById('mic-btn');
            btn.className = micActive ? "btn btn-mic on" : "btn btn-mic";
            document.getElementById('status-msg').innerText = micActive ? "🎤 TRANSMITIENDO EN VIVO" : "✅ CONECTADO EN VIVO";
        }
    </script>
</body>
</html>
