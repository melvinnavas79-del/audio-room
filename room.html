<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lluvia Live - Audio Test</title>
    <script src="https://resource.zegocloud.com/prebuilt/ZegoExpressWebRTC.js"></script>
    <style>
        body { margin:0; background:#0b001a; color:white; font-family:sans-serif; overflow:hidden; display:flex; flex-direction:column; height:100vh; }
        
        /* Pantalla de Inicio / Crear - Entrar */
        #login { position:fixed; inset:0; background:linear-gradient(#1a0033, #0b001a); z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
        .input-box { padding:15px; width:85%; border-radius:15px; border:1px solid #444; background:#1a1a1a; color:white; margin-bottom:15px; font-size:16px; text-align:center; }
        .btn-main { width:85%; padding:18px; border-radius:30px; border:none; font-weight:bold; cursor:pointer; margin-bottom:10px; font-size:16px; }
        
        /* Banner SVIP */
        #premium-banner { width:92%; margin:15px auto; background:rgba(30,0,60,0.8); border-radius:25px; border:2px solid #ffd700; display:flex; justify-content:space-around; align-items:center; padding:12px 5px; box-shadow: 0 0 20px rgba(255,215,0,0.4); }

        /* Sillas */
        #sillas-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; padding:20px; flex-grow:1; align-content:start; }
        .silla-wrapper { text-align:center; }
        .silla { width:70px; height:70px; border-radius:50%; background:#1e1e2e; border:2px solid #444; margin:0 auto; display:flex; align-items:center; justify-content:center; font-size:28px; }
        .silla.ocupada { border-color:#00ff00; box-shadow: 0 0 15px #00ff00; background:#0a2a0a; }
        .user-label { font-size:10px; margin-top:5px; color:#aaa; font-weight:bold; }

        /* Efecto Regalo */
        @keyframes volar { 0% { transform:scale(0.5) translateY(0); opacity:1; } 100% { transform:scale(2) translateY(-300px); opacity:0; } }
        .gift-effect { position:absolute; font-size:60px; left:40%; top:40%; animation: volar 2s forwards; z-index:100; pointer-events:none; }

        /* Barra de Acciones */
        .action-bar { background:rgba(0,0,0,0.95); padding:20px; display:flex; justify-content:space-around; border-top:1px solid #333; }
        .btn-round { width:55px; height:55px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer; }
    </style>
</head>
<body>

<div id="login">
    <h1 style="color:gold; font-size:35px; margin-bottom:30px;">☔ LLUVIA LIVE</h1>
    <input type="text" id="user-id" class="input-box" placeholder="Tu Apodo">
    <input type="text" id="room-id" class="input-box" placeholder="ID de la Sala (ej: 100)">
    
    <button onclick="iniciarApp('host')" class="btn-main" style="background:#00ff00; color:black;">➕ CREAR SALA</button>
    <button onclick="iniciarApp('audience')" class="btn-main" style="background:#00aaff; color:white;">🚪 ENTRAR A SALA</button>
    
    <p style="font-size:12px; color:#666; margin-top:20px;">Prueba de Audio v1.0</p>
</div>

<div id="premium-banner">
    <div>👑 <span style="color:gold;">SVIP</span></div>
    <div>💰 ORO: <span id="oro-val" style="color:gold;">3800</span></div>
    <div onclick="recargar()" style="background:#ffd700; color:black; padding:6px 12px; border-radius:12px; font-size:12px; font-weight:bold; cursor:pointer;">RECARGA</div>
</div>

<div id="sillas-grid"></div>

<div class="action-bar">
    <button class="btn-round" style="background:#8a2be2;">🎬</button>
    <button class="btn-round" style="background:#00aaff;">📸</button>
    <button id="mic-btn" class="btn-round" style="background:#ff3333;" onclick="toggleMic()">🎙️</button>
    <button class="btn-round" style="background:orange;" onclick="lanzarRegalo()">🎁</button>
    <button id="vol-btn" class="btn-round" style="background:#00ff00;" onclick="toggleVolumen()">🔊</button>
</div>

<script>
    let oro = 3800;
    let micOn = false;
    let volOn = true;
    let miNombre = "";
    let roomID = "";

    function iniciarApp(rol) {
        miNombre = document.getElementById('user-id').value || "Melvin";
        roomID = document.getElementById('room-id').value || "1";
        
        if(!document.getElementById('room-id').value) return alert("Socio, pon un ID de sala");

        document.getElementById('login').style.display = 'none';
        alert(rol === 'host' ? "Sala creada como Administrador" : "Entraste como Invitado");

        const grid = document.getElementById('sillas-grid');
        for(let i=1; i<=9; i++) {
            grid.innerHTML += `
                <div class="silla-wrapper">
                    <div class="silla" id="s-${i}" onclick="tomarSilla(${i})">👤</div>
                    <div class="user-label" id="u-${i}">Vacío</div>
                </div>`;
        }
    }

    function tomarSilla(id) {
        const s = document.getElementById(`s-${id}`);
        const u = document.getElementById(`u-${id}`);
        if(s.classList.contains('ocupada')) {
            s.classList.remove('ocupada');
            s.innerText = "👤";
            u.innerText = "Vacío";
        } else {
            s.classList.add('ocupada');
            s.innerText = "🎤";
            u.innerText = miNombre;
            u.style.color = "#00ff00";
        }
    }

    function toggleMic() {
        micOn = !micOn;
        document.getElementById('mic-btn').style.background = micOn ? "#00ff00" : "#ff3333";
        if(micOn) console.log("Iniciando transmisión de audio en sala: " + roomID);
    }

    function toggleVolumen() {
        volOn = !volOn;
        const btn = document.getElementById('vol-btn');
        btn.style.background = volOn ? "#00ff00" : "#666";
        btn.innerText = volOn ? "🔊" : "🔇";
    }

    function lanzarRegalo() {
        if(oro >= 500) {
            oro -= 500;
            document.getElementById('oro-val').innerText = oro;
            const effect = document.createElement('div');
            effect.className = 'gift-effect';
            effect.innerText = "🦁";
            document.body.appendChild(effect);
            setTimeout(() => effect.remove(), 2000);
        }
    }

    function recargar() { oro += 1000; document.getElementById('oro-val').innerText = oro; }
</script>
</body>
</html>
