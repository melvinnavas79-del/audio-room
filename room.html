<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lluvia Live - Master SVIP</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=AfHuBVaA8_T6bxvMRwYfG&currency=USD"></script>

    <style>
        body { margin: 0; background: #0f001e; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; height: 100vh; overflow: hidden; }
        
        /* Panel Superior */
        .top-panel { background: rgba(0,0,0,0.5); width: 92%; margin: 10px auto; padding: 15px; border-radius: 25px; border: 2px solid #ffd700; }
        .stats-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; }
        .rank-box { background: linear-gradient(90deg, #b8860b, #ffd700, #b8860b); color: black; font-weight: bold; padding: 8px 25px; border-radius: 20px; display: inline-block; }
        .svip-tag { background: #ff0000; color: white; font-size: 11px; padding: 2px 8px; border-radius: 5px; margin-left: 5px; font-weight: 900; box-shadow: 0 0 10px #ff0000; }
        .cp-text { font-size: 12px; color: #ff85a2; font-weight: bold; margin-top: 8px; }

        /* Controles de Audio (Botones grandes de micro y bocina) */
        .audio-controls { display: flex; justify-content: center; gap: 40px; margin: 15px 0; }
        .ctrl-btn { width: 75px; height: 75px; border-radius: 50%; border: 3px solid white; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; transition: 0.3s; }
        .btn-active { background: #00ff00; color: black; box-shadow: 0 0 15px #00ff00; }
        .btn-inactive { background: #ff3333; color: white; box-shadow: 0 0 15px #ff3333; }
        .ctrl-label { font-size: 12px; margin-top: 5px; font-weight: bold; }

        /* Sillas de la Sala */
        .grid-sala { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 10px; }
        .silla { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #555; background: #1a1a1a; margin: 0 auto; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .silla.hablando { border-color: #00ff00; box-shadow: 0 0 15px #00ff00; }

        /* Botones de Acción Inferiores */
        .footer-nav { position: fixed; bottom: 20px; width: 100%; display: flex; justify-content: center; gap: 20px; align-items: center; }
        .nav-circ { width: 60px; height: 60px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; cursor: pointer; }
        .nav-w { background: #ffd700; color: black; }
        .nav-g { width: 80px; height: 80px; background: linear-gradient(45deg, #ff0066, #ffcc00); font-size: 30px; border: none; }
        .nav-v { background: #00d2ff; color: black; }

        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #222; width: 85%; padding: 25px; border-radius: 25px; border: 2px solid #ffd700; z-index: 2000; }
    </style>
</head>
<body>

    <div class="top-panel">
        <div class="stats-row">
            <span>💰 Oro: <b id="bal-oro" style="color:#ffd700">...</b></span>
            <span style="color:#00ffcc">🛡️ Clan: Lluvia</span>
        </div>
        <div class="rank-box">
            Noble (Aristocracia) <span class="svip-tag" id="svip-view">SVIP</span>
        </div>
        <div class="cp-text" id="cp-name">💞 C.P: Buscando pareja...</div>
    </div>

    <div style="color:#ffd700; font-size: 14px; margin: 10px 0;">📍 Sala: 1234</div>
    <button onclick="unmuteAll()" style="background:#ff0066; color:white; padding:12px; border:none; border-radius:15px; width:85%; font-weight:bold;">🔊 ACTIVAR AUDIO DE SALA</button>

    <div class="audio-controls">
        <div>
            <div id="btn-mic" class="ctrl-btn btn-inactive" onclick="toggleMic()">🎙️</div>
            <div class="ctrl-label">Micro</div>
        </div>
        <div>
            <div id="btn-spk" class="ctrl-btn btn-active" onclick="toggleSpk()">🔊</div>
            <div class="ctrl-label">Bocina</div>
        </div>
    </div>

    <div class="grid-sala" id="sillas-grid">
        </div>

    <div class="footer-nav">
        <div class="nav-circ nav-w" onclick="openM('m-wallet')">💳<br>Wallet</div>
        <button class="nav-circ nav-g" onclick="openM('m-gift')">🎁</button>
        <div class="nav-circ nav-v" onclick="openM('m-vip')">👑<br>VIP</div>
    </div>

    <audio id="remote-audio" autoplay playsinline></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4",
            projectId: "lluvia-live-69a05",
            databaseURL: "https://lluvia-live-69a05-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let uName = localStorage.getItem('nombre_lluvia') || "Melvin";
        let gold = 0, micOn = false, spkOn = true;

        // Dibujar sillas
        const grid = document.getElementById('sillas-grid');
        for(let i=1; i<=9; i++) {
            grid.innerHTML += `<div><div class="silla" id="s-${i}">🎙️</div><div style="font-size:10px; color:#aaa;">Silla ${i}</div></div>`;
        }

        // Datos en tiempo real
        db.collection("usuarios").doc(uName).onSnapshot(doc => {
            if(doc.exists) {
                const d = doc.data();
                gold = d.oro;
                document.getElementById('bal-oro').innerText = gold;
                document.getElementById('svip-view').style.display = d.svip ? 'inline' : 'none';
                if(d.cp) document.getElementById('cp-name').innerText = "💞 C.P: " + d.cp;
            }
        });

        // Lógica de Audio
        function toggleMic() {
            micOn = !micOn;
            document.getElementById('btn-mic').className = micOn ? "ctrl-btn btn-active" : "ctrl-btn btn-inactive";
            document.getElementById('s-1').className = micOn ? "silla hablando" : "silla"; // Ilumina tu silla (la 1)
        }

        function toggleSpk() {
            spkOn = !spkOn;
            document.getElementById('btn-spk').className = spkOn ? "ctrl-btn btn-active" : "ctrl-btn btn-inactive";
            document.getElementById('remote-audio').muted = !spkOn;
        }

        function unmuteAll() { document.getElementById('remote-audio').play(); alert("Audio activado"); }

        function openM(id) { document.getElementById(id).style.display='block'; }
        // ... (resto de funciones de regalo y wallet iguales)
    </script>

    <div class="modal" id="m-vip">
        <h3>Tienda VIP</h3>
        <button onclick="db.collection('usuarios').doc(uName).update({svip:true})">Activar SVIP</button>
        <button onclick="this.parentElement.style.display='none'">Cerrar</button>
    </div>
</body>
</html>
