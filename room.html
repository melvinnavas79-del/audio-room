<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lluvia Live</title>
    <script src="https://resource.zegocloud.com/prebuilt/ZegoExpressWebRTC.js"></script>
    <style>
        body { margin:0; background:#0b001a; color:white; font-family:sans-serif; overflow:hidden; display:flex; flex-direction:column; height:100vh; }
        
        /* Banner Superior Aristocracia */
        #premium-banner { 
            width:92%; margin:15px auto; background:rgba(20,20,30,0.95); 
            border-radius:25px; border:2px solid #ffd700; 
            display:flex; justify-content:space-around; align-items:center; 
            padding:12px 5px; box-shadow: 0 0 20px rgba(255,215,0,0.4); 
        }
        .btn-recarga { background:#ffd700; color:black; padding:8px 18px; border-radius:20px; font-weight:bold; cursor:pointer; font-size:14px; }

        /* Cuadrícula de Sillas (3x3) */
        #sillas-grid { 
            display:grid; grid-template-columns:repeat(3,1fr); gap:25px; 
            padding:30px 20px; flex-grow:1; align-content:start;
        }
        .silla { 
            width:75px; height:75px; border-radius:50%; background:#1e1e2e; 
            border:2px solid #333; margin:0 auto; display:flex; 
            align-items:center; justify-content:center; font-size:28px; position:relative;
        }
        .silla.activa { border-color:#00ff00; box-shadow: 0 0 15px #00ff00; }

        /* Panel de Regalos Inferior */
        #gift-panel { 
            background:black; border-radius:30px 30px 0 0; padding:20px;
            display:grid; grid-template-columns:repeat(3,1fr); gap:15px; border-top:1px solid #444;
        }
        .gift { text-align:center; font-size:14px; cursor:pointer; }
        .gift-icon { font-size:24px; display:block; margin-bottom:5px; }
        .cerrar-btn { color:#ff3333; font-weight:bold; cursor:pointer; text-align:center; margin-top:10px; }

        /* Login */
        #login { position:fixed; inset:0; background:#0b001a; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .input-box { padding:15px; width:80%; border-radius:15px; border:1px solid #444; background:#1a1a1a; color:white; margin-bottom:15px; }
    </style>
</head>
<body>

<div id="login">
    <h1 style="color:gold; font-size:35px;">☔ LLUVIA LIVE</h1>
    <input type="text" id="user-id" class="input-box" placeholder="Nombre de Usuario">
    <input type="text" id="room-id" class="input-box" placeholder="ID de la Sala">
    <button onclick="iniciarApp()" style="background:#00ff00; padding:15px 50px; border-radius:30px; border:none; font-weight:bold;">ENTRAR AHORA</button>
</div>

<div id="premium-banner">
    <div style="font-weight:bold; color:gold;">👑 SVIP</div>
    <div style="font-weight:bold;">💰 ORO: <span id="oro-val">2000</span></div>
    <div class="btn-recarga" onclick="recargar()">RECARGA</div>
</div>

<div id="sillas-grid">
    </div>

<div id="gift-panel">
    <div class="gift" onclick="enviar(10, '🌹')"><span class="gift-icon">🌹</span>10</div>
    <div class="gift" onclick="enviar(100, '🍦')"><span class="gift-icon">🍦</span>100</div>
    <div class="gift" onclick="enviar(500, '🚗')"><span class="gift-icon">🚗</span>500</div>
    <div class="gift" onclick="enviar(1000, '🦁')"><span class="gift-icon">🦁</span>1000</div>
    <div class="gift" onclick="enviar(5000, '🏰')"><span class="gift-icon">🏰</span>5000</div>
    <div class="cerrar-btn" onclick="alert('Cerrando panel')">✖️<br>CERRAR</div>
</div>

<script>
    const CONFIG = {
        appID: 249373029,
        appSign: 'c0a19c13759e162000663b285d620ad478210fd7648f572d421295988e072213'
    };

    let oro = 2000;
    let micActivo = false;

    function iniciarApp() {
        const user = document.getElementById('user-id').value;
        if(!user) return alert("Pon un nombre");
        document.getElementById('login').style.display = 'none';
        
        const grid = document.getElementById('sillas-grid');
        for(let i=1; i<=9; i++) {
            grid.innerHTML += `<div class="silla" id="s-${i}" onclick="tomarSilla(${i})">👤</div>`;
        }
    }

    function tomarSilla(id) {
        const s = document.getElementById(`s-${id}`);
        micActivo = !micActivo;
        if(micActivo) {
            s.classList.add('activa');
            s.innerText = "🎤";
            alert("Socio, estás en vivo en la silla " + id);
        } else {
            s.classList.remove('activa');
            s.innerText = "👤";
        }
    }

    function enviar(costo, emoji) {
        if(oro >= costo) {
            oro -= costo;
            document.getElementById('oro-val').innerText = oro;
            alert("¡Enviaste " + emoji + "! Descontado de tu balance.");
        } else {
            alert("❌ No tienes suficiente Oro para este regalo.");
        }
    }

    function recargar() {
        oro += 1000;
        document.getElementById('oro-val').innerText = oro;
        alert("💰 +1000 Oro acreditado a tu cuenta.");
    }
</script>
</body>
</html>
