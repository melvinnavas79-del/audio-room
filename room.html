<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lluvia Live PRO</title>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
body { margin:0; background:#0b001a; color:white; font-family:sans-serif; text-align:center; }

button {
    margin:10px;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

#log { margin-top:20px; color:#00ffcc; }
</style>
</head>

<body>

<h2>🎤 LLUVIA LIVE</h2>

<input id="room" placeholder="Sala (ej: 123)">
<br><br>

<button onclick="entrar()">Entrar</button>
<button onclick="toggleMic()">Mic ON/OFF</button>
<button onclick="enviarRegalo('🎁')">🎁</button>
<button onclick="enviarRegalo('💎')">💎</button>

<div id="log">Esperando...</div>

<script>

const socket = io("http://207.180.235.220:3001");

let peer;
let stream;
let micActivo = false;
let calls = {};
let roomActual = "";

async function entrar() {

    roomActual = document.getElementById("room").value || "global";

    peer = new Peer();

    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getAudioTracks()[0].enabled = false;

    peer.on("open", id => {

        log("🟢 Conectado: " + id);

        socket.emit("join-room", {
            room: roomActual,
            peerId: id
        });
    });

    // recibir llamadas
    peer.on("call", call => {
        call.answer(stream);

        call.on("stream", remoteStream => {
            reproducir(remoteStream);
        });
    });

    // usuarios en sala
    socket.on("users-in-room", users => {
        users.forEach(userId => {
            if (userId === peer.id) return;

            const call = peer.call(userId, stream);

            call.on("stream", remoteStream => {
                reproducir(remoteStream);
            });

            calls[userId] = call;
        });
    });

    // nuevo usuario
    socket.on("new-user", userId => {
        const call = peer.call(userId, stream);

        call.on("stream", remoteStream => {
            reproducir(remoteStream);
        });

        calls[userId] = call;
    });

    // usuario sale
    socket.on("user-left", userId => {
        if (calls[userId]) {
            calls[userId].close();
            delete calls[userId];
        }
    });

    // 🎁 recibir regalo
    socket.on("receive-gift", data => {
        mostrarRegalo(data.gift);
    });
}

// 🎤 micrófono
function toggleMic() {
    if (!stream) return;

    micActivo = !micActivo;
    stream.getAudioTracks()[0].enabled = micActivo;

    log(micActivo ? "🎤 Mic ON" : "🔇 Mic OFF");
}

// 🎁 enviar regalo
function enviarRegalo(gift) {
    socket.emit("gift", {
        room: roomActual,
        gift: gift
    });
}

// 🎁 mostrar regalo
function mostrarRegalo(gift) {
    const div = document.createElement("div");
    div.innerText = gift;
    div.style.position = "fixed";
    div.style.bottom = "50px";
    div.style.left = Math.random() * 80 + "%";
    div.style.fontSize = "40px";

    document.body.appendChild(div);

    setTimeout(() => div.remove(), 3000);
}

// 🔊 audio
function reproducir(stream) {
    const audio = document.createElement("audio");
    audio.srcObject = stream;
    audio.autoplay = true;
    document.body.appendChild(audio);
}

function log(t) {
    document.getElementById("log").innerText = t;
}

</script>

</body>
</html>
