<script>
firebase.initializeApp({projectId:"lluvia-live-69a05"});
const db=firebase.firestore();

// DATOS INICIALES
let nombre = prompt("Nombre de Usuario") || "User_" + Math.floor(Math.random()*999);
let clan = "Navas"; // Clan por defecto

// VARIABLES DE ESTADO
let oro=0, xp=0, lvl=1;
let vip=0, svip=0, aristo=0; // Se cargarán de la base de datos
let verificado=true, esCP=false, modoFantasma=false;

const userRef = db.collection("usuarios").doc(nombre);

async function cargar(){
    let d = await userRef.get();
    if(d.exists){
        let data = d.data();
        oro = data.oro || 5000;
        xp = data.xp || 0;
        vip = data.vip || 0;
        svip = data.svip || 0;
        aristo = data.aristo || 0;
    } else {
        oro = 5000;
        await userRef.set({oro, xp, clan, verificado: true});
    }
    lvl = Math.floor(Math.sqrt(xp/100)) + 1;
    updateUI();
    escucharSalas();
    entradaAnimada();
}

function updateUI(){
    document.getElementById("oro").innerText = oro.toLocaleString();
    document.getElementById("lvl").innerText = lvl;
    userRef.set({oro, xp, lvl}, {merge:true});
}

// 👻 MODO FANTASMA (Punto 1 de tu lista)
function toggleFantasma(){
    modoFantasma = !modoFantasma;
    alert(modoFantasma ? "👻 Modo Fantasma: ACTIVADO" : "👁️ Modo Fantasma: DESACTIVADO");
}

// 🪑 SENTARSE EN SALA (Punto: Sala en tiempo real)
async function sentarse(id){
    if(modoFantasma) return alert("No puedes subir a la silla en Modo Fantasma 👻");
    await db.collection("salas").doc("global").set({
        ["s"+id]: {nombre, clan, vip, svip, aristo, lvl, verificado}
    }, {merge:true});
}

// 🎁 REGALOS, CP Y PREMIOS TOP (Cubre 10 puntos de tu lista)
async function enviarRegalo(tipo){
    let precio = (tipo === 'leon') ? 1000 : 100;
    if(oro < precio) return alert("Oro insuficiente");

    oro -= precio;
    xp += precio;
    updateUI();

    // 🏆 Ranking Ricos (Punto: Ranking Ricos)
    await db.collection("eventos").doc("global").set({
        [nombre]: firebase.firestore.FieldValue.increment(precio)
    }, {merge:true});

    // 🎖️ Clanes (Semanal/Mensual)
    await db.collection("evento_clanes").doc("semana").set({
        [clan]: firebase.firestore.FieldValue.increment(precio)
    }, {merge:true});

    // Animación de Regalo (Punto: Regalos + Animación)
    mostrarAnimacion(tipo === 'leon' ? '🦁' : '🌹');
}

function mostrarAnimacion(emoji){
    let g = document.getElementById("gift");
    let d = document.createElement("div");
    d.className = "gift";
    d.innerText = emoji;
    g.appendChild(d);
    setTimeout(() => d.remove(), 2000);
}

function entradaAnimada(){
    let d = document.createElement("div");
    d.style = "position:fixed; inset:0; display:flex; justify-content:center; align-items:center; font-size:100px; z-index:10000; pointer-events:none; animation: zoom 2s forwards;";
    // Lógica de dragón o águila según rango (Punto: Entradas Animadas)
    d.innerText = aristo > 0 ? "🐉" : "🦅";
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 2000);
}

// Cargar UI inicial
crearSillas();
cargar();
</script>
