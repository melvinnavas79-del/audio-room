<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lluvia Live - Versión Final Corregida</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=AfHuBVaA8_T6bxvMRwYfG&currency=USD"></script>

    <style>
        body { margin: 0; background: #0f001e; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; height: 100vh; overflow: hidden; }
        
        /* Panel Superior */
        .header-panel { background: rgba(0,0,0,0.6); width: 92%; margin: 10px auto; padding: 15px; border-radius: 25px; border: 2px solid #ffd700; }
        .stats { display: flex; justify-content: space-around; font-size: 0.9rem; margin-bottom: 8px; }
        .aristocracia { background: linear-gradient(90deg, #ffd700, #ff8c00); color: black; font-weight: bold; padding: 6px 25px; border-radius: 20px; display: inline-block; position: relative; }
        .svip-badge { background: red; color: white; padding: 2px 6px; border-radius: 5px; font-size: 10px; margin-left: 5px; vertical-align: middle; }
        .cp-line { color: #ff85a2; font-size: 12px; font-weight: bold; margin-top: 8px; }

        /* Controles de Audio */
        .audio-controls { display: flex; justify-content: center; gap: 35px; margin: 15px 0; }
        .btn-circle { width: 70px; height: 70px; border-radius: 50%; border: 3px solid white; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .btn-active { background: #00ff00; color: black; box-shadow: 0 0 15px #00ff00; }
        .btn-inactive { background: #ff3333; color: white; }

        /* Sillas */
        .grid-sillas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 10px; }
        .silla-slot { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #444; background: #1a1a1a; margin: 0 auto; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .silla-active { border-color: #00ff00; box-shadow: 0 0 15px #00ff00; }

        /* Footer */
        .footer-nav { position: fixed; bottom: 25px; width: 100%; display: flex; justify-content: center; gap: 20px; align-items: center; }
        .btn-nav { width: 60px; height: 60px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); font-size: 10px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .wallet { background: #ffd700; color: black; }
        .gift { width: 80px; height: 80px; background: linear-gradient(45deg, #ff0066, #ffcc00); border: none; font-size: 30px; }
        .vip { background: #00d2ff; color: black; }

        /* Modales */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; width: 85%; padding: 20px; border-radius: 25px; border: 2px solid #ffd700; z-index: 2000; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1500; }
        .modal-btn { width: 100%; padding: 12px; margin: 5px 0; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header-panel">
        <div class="stats">
            <span>💰 Oro: <b id="user-oro" style="color:#ffd700">...</b></span>
            <span style="color:#00ffcc">🛡️ Clan: Lluvia</span>
        </div>
        <div class="aristocracia">
            Noble (Aristocracia) <span id="svip-tag" class="svip-badge" style="display:none;">SVIP</span>
        </div>
        <div class="cp-line" id="cp-display">💞 C.P: Buscando pareja...</div>
    </div>

    <div style="color:#ffd700; margin: 10px 0;">📍 Sala: 1234</div>
    <button onclick="activarAudio()" style="background:#ff0066; color:white; padding:12px; border:none; border-radius:15px; width:85%; font-weight:bold;">🔊 ACTIVAR AUDIO DE SALA</button>

    <div class="audio-controls">
        <div><div id="m-btn" class="btn-circle btn-inactive" onclick="toggleMicro()">🎙️</div><p style="font-size:12px;">Micro</p></div>
        <div><div id="b-btn" class="btn-circle btn-active" onclick="toggleBocina()">🔊</div><p style="font-size:12px;">Bocina</p></div>
    </div>

    <div class="grid-sillas" id="grid">
        </div>

    <div class="footer-nav">
        <div class="btn-nav wallet" onclick="abrirModal('modal-wallet')">💳<br>Wallet</div>
        <button class="btn-nav gift" onclick="abrirModal('modal-gift')">🎁</button>
        <div class="btn-nav vip" onclick="abrirModal('modal-vip')">👑<br>VIP</div>
    </div>

    <div class="overlay" id="overlay" onclick="cerrarModales()"></div>

    <div class="modal" id="modal-wallet">
        <h3>Mi Billetera</h3>
        <button class="modal-btn" style="background:#28a745; color:white;" onclick="comprarOro(1100)">Recargar 1100 Oro ($9.99)</button>
        <button class="modal-btn" style="background:#444; color:white;" onclick="cerrarModales()">Cerrar</button>
    </div>

    <div class="modal" id="modal-gift">
        <h3>Enviar Regalos</h3>
        <button class="modal-btn" style="background:white; color:black;" onclick="enviarRegalo(10)">🌹 Rosa (10)</button>
        <button class="modal-btn" style="background:white; color:black;" onclick="enviarRegalo(500)">🚗 Carro (500)</button>
        <button class="modal-btn" style="background:#444; color:white;" onclick="cerrarModales()">Cerrar</button>
    </div>

    <div class="modal" id="modal-vip">
        <h3>Tienda de Estatus</h3>
        <button class="modal-btn" style="background:#ffc107; color:black;" onclick="activarSVIP()">Obtener SVIP (2000)</button>
        <button class="modal-btn" style="background:#00d2ff; color:black;" onclick="vincularPareja()">Vincular C.P. (Pareja)</button>
        <button class="modal-btn" style="background:#444; color:white;" onclick="cerrarModales()">Cerrar</button>
    </div>

    <audio id="remote-audio" autoplay playsinline></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4",
            projectId: "lluvia-live-69a05",
            authDomain: "lluvia-live-69a05.firebaseapp.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let nombre = localStorage.getItem('nombre_lluvia') || "Usuario";
        let miOro = 0;
        let microEncendido = false;
        let bocinaEncendida = true;
        let myStream;

        // Generar sillas
        const grid = document.getElementById('grid');
        for(let i=1; i<=9; i++) {
            grid.innerHTML += `<div><div class="silla-slot" id="silla-${i}">🎙️</div><div style="font-size:10px;">Silla ${i}</div></div>`;
        }

        // Sincronizar datos (Oro, SVIP, CP)
        db.collection("usuarios").doc(nombre).onSnapshot(doc => {
            if(doc.exists) {
                const data = doc.data();
                miOro = data.oro || 0;
                document.getElementById('user-oro').innerText = miOro;
                document.getElementById('svip-tag').style.display = data.svip ? 'inline-block' : 'none';
                if(data.cp) document.getElementById('cp-display').innerText = "💞 C.P: " + data.cp;
            } else {
                db.collection("usuarios").doc(nombre).set({ oro: 1000, svip: false, cp: "" });
            }
        });

        // FUNCIONES DE AUDIO PEERJS
        const peer = new Peer('lluvia-1234-' + nombre);
        function activarAudio() { document.getElementById('remote-audio').play(); alert("Audio Activo"); }

        async function toggleMicro() {
            if(!myStream) {
                myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                peer.on('call', call => { call.answer(myStream); call.on('stream', s => document.getElementById('remote-audio').srcObject = s); });
            }
            microEncendido = !microEncendido;
            myStream.getAudioTracks()[0].enabled = microEncendido;
            document.getElementById('m-btn').className = microEncendido ? "btn-circle btn-active" : "btn-circle btn-inactive";
            document.getElementById('silla-1').className = microEncendido ? "silla-slot silla-active" : "silla-slot";
        }

        function toggleBocina() {
            bocinaEncendida = !bocinaEncendida;
            document.getElementById('remote-audio').muted = !bocinaEncendida;
            document.getElementById('b-btn').className = bocinaEncendida ? "btn-circle btn-active" : "btn-circle btn-inactive";
        }

        // FUNCIONES DE REGALOS Y MODALES
        function abrirModal(id) { document.getElementById('overlay').style.display = 'block'; document.getElementById(id).style.display = 'block'; }
        function cerrarModales() { document.getElementById('overlay').style.display = 'none'; document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }

        function enviarRegalo(costo) {
            if(miOro >= costo) {
                db.collection("usuarios").doc(nombre).update({ oro: firebase.firestore.FieldValue.increment(-costo) });
                alert("¡Regalo enviado!");
                cerrarModales();
            } else { alert("Oro insuficiente"); }
        }

        function comprarOro(cant) {
            db.collection("usuarios").doc(nombre).update({ oro: firebase.firestore.FieldValue.increment(cant) });
            alert("Recarga exitosa");
            cerrarModales();
        }

        function activarSVIP() {
            if(miOro >= 2000) {
                db.collection("usuarios").doc(nombre).update({ oro: firebase.firestore.FieldValue.increment(-2000), svip: true });
                alert("¡Eres SVIP!");
                cerrarModales();
            } else { alert("Necesitas 2000 oros"); }
        }

        function vincularPareja() {
            let p = prompt("Nombre de tu pareja:");
            if(p) { db.collection("usuarios").doc(nombre).update({ cp: p }); cerrarModales(); }
        }
    </script>
</body>
</html>
