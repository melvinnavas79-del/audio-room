<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lluvia Live - Full Fix</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --gold: #ffd700; --super: #ff00ff; --mod: #00ffcc; --robot: #00f2ff; --owner: #ff0000; }
        body { margin: 0; background: #0b0015; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; height: 100vh; overflow: hidden; }
        
        .header-card { background: rgba(20, 0, 40, 0.95); width: 92%; margin: 10px auto; padding: 15px; border-radius: 20px; border: 2px solid var(--gold); position: relative; }
        .avatar-main { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto; border: 3px solid var(--gold); overflow: hidden; }
        .tag-rango { font-size: 10px; padding: 3px 10px; border-radius: 5px; font-weight: bold; text-transform: uppercase; margin-top: 8px; display: inline-block; }
        .rango-owner { background: var(--owner); color: white; }

        .grid-sala { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; }
        .silla { background: rgba(255,255,255,0.1); width: 65px; height: 65px; border-radius: 50%; border: 2px solid #444; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 24px; }

        .footer-nav { position: fixed; bottom: 25px; width: 100%; display: flex; justify-content: center; gap: 15px; z-index: 9000; }
        .btn-circle { width: 65px; height: 65px; border-radius: 50%; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 22px; }

        /* ESTO ES LO QUE HACÍA FALTA: EL DISEÑO DE LOS MODALES */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111; border: 2px solid var(--gold); border-radius: 25px; padding: 25px; width: 85%; z-index: 10000; color: white; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        .btn-panel { background: white; color: black; width: 100%; padding: 12px; border-radius: 10px; font-weight: bold; margin: 5px 0; border: none; font-size: 14px; }
        #btn-admin-gears { position: absolute; top: 10px; right: 10px; background: #333; border: 1px solid var(--gold); border-radius: 50%; width: 40px; height: 40px; color: gold; display: none; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

    <div id="main-app">
        <div class="header-card">
            <button id="btn-admin-gears" onclick="showM('m-admin-panel')">⚙️</button>
            <div class="avatar-main"><img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" style="width:100%;"></div>
            <div style="margin-top:10px;"><b id="nick" style="font-size: 18px;">Melvin</b></div>
            <div id="my-tag" class="tag-rango">USUARIO</div><br>
            <div style="font-size:14px; color:var(--gold); margin-top:8px;">💰 Oro: <span id="oro-txt">0</span></div>
        </div>

        <div class="grid-sala" id="sillas-box"></div>

        <div class="footer-nav">
            <button class="btn-circle" style="background:#222; border:2px solid #00ff00;" onclick="showM('m-agentes')">🏦</button>
            <button class="btn-circle" style="background:red; width:85px; height:85px; font-size:40px; border:3px solid gold;" onclick="showM('m-regalos')">🎁</button>
            <button class="btn-circle" style="background:#1a237e; border:2px solid gold;" onclick="showM('m-tienda')">👑</button>
        </div>
    </div>

    <div id="m-regalos" class="modal">
        <h3 style="color:red">🎁 Enviar Regalos</h3>
        <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-bottom:15px;">
            <button onclick="alert('Enviando Rosa...')" style="background:#222; color:white; border:1px solid #444; border-radius:10px; padding:5px;">🌹<br><small>10</small></button>
            <button onclick="alert('Enviando Anillo...')" style="background:#222; color:white; border:1px solid #444; border-radius:10px; padding:5px;">💍<br><small>1k</small></button>
            <button onclick="alert('Enviando Castillo...')" style="background:#222; color:white; border:1px solid gold; border-radius:10px; padding:5px;">🏰<br><small>100k</small></button>
        </div>
        <button class="btn-panel" style="background:#444; color:white" onclick="closeM()">Cerrar</button>
    </div>

    <div id="m-tienda" class="modal">
        <h3 style="color:gold">👑 Tienda VIP</h3>
        <button class="btn-panel" onclick="alert('Comprando SVIP...')">Subir Nivel SVIP</button>
        <button class="btn-panel" onclick="alert('Comprando Aristocracia...')">Subir Aristocracia</button>
        <button class="btn-panel" style="background:#444; color:white" onclick="closeM()">Cerrar</button>
    </div>

    <div id="m-agentes" class="modal">
        <h3 style="color:#00ff00">🏦 Recargas</h3>
        <p>Contacta a un Agente para comprar Oro:</p>
        <div style="background:#222; padding:10px; border-radius:10px;"><b>Agente Melvin</b><br>WhatsApp: +1 234 567 890</div>
        <button class="btn-panel" style="margin-top:10px;" onclick="closeM()">Cerrar</button>
    </div>

    <div id="m-admin-panel" class="modal">
        <h2 style="color:var(--robot)">Panel Master ⚙️</h2>
        <input type="text" id="target-id" placeholder="Nombre del Ganador" style="width:90%; padding:10px; margin:10px 0; border-radius:8px;">
        <button class="btn-panel" style="background:var(--robot)" onclick="robotPagar()">PAGAR 17M (BEBÉ ROBOT)</button>
        <button class="btn-panel" style="background:#cc0000; color:white;" onclick="closeM()">Cerrar</button>
    </div>

    <script>
        const config = { apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4", projectId: "lluvia-live-69a05" };
        firebase.initializeApp(config);
        const db = firebase.firestore();

        let user = "Melvin"; // Pon aquí tu nombre exacto
        let miPoder = 0;

        for(let i=1; i<=9; i++) document.getElementById('sillas-box').innerHTML += `<div class="silla">👤</div>`;

        db.collection("usuarios").doc(user).onSnapshot(doc => {
            if(doc.exists) {
                const d = doc.data();
                miPoder = d.nivel_permiso || 0;
                document.getElementById('oro-txt').innerText = (d.oro || 0).toLocaleString();
                if(miPoder >= 2) document.getElementById('btn-admin-gears').style.display = 'block';
                
                const tag = document.getElementById('my-tag');
                if(miPoder === 3) { tag.innerText = "OWNER"; tag.style.color = "red"; }
            }
        });

        function showM(id) { document.getElementById(id).style.display = 'block'; }
        function closeM() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); }
    </script>
</body>
</html>
