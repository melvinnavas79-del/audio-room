<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lluvia Live - Billetera Real</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script src="https://www.paypal.com/sdk/js?client-id=AWOafs7E7hOuryPjXYaHIMvKeWhSgH65Fejg2eyY4b0BY_7xoClV0xhc45Zdr7Y5MhMGSCefLgl6X18&currency=USD"></script>

    <style>
        body { margin: 0; background: #1a0033; color: white; font-family: sans-serif; text-align: center; }
        .header { background: rgba(0,0,0,0.8); padding: 15px; border-bottom: 2px solid #ffd700; }
        .wallet-card { background: #222; border: 3px solid #ffd700; border-radius: 25px; width: 92%; margin: 20px auto; padding: 20px; box-sizing: border-box; }
        .pack-btn { background: #333; border: 2px solid #ffd700; border-radius: 15px; padding: 15px; margin-bottom: 12px; cursor: pointer; display: flex; justify-content: space-between; width: 100%; color: white; font-weight: bold; font-size: 16px; }
        #paypal-button-container { margin-top: 20px; min-height: 150px; }
        .instrucciones { font-size: 12px; color: #aaa; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div style="color: #ffd700; font-weight: bold;">💎 Lluvia Live 💎</div>
        <div style="margin-top: 10px;">💰 Mi Oro: <span id="oro-txt" style="color: #ffd700; font-size: 20px;">...</span></div>
    </div>

    <div class="wallet-card">
        <h3 style="color: #ffd700; margin-top: 0;">💳 RECARGAR ORO</h3>
        <p class="instrucciones">Selecciona un paquete para activar el pago</p>
        
        <button class="pack-btn" onclick="prepararPago('0.99', 100)">
            <span>🪙 100 Oros</span> <span style="color:#00ff00;">$0.99</span>
        </button>
        
        <button class="pack-btn" onclick="prepararPago('9.99', 1100)">
            <span>🪙 1100 Oros</span> <span style="color:#00ff00;">$9.99</span>
        </button>
        
        <button class="pack-btn" onclick="prepararPago('49.99', 5500)">
            <span>🪙 5500 Oros</span> <span style="color:#00ff00;">$49.99</span>
        </button>

        <div id="paypal-button-container"></div>
    </div>

    <script>
        // Configuración de Firebase para Lluvia Live
        const firebaseConfig = {
            apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4",
            authDomain: "lluvia-live-69a05.firebaseapp.com",
            projectId: "lluvia-live-69a05",
            storageBucket: "lluvia-live-69a05.firebasestorage.app",
            messagingSenderId: "909704512499",
            appId: "1:909704512499:web:a8f0d658fb6dbd3f610886"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // ID de usuario para la prueba (Melvin)
        let userId = "Melvin_User"; 

        // Escuchar cambios en el oro en tiempo real
        db.collection("usuarios").doc(userId).onSnapshot(doc => {
            if(doc.exists) {
                document.getElementById('oro-txt').innerText = doc.data().oro || 0;
            }
        });

        function prepararPago(monto, cantidadOro) {
            // Limpiamos el contenedor para refrescar el botón
            document.getElementById('paypal-button-container').innerHTML = ""; 
            
            paypal.Buttons({
                createOrder: (data, actions) => {
                    return actions.order.create({
                        purchase_units: [{
                            description: "Compra de " + cantidadOro + " Oros - Lluvia Live",
                            amount: { value: monto }
                        }]
                    });
                },
                onApprove: (data, actions) => {
                    return actions.order.capture().then(details => {
                        // Si el pago es exitoso, sumamos el oro en Firebase
                        db.collection("usuarios").doc(userId).update({
                            oro: firebase.firestore.FieldValue.increment(cantidadOro)
                        }).then(() => {
                            alert("¡Felicidades Melvin! Recargaste " + cantidadOro + " oros con éxito.");
                        });
                    });
                },
                onError: (err) => {
                    console.error("Error en PayPal:", err);
                    alert("Hubo un problema con la conexión de PayPal.");
                }
            }).render('#paypal-button-container');
        }
    </script>
</body>
</html>
