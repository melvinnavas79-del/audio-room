<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lluvia Live Pro</title>
    <style>
        body { margin:0; background:#0b001a; color:white; font-family:sans-serif; overflow:hidden; }
        
        /* BANNER SUPERIOR CON BRILLO */
        #premium-banner {
            width:94%; margin:10px auto; background:rgba(20,20,30,0.95); 
            border-radius:20px; border:2px solid #ffd700; display:flex; 
            justify-content:space-around; align-items:center; padding:12px 5px;
            box-shadow: 0 0 15px rgba(255,215,0,0.5);
        }

        /* ANIMACIÓN DE PULSO PARA BOTONES ACTIVOS */
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(0, 255, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0); }
        }
        
        .btn-active { animation: pulse-green 2s infinite; }

        /* BARRA DE ACCIÓN INFERIOR */
        .action-bar { 
            position:fixed; bottom:40px; width:100%; 
            display:flex; justify-content:space-evenly; align-items:center; 
        }

        .btn-round { 
            width:65px; height:65px; border-radius:50%; border:none; 
            display:flex; align-items:center; justify-content:center; 
            font-size:28px; cursor:pointer; transition: transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .btn-round:active { transform: scale(0.9); } /* Movimiento al tocar */

        /* BOTÓN DE REELS (ESTILO INSTAGRAM) */
        .btn-reels {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            width: 75px; height: 75px; font-size: 35px;
        }

        #silla-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; padding:20px; }
    </style>
</head>
<body>

<div id="main-ui">
    <div id="premium-banner">
        <div style="text-align:center; font-size:10px;">🛡️<br>CLANES</div>
        <div style="text-align:center;">
            <span style="color:#ffd700; font-weight:bold;">👑 ARISTOCRACIA SVIP</span><br>
            <span style="font-size:12px;">💰 ORO: 1000</span>
        </div>
        <div style="text-align:center; font-size:10px;">💵<br>RECARGA</div>
    </div>

    <div id="silla-grid">
        <script>
            for(let i=1; i<=9; i++){
                document.write(`<div style="text-align:center;"><div style="width:60px; height:60px; border-radius:50%; background:#1a1a1a; border:2px solid #333; margin:0 auto; display:flex; align-items:center; justify-content:center;">👤</div><div style="font-size:10px; color:#00ffcc; margin-top:5px;">Libre</div></div>`);
            }
        </script>
    </div>

    <div class="action-bar">
        <button class="btn-round" style="background:#8a2be2;" onclick="abrirSeccion('fotos')">📸</button>
        <button id="mic-btn" class="btn-round btn-active" style="background:#00ff00;" onclick="toggleMic()">🎙️</button>
        
        <button class="btn-round btn-reels" onclick="abrirReels()">🎬</button>
        
        <button id="spk-btn" class="btn-round" style="background:#00ff00;" onclick="toggleAudio()">🔊</button>
        <button class="btn-round" style="background:orange;" onclick="abrirRegalos()">🎁</button>
    </div>
</div>

<audio id="remote-audio" autoplay></audio>

<script>
    let micStatus = true;
    let audioStatus = true;

    function toggleMic() {
        micStatus = !micStatus;
        const btn = document.getElementById('mic-btn');
        btn.style.background = micStatus ? "#00ff00" : "#ff3333";
        if(micStatus) btn.classList.add('btn-active');
        else btn.classList.remove('btn-active');
        // Aquí va tu código de PeerJS para apagar el stream
    }

    function toggleAudio() {
        audioStatus = !audioStatus;
        const btn = document.getElementById('spk-btn');
        const audio = document.getElementById('remote-audio');
        btn.style.background = audioStatus ? "#00ff00" : "#ff3333";
        audio.muted = !audioStatus;
    }

    function abrirReels() {
        alert("🎬 Abriendo Reels de Lluvia Live...");
        // Aquí puedes poner el código para mostrar el reproductor de video
    }

    function abrirRegalos() {
        alert("🎁 Selecciona tu regalo para Melvin");
    }

    // Activar audio al primer toque (Requerido por navegadores)
    document.body.addEventListener('click', () => {
        const audio = document.getElementById('remote-audio');
        if (audio.paused) audio.play();
    }, { once: true });
</script>

</body>
</html>
