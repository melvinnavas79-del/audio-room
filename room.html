<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lluvia Live - Conexión ID</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Arial', sans-serif; text-align: center; height: 100vh; overflow: hidden; }
        
        /* PANTALLA DE INICIO ESTILO IMAGEN */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .logo-box { font-size: 45px; font-weight: bold; color: #00ff00; margin-bottom: 30px; }
        .input-field { width: 80%; padding: 15px; margin: 10px 0; border-radius: 12px; border: none; font-size: 20px; text-align: center; background: #fff; color: #000; }
        .btn-row { display: flex; gap: 10px; width: 85%; margin-top: 20px; }
        .btn-action { flex: 1; padding: 18px; border-radius: 12px; border: none; font-weight: bold; font-size: 18px; color: white; cursor: pointer; }

        /* SALA DE AUDIO */
        #main-app { display: none; background: #0f001e; height: 100vh; padding-top: 10px; position: relative; }
        .header-card { background: rgba(0,0,0,0.6); width: 92%; margin: 0 auto; padding: 15px; border-radius: 25px; border: 2px solid #ffd700; }
        .badge-noble { background: linear-gradient(90deg, #b8860b, #ffd700); color: black; font-weight: bold; padding: 8px 25px; border-radius: 20px; display: inline-block; font-size: 18px; }
        .tag-svip { background: #ff0000; color: white; padding: 5px 12px; border-radius: 10px; border: 1px solid white; font-size: 14px; vertical-align: middle; font-weight: bold; margin-left: 5px; box-shadow: 0 0 10px red; }

        /* Cuadrícula de Sillas */
        .sala-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; margin-top: 20px; }
        .silla-box { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #444; background: #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 25px; margin: 0 auto; }
        .silla-on { border-color: #00ff00; box-shadow: 0 0 20px #00ff00; background: #003300; }

        /* Controles Inferiores */
        .bottom-nav { position: fixed; bottom: 30px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 25px; }
        .circle-nav { width: 65px; height: 65px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; border: none; color: black; }
        
        .mic-btn { width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; font-size: 30px; margin: 10px auto; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-red { background: #ff3333; }
        .btn-green { background: #00ff00; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="logo-box">☔ Lluvia Live</div>
        <input type="text" id="user-name" class="input-field" placeholder="Tu Nombre (ej: Josue)" value="Josue">
        <input type="text" id="room-id" class="input-field" placeholder="ID de Sala (ej: 1234)" value="1234">
        
        <div class="btn-row">
            <button class="btn-action" style="background:#008000" onclick="iniciarApp('A')">Crear sala</button>
            <button class="btn-action" style="background:#0000ff" onclick="iniciarApp('B')">Entrar</button>
        </div>
    </div>

    <div id="main-app">
        <div class="header-card">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span>💰 Oro: <b id="oro-txt">0</b></span>
                <span style="color:#00ffcc">🛡️ Clan: Lluvia</span>
            </div>
            <div class="badge-noble">Noble (Aristocracia) <span id="svip-tag" class="tag-svip" style="display:none;">SVIP</span></div>
            <p style="color:#ff85a2; font-size:13px; margin-top:10px;">💕 C.P: Buscando pareja...</p>
        </div>

        <div style="margin: 15px 0; color:#ffd700; font-weight:bold;">📍 ID SALA: <span id="id-view">---</span></div>

        <button onclick="activarAudioManual()" style="background:#ff3366; color:white; border:none; padding:10px 20px; border-radius:10px; font-weight:bold; margin-bottom:10px;">🔊 ACTIVAR AUDIO DE SALA</button>

        <div style="display:flex; justify-content:center; gap:20px;">
            <div onclick="toggleMicro()"><div id="mic-icon" class="mic-btn btn-red">🎙️</div><p>Micro</p></div>
        </div>

        <div class="sala-grid" id="sillas-grid"></div>

        <div class="bottom-nav">
            <button class="circle-nav" style="background:#ffd700;" onclick="alert('Billetera')">💳<br>Wallet</button>
            <button class="circle-nav" style="background:orange; width:85px; height:85px; font-size:35px;" onclick="alert('Regalo')">🎁</button>
            <button class="circle-nav" style="background:#00d2ff;" onclick="alert('Tienda')">👑<br>VIP</button>
        </div>
    </div>

    <audio id="remote-audio" autoplay playsinline></audio>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4", projectId: "lluvia-live-69a05" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let peer, localStream, role, room, nombre;

        // Crear las 9 sillas
        const grid = document.getElementById('sillas-grid');
        for(let i=1; i<=9; i++) {
            grid.innerHTML += `<div><div class="silla-box" id="silla-${i}">👤</div><div style="font-size:10px;margin-top:5px;color:#aaa">Silla ${i}</div></div>`;
        }

        async function iniciarApp(tipo) {
            nombre = document.getElementById('user-name').value;
            room = document.getElementById('room-id').value;
            role = tipo;

            if(!nombre || !room) return alert("Pon tu nombre y el ID");

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('id-view').innerText = room;

            // Iniciar PeerJS con ID único basado en el salón y rol (A o B)
            peer = new Peer('lluvia-' + room + '-' + role);

            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', s => {
                    const audio = document.getElementById('remote-audio');
                    audio.srcObject = s;
                    audio.play();
                });
            });

            // Leer datos de Firebase (Oro y SVIP)
            db.collection("usuarios").doc(nombre).onSnapshot(doc => {
                if(doc.exists) {
                    document.getElementById('oro-txt').innerText = doc.data().oro || 0;
                    document.getElementById('svip-tag').style.display = doc.data().svip ? 'inline-block' : 'none';
                }
            });
        }

        async function toggleMicro() {
            if (!localStream) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    llamarAlOtro();
                } catch (e) { alert("Permite el micro"); return; }
            }
            
            const activo = !localStream.getAudioTracks()[0].enabled;
            localStream.getAudioTracks()[0].enabled = activo;

            document.getElementById('mic-icon').className = activo ? "mic-btn btn-green" : "mic-btn btn-red";
            
            // Marcar silla (Silla 1 para Creador, Silla 2 para Invitado)
            const nSilla = (role === 'A') ? '1' : '2';
            document.getElementById('silla-'+nSilla).className = activo ? "silla-box silla-on" : "silla-box";
            document.getElementById('silla-'+nSilla).innerText = activo ? "🎙️" : "👤";
        }

        function llamarAlOtro() {
            const destino = (role === 'A') ? 'B' : 'A';
            const call = peer.call('lluvia-' + room + '-' + destino, localStream);
            if (call) {
                call.on('stream', s => {
                    const audio = document.getElementById('remote-audio');
                    audio.srcObject = s;
                    audio.play();
                });
            }
        }

        function activarAudioManual() {
            const audio = document.getElementById('remote-audio');
            audio.play();
            alert("Audio activado forzosamente.");
        }
    </script>
</body>
</html>
