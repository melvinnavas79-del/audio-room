<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lluvia Live - PK CLANES</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --gold: #ffd700; --blue-pk: #0084ff; --red-pk: #ff004c; }
        body { margin: 0; background: #0b0015; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; height: 100vh; overflow: hidden; }
        
        /* BARRA DE PK GLOBAL / CLANES */
        .pk-container { width: 100%; height: 50px; background: #222; display: flex; position: relative; border-bottom: 2px solid var(--gold); overflow: hidden; }
        .pk-team { height: 100%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 2px black; }
        .pk-blue { background: linear-gradient(90deg, #004e92, var(--blue-pk)); width: 50%; }
        .pk-red { background: linear-gradient(90deg, var(--red-pk), #8e0000); width: 50%; }
        .pk-timer { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); padding: 2px 10px; border-radius: 10px; border: 1px solid var(--gold); font-size: 12px; z-index: 10; color: var(--gold); }
        .pk-vs { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; font-style: italic; font-weight: 900; color: white; z-index: 5; opacity: 0.5; }

        /* HEADER USUARIO */
        .header-card { background: rgba(20, 0, 40, 0.9); width: 94%; margin: 8px auto; padding: 10px; border-radius: 15px; border: 1px solid var(--gold); display: flex; align-items: center; gap: 10px; }
        .avatar-small { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--gold); }

        /* SILLAS */
        .grid-sala { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 15px; }
        .silla { background: rgba(255,255,255,0.05); width: 60px; height: 60px; border-radius: 50%; border: 1px solid #333; margin: 0 auto; display: flex; align-items: center; justify-content: center; }

        /* BOTONES ABAJO */
        .footer-nav { position: fixed; bottom: 20px; width: 100%; display: flex; justify-content: center; gap: 15px; }
        .btn-circle { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px black; }
        
        #btn-pk-start { position: fixed; top: 60px; right: 10px; background: var(--gold); color: black; border: none; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 10px; display: none; }
    </style>
</head>
<body>

    <div class="pk-container">
        <div id="pk-bar-blue" class="pk-team pk-blue">CLAN A: <span id="pts-blue">0</span></div>
        <div id="pk-bar-red" class="pk-team pk-red">CLAN B: <span id="pts-red">0</span></div>
        <div class="pk-vs">VS</div>
        <div class="pk-timer" id="timer">05:00</div>
    </div>

    <button id="btn-pk-start" onclick="iniciarPK()">INICIAR PK GLOBAL</button>

    <div id="main-app">
        <div class="header-card">
            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="avatar-small">
            <div style="text-align: left;">
                <b id="nick">Melvin</b><br>
                <small style="color:var(--gold);">💰 <span id="oro-txt">0</span></small>
            </div>
            <div style="margin-left: auto; font-size: 20px;" onclick="alert('Panel Admin')">⚙️</div>
        </div>

        <div class="grid-sala" id="sillas-box"></div>

        <div class="footer-nav">
            <button class="btn-circle" style="background:#222; border:1px solid #00ff00;">🏦</button>
            <button class="btn-circle" style="background:red; width:80px; height:80px; border:2px solid gold;" onclick="sumarPuntosPK()">🎁</button>
            <button class="btn-circle" style="background:#1a237e; border:1px solid gold;">👑</button>
        </div>
    </div>

    <script>
        const config = { apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4", projectId: "lluvia-live-69a05" };
        firebase.initializeApp(config);
        const db = firebase.firestore();

        let user = "Melvin"; 
        let ptsBlue = 0;
        let ptsRed = 0;

        for(let i=1; i<=9; i++) document.getElementById('sillas-box').innerHTML += `<div class="silla">👤</div>`;

        // Sincronizar puntos de PK desde Firebase
        db.collection("sala_actual").doc("pk_data").onSnapshot(doc => {
            if(doc.exists) {
                const d = doc.data();
                ptsBlue = d.blue || 0;
                ptsRed = d.red || 0;
                actualizarBarraPK();
            }
        });

        function actualizarBarraPK() {
            const total = ptsBlue + ptsRed || 1;
            const porcBlue = (ptsBlue / total) * 100;
            const porcRed = (ptsRed / total) * 100;

            document.getElementById('pk-bar-blue').style.width = porcBlue + "%";
            document.getElementById('pk-bar-red').style.width = porcRed + "%";
            document.getElementById('pts-blue').innerText = ptsBlue.toLocaleString();
            document.getElementById('pts-red').innerText = ptsRed.toLocaleString();
        }

        // Simular que alguien tira un regalo (para probar)
        async function sumarPuntosPK() {
            // En una app real, esto se activaría al enviar un regalo 🎁
            const equipo = Math.random() > 0.5 ? 'blue' : 'red';
            await db.collection("sala_actual").doc("pk_data").update({
                [equipo]: firebase.firestore.FieldValue.increment(1000)
            });
        }

        function iniciarPK() {
            alert("PK Global Iniciado: ¡Todos a regalar!");
            db.collection("sala_actual").doc("pk_data").set({ blue: 0, red: 0, tiempo: Date.now() });
        }

        db.collection("usuarios").doc(user).onSnapshot(doc => {
            if(doc.exists) {
                document.getElementById('oro-txt').innerText = (doc.data().oro || 0).toLocaleString();
                if(doc.data().nivel_permiso >= 3) document.getElementById('btn-pk-start').style.display = 'block';
            }
        });
    </script>
</body>
</html>
