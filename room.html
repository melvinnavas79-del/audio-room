<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lluvia Live - Sala & VIP</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=AWOafs7E7hOuryPjXYaHIMvKeWhSgH65Fejg2eyY4b0BY_7xoClV0xhc45Zdr7Y5MhMGSCefLgl6X18&currency=USD"></script>

    <style>
        body { margin: 0; background: #1a0033; color: white; font-family: sans-serif; text-align: center; }
        
        /* Sistema de Entrada a Sala */
        .pantalla-inicio { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a0033; z-index: 20000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .input-sala { padding: 15px; border-radius: 10px; border: 2px solid #ffd700; background: #222; color: white; width: 70%; font-size: 18px; margin-bottom: 20px; }
        .btn-entrar { background: #ffd700; color: black; padding: 15px 40px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; }

        /* Cabecera VIP */
        .header-sala { background: rgba(0,0,0,0.9); padding: 15px; border: 2px solid #ffd700; border-radius: 20px; width: 92%; margin: 15px auto; }
        .info-row { display: flex; justify-content: space-around; font-size: 16px; margin: 10px 0; font-weight: bold; }
        .txt-svip { color: #ff00ff; font-weight: bold; text-shadow: 0 0 10px #ff00ff; }
        .txt-aristocracia { color: #ffd700; font-weight: bold; }

        /* Controles */
        .panel-control { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .btn-accion { background: #222; border: 2px solid #555; border-radius: 12px; padding: 15px; width: 250px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-on { border-color: #ffd700; color: #ffd700; box-shadow: 0 0 10px #ffd700; }

        /* Billetera */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a0033; z-index: 10000; padding-top: 20px; overflow-y: auto; }
        .card-pago { background: #222; border: 2px solid #ffd700; border-radius: 20px; width: 90%; margin: auto; padding: 25px; box-sizing: border-box; }
        .opcion-pack { background: #333; border: 1px solid #ffd700; padding: 18px; margin-bottom: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; }
        
        .btn-wallet-fixed { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #ffd700; color: black; padding: 18px 50px; border-radius: 40px; font-weight: bold; border: none; font-size: 18px; box-shadow: 0 0 20px #ffd700; }
    </style>
</head>
<body>

    <div id="lobby" class="pantalla-inicio">
        <h1 style="color: #ffd700;">Lluvia Live</h1>
        <input type="number" id="num-sala" class="input-sala" placeholder="Número de Sala">
        <button class="btn-entrar" onclick="unirseASala()">ENTRAR A SALA</button>
        <button onclick="unirseASala()" style="background: none; color: #ffd700; margin-top: 20px; border: none; text-decoration: underline;">O CREAR SALA</button>
    </div>

    <div id="main-interface" style="display:none;">
        <div class="header-sala">
            <div style="font-size: 24px; color: #ffd700; margin-bottom: 5px;">👤 <span id="id-sala-txt">100</span></div>
            <div class="info-row">
                <span>💰 Oro: <span id="oro-cont" style="color:#ffd700;">0</span></span>
                <span>🛡️ Clan: <span style="color:#ff4444;">Lluvia</span></span>
            </div>
            <div style="border-top: 1px solid #444; padding-top: 10px;">
                <span class="txt-aristocracia">💎 Aristocracia</span> <span class="txt-svip">SVIP</span>
            </div>
        </div>

        <div class="panel-control">
            <div id="mic-icon" style="font-size: 50px; margin-bottom: 10px;">🎙️</div>
            <button id="btn-audio" class="btn-accion" onclick="toggleAudio()">🔊 ACTIVAR BOCINA</button>
            <button id="btn-micro" class="btn-accion" onclick="toggleMicro()">🎙️ ENCENDER MICRO</button>
        </div>

        <button class="btn-wallet-fixed" onclick="abrirTienda()">💳 BILLETERA</button>
    </div>

    <div id="tienda" class="modal">
        <div class="card-pago">
            <h2 style="color: #ffd700;">Comprar Oros</h2>
            <div class="opcion-pack" onclick="generarPago('0.99', 100)"><span>🪙 100 Oros</span> <b>$0.99</b></div>
            <div class="opcion-pack" onclick="generarPago('9.99', 1100)"><span>🪙 1100 Oros</span> <b>$9.99</b></div>
            <div class="opcion-pack" onclick="generarPago('49.99', 6000)"><span>🪙 6000 Oros</span> <b>$49.99</b></div>
            <div id="paypal-render" style="margin-top: 20px;"></div>
            <button onclick="cerrarTienda()" style="margin-top: 25px; width: 100%; padding: 15px; background: #ff4444; color: white; border: none; border-radius: 10px; font-weight: bold;">CERRAR</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA9sd0fg7f55DX7Ej_TK_BJHrNFTmtr5J4",
            authDomain: "lluvia-live-69a05.firebaseapp.com",
            projectId: "lluvia-live-69a05",
            storageBucket: "lluvia-live-69a05.firebasestorage.app",
            messagingSenderId: "909704512499",
            appId: "1:909704512499:web:a8f0d658fb6dbd3f610886"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let userId = "Melvin_User";

        function unirseASala() {
            let sala = document.getElementById('num-sala').value || "100";
            document.getElementById('id-sala-txt').innerText = sala;
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('main-interface').style.display = 'block';
            
            // Cargar Oro de Firebase
            db.collection("usuarios").doc(userId).onSnapshot(doc => {
                document.getElementById('oro-cont').innerText = doc.exists ? (doc.data().oro || 0) : 0;
            });
        }

        // Lógica de Audio y Micro
        let aOn = false, mOn = false;
        function toggleAudio() {
            aOn = !aOn;
            const b = document.getElementById('btn-audio');
            b.innerText = aOn ? "🔊 BOCINA: ON" : "🔊 ACTIVAR BOCINA";
            b.className = aOn ? "btn-accion btn-on" : "btn-accion";
            new (window.AudioContext || window.webkitAudioContext)().resume();
        }
        function toggleMicro() {
            mOn = !mOn;
            const b = document.getElementById('btn-micro');
            b.innerText = mOn ? "🎙️ MICRO: ON" : "🎙️ ENCENDER MICRO";
            b.className = mOn ? "btn-accion btn-on" : "btn-accion";
        }

        // Billetera
        function abrirTienda() { document.getElementById('tienda').style.display = 'block'; }
        function cerrarTienda() { 
            document.getElementById('tienda').style.display = 'none'; 
            document.getElementById('paypal-render').innerHTML = ""; 
        }

        function generarPago(precio, cantidad) {
            const container = document.getElementById('paypal-render');
            container.innerHTML = "<p>Cargando PayPal...</p>";
            paypal.Buttons({
                style: { layout: 'vertical', color: 'gold', shape: 'pill' },
                createOrder: (data, actions) => { return actions.order.create({ purchase_units: [{ amount: { value: precio } }] }); },
                onApprove: (data, actions) => {
                    return actions.order.capture().then(details => {
                        db.collection("usuarios").doc(userId).update({ oro: firebase.firestore.FieldValue.increment(cantidad) });
                        alert("¡Oros añadidos!");
                        cerrarTienda();
                    });
                }
            }).render('#paypal-render');
        }
    </script>
</body>
</html>
