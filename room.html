<script>

// =======================
// VARIABLES
// =======================
let peer, stream;
let role, room, nombre;
let conectado = false;

// =======================
// ENTRAR SALA
// =======================
async function entrar(tipo){

    nombre = document.getElementById("nombre").value;
    room = document.getElementById("room").value;
    role = tipo;

    if(!nombre || !room){
        alert("Faltan datos");
        return;
    }

    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("roomTxt").innerText = room;

    // crear peer
    peer = new Peer("room-"+room+"-"+role);

    // pedir mic DESDE EL INICIO 🔥
    try{
        stream = await navigator.mediaDevices.getUserMedia({audio:true});
    }catch{
        alert("Permite micrófono");
    }

    // recibir llamada
    peer.on("call", call=>{
        call.answer(stream);

        call.on("stream", s=>{
            document.getElementById("audio").srcObject = s;
            console.log("Recibiendo audio 🔊");
        });
    });

    // cuando conecta → llamar automáticamente
    peer.on("open", id=>{
        console.log("Conectado como:", id);

        setTimeout(()=>{
            conectarConOtro();
        }, 2000);
    });

    crearSillas();
}

// =======================
// CONECTAR ENTRE TELÉFONOS
// =======================
function conectarConOtro(){

    if(conectado) return;

    let destino = role === "A" ? "B" : "A";

    let call = peer.call("room-"+room+"-"+destino, stream);

    if(call){
        conectado = true;

        call.on("stream", s=>{
            document.getElementById("audio").srcObject = s;
            console.log("Audio activo 🔥");
        });
    }
}

// =======================
// MICRO
// =======================
function toggleMic(){

    if(!stream) return;

    let enabled = !stream.getAudioTracks()[0].enabled;
    stream.getAudioTracks()[0].enabled = enabled;

    alert(enabled ? "🎤 Mic ON" : "🎤 Mic OFF");
}

// =======================
// BOCINA
// =======================
function toggleSpk(){
    let audio = document.getElementById("audio");
    audio.muted = !audio.muted;
}

// =======================
// SILLAS
// =======================
function crearSillas(){

    let div = document.getElementById("sillas");
    div.innerHTML = "";

    for(let i=1;i<=9;i++){
        div.innerHTML += `
        <div onclick="sentarse(${i})">
            <div class="circle" id="silla-${i}">👤</div>
            <small>Silla ${i}</small>
        </div>`;
    }
}

function sentarse(num){
    document.getElementById("silla-"+num).innerHTML = "👤🎤";
}

</script>
