<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lluvia Live PRO</title>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
body { margin:0; background:#0b001a; color:white; font-family:sans-serif; }

/* LOGIN */
#login { 
    position:fixed; inset:0; background:#000; 
    display:flex; flex-direction:column; 
    justify-content:center; align-items:center;
}

input { padding:15px; margin:10px; border-radius:10px; border:none; }

button { padding:15px; margin:5px; border:none; border-radius:10px; }

/* APP */
#app { display:none; }

.sillas { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; padding:20px; }

.circle { width:60px; height:60px; border-radius:50%; background:#1a1a1a; display:flex; align-items:center; justify-content:center; margin:auto; }

.bar { position:fixed; bottom:40px; width:100%; display:flex; justify-content:space-evenly; }

</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
    <h2>Entrar a Sala</h2>
    <input id="nombre" placeholder="Tu nombre">
    <input id="room" placeholder="ID sala">
    <button onclick="entrar('A')">Crear Sala</button>
    <button onclick="entrar('B')">Entrar</button>
</div>

<!-- APP -->
<div id="app">

<h3>Sala: <span id="roomTxt"></span></h3>

<div class="sillas" id="sillas"></div>

<div class="bar">
    <button onclick="toggleMic()">🎤</button>
    <button onclick="toggleSpk()">🔊</button>
</div>

</div>

<audio id="audio" autoplay playsinline></audio>

<script>

// =======================
// VARIABLES
// =======================
let peer, stream;
let role, room, nombre;

// =======================
// ENTRAR SALA
// =======================
async function entrar(tipo){

    nombre = document.getElementById("nombre").value;
    room = document.getElementById("room").value;
    role = tipo;

    if(!nombre || !room){
        alert("Faltan datos");
        return;
    }

    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("roomTxt").innerText = room;

    peer = new Peer("room-"+room+"-"+role);

    // recibir llamada
    peer.on("call", call=>{
        call.answer(stream);
        call.on("stream", s=>{
            document.getElementById("audio").srcObject = s;
        });
    });

    crearSillas();
}

// =======================
// MICRO
// =======================
async function toggleMic(){

    if(!stream){
        try{
            stream = await navigator.mediaDevices.getUserMedia({audio:true});

            let destino = role === "A" ? "B" : "A";

            peer.call("room-"+room+"-"+destino, stream);

        }catch{
            alert("Permiso micrófono");
        }
    }
}

// =======================
// BOCINA
// =======================
function toggleSpk(){
    let audio = document.getElementById("audio");
    audio.muted = !audio.muted;
}

// =======================
// SILLAS
// =======================
function crearSillas(){

    let div = document.getElementById("sillas");

    for(let i=1;i<=9;i++){
        div.innerHTML += `
        <div onclick="sentarse(${i})">
            <div class="circle" id="silla-${i}">👤</div>
            <small>Silla ${i}</small>
        </div>`;
    }
}

function sentarse(num){
    document.getElementById("silla-"+num).innerHTML = "👤🎤";
}

</script>

</body>
</html>
